# Tangerine invariant registry — the machine-readable source of truth.
#
# This file is the INPUT to scripts/gen_invariants.sh, which renders
# docs/current/invariants.md. The markdown catalog is GENERATED EVIDENCE:
# the CI evidence-gate job regenerates it and runs `git diff --exit-code`,
# so a hand-edited or drifted catalog cannot merge.
#
# Schema:
#   id            unique invariant identifier (INV-<DOMAIN>-<NNN>)
#   stage         compiler stage that owns the claim
#   severity      error | warning
#   summary       what the invariant guarantees
#   status        implemented | scoped
#                   implemented: the claim is backed by an assertion
#                     implementation (file:function) that mechanically
#                     checks it, and by positive/negative/mutation tests.
#                   scoped: the claim is explicitly removed from the
#                     verified callable — the surface does not exist in
#                     the callable path (no caller / inert option / no
#                     pass exists / construct rejected by the bootstrap
#                     subset), with the concrete action in `scoping`.
#   assertion     "path/file:function" — the assertion implementation.
#                 The generator verifies the file exists and (for Swift,
#                 .tg, .sh) that the function token appears in it.
#   positive      globs of positive tests (must match at least one file)
#   negative      globs of negative/rejection tests
#   mutation      globs of mutation tests (a mutation of the surface must
#                 be rejected/change behavior)
#   coverage      free-text statement of what the assertion covers
#   verified_sha  the last commit the claim was verified against (the
#                 generator requires it to resolve to a real commit, and
#                 the GLOBAL last_verified_sha below must be the current
#                 HEAD at generation time — a stale sha fails the
#                 generation, so the sha is bumped when the tree moves)
#   former_status partial | design | not-applicable — the status the old
#                 prose catalog gave (present only for entries that were
#                 NOT implemented there)
#   classification implemented-with-assertions | explicitly-scoped —
#                 REQUIRED for every entry with a former_status: the
#                 reviewer's classification of how the gap was closed.
#   scoping       the concrete scoping action for explicitly-scoped
#                 entries ("the surface removed from the callable").
#
# The generator fails (exit non-zero) on: duplicate IDs, a missing
# assertion file, an absent function token, a test glob that matches
# nothing, a malformed or non-resolving verified_sha (git resolve), a
# STALE global last_verified_sha (not the current HEAD at generation),
# an entry with former_status but no classification, or a classification
# value outside the vocabulary.


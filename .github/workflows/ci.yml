# Tangerine CI/CD Pipeline
#
# Radical simplification per the bootstrap audit:
#   macOS/AArch64 bootstrap fixed point
#         -> stage3 artifact
#         -> bootstrap tests / conformance / stdlib / tooling
#
# Everything that needs `tg` on macOS downloads the validated stage3 artifact
# from the `bootstrap` job. There is no pretend Linux/x86_64 self-host matrix
# built from a macOS artifact: the macOS/aarch64 stage3 binary (Mach-O) cannot
# run on Linux. The native Linux x86-64 runtime evidence is produced FROM
# SOURCE on an Ubuntu runner by the `linux-x86-64-native` job (stage0 Swift
# seed -> the stage ladder -> the native canaries / epoll / pthread / DB /
# TLS suites) — the only legitimate Linux runtime evidence. The empty
# `build/tg` placeholder fallback has been removed.
#
# ────────────────────────────────────────────────────────────────────────────
# MAIN-BRANCH PROTECTION — THE DOCUMENTED REQUIRED-CHECK POLICY
# (the reviewer's "no admin bypass for ordinary merges" item)
# ────────────────────────────────────────────────────────────────────────────
# The merge gate for `main` is the REQUIRED CHECKS list below. It IS the
# enforced gate: every check in the list must be green before an ordinary
# merge, and NO ADMIN BYPASS applies to ordinary merges (the documented
# branch-protection policy — an admin override is reserved for the
# release-freeze emergency path only, and even that path must pass the
# release-freeze job's path-set gate). The list is machine-verified by the
# `evidence-gate` job: every documented check id must exist as a job in
# this workflow AND (except the separately-required CodeQL check) must be
# a dependency of the `release-gate` aggregate job, so the policy cannot
# drift from the workflow's job list or from the aggregate's needs: list.
#
# THE SINGLE REQUIRED CONTEXT — the `release-gate` aggregate. Its needs:
# list IS the critical job set (bootstrap, lint, conformance, abi-platform,
# allocator, atomic-litmus, cfg-matrix, cross-compile, crypto-kat,
# db-integration-mysql, db-integration-postgres, doctests, evidence-gate,
# gfx-ui, gfx-ui-visual, release-proof, stdlib-e106-sweep,
# stdlib-integration, stdlib-new-modules, verifier-projection,
# verifier-stress, workflow-lint). The job runs `if: always()` and its
# check step inspects every dependency's result (toJSON(needs)): it lists
# each dependency whose result is not success and exits nonzero when any
# failed. Requiring ONE context in the ruleset means the gate cannot
# drift: a new critical job must be ADDED to release-gate's needs, and
# the evidence-gate job machine-verifies that the documented list equals
# the aggregate's dependency list.
#
# THE MACHINE-VERIFIED SET — `.github/release_required_jobs.txt` (the
# reviewer's item 35): the exact release-required job names, one per
# line. The evidence-gate asserts EXACT SET EQUALITY —
# set(release_required_jobs.txt) == set(release-gate.needs) — both
# directions, no subset tests. The policy cannot drift from the file or
# from the aggregate.
#
# THE RELEASE PROOF — the `release-proof` job (the reviewer's item 36):
# after the tests ran, it generates the TANGERINE RELEASE PROOF from the
# TESTED SHA (scripts/gen_release_proof.sh: the inventory, the semantic
# checks, the manifest/registry generations, the API manifest's
# release-check, the counts, and the RELEASE_100 = TRUE/FALSE line). The
# checks that require the ladder (the self-host fixed point, the
# cross-stage, the native runs) are marked PENDING-UNTIL-LADDER unless
# the ladder evidence exists AND VALIDATES — build/release_evidence.json,
# written ONLY by scripts/gen_status.sh --release-evidence from the
# tested SHA + the run artifacts (the `status` job runs that mode; a
# failing release gate writes no evidence file and FAILS the status job
# — the honest state, and the reason `status` stays outside the ordinary
# merge gate). The proof generator VALIDATES the evidence against the
# release-evidence schema (scripts/release_evidence_schema.sh — the
# required jobs' conclusions, the required artifact set with the
# per-artifact sha-256 read from the actual files, the stage binaries'
# hashes, the stage2 == stage3 / semantic-fingerprint equality proofs,
# the native-lane outputs): a missing required artifact, an extra
# unlisted artifact, a failed/skipped job, a mismatched hash, a missing
# fingerprint, or an absent equality proof FAILS the categories — the
# matching-SHA test alone is never a proof. THE RELEASE-100 GATE: the
# job generates the proof with --gate, so a proof whose verdict is
# RELEASE_100 = FALSE (any FAIL or PENDING-UNTIL-LADDER category or
# nonzero count) FAILS the release-proof job — the mere report
# generation is never the gate, and without the status job's evidence
# artifact the categories stay PENDING and the gate fails.
#
# REQUIRED CHECKS FOR MAIN (each id is a job in this workflow; the
# machine-verified authority is `.github/release_required_jobs.txt`):
#   release-gate         THE AGGREGATE — the ONE required status check for
#                        ordinary merges: green only when EVERY critical
#                        job in its needs: succeeded (the check step lists
#                        the failed dependencies and exits nonzero on any
#                        failure). The needs: list == the release-required
#                        job set (the evidence-gate asserts the exact
#                        equality against release_required_jobs.txt).
#   sast                 SAST (CodeQL) — required SEPARATELY: the CodeQL
#                        action records its own check run named "CodeQL"
#                        (that name is a check-run context, not a job id),
#                        so the ruleset requires the "CodeQL" context in
#                        addition to release-gate; CodeQL is deliberately
#                        not an aggregate dependency and not in the file
#
# THE ACTUAL GITHUB RULESET CONFIGURATION (the branch-protection policy
# this file documents; set it once in Settings -> Rules -> Rulesets ->
# New ruleset, target branches: main, enforcement: active):
#     Rule 1 — "Require status checks to pass (before merging)":
#       The required-status-checks contexts are EXACTLY TWO check-run
#       names:
#         + release-gate   the aggregate above — every critical job is a
#                          transitive dependency of this ONE context
#         + CodeQL         the check run the sast job's CodeQL action
#                          records — required separately because a ruleset
#                          can only require check-run contexts, and the
#                          CodeQL check run exists independently of the
#                          aggregate
#       Nothing else is listed in the ruleset: `bench`/`docs` are
#       main-branch-only EXTRAS (baselining, Pages deploy), the Linux
#       evidence job (linux-x86-64-native) is NOT part of the ordinary
#       merge gate until its native host-runtime evidence is proven, and
#       the `release-freeze` job gates release/** PRs (the permitted path
#       set + reviewed waivers).
#     Rule 2 — "Require a pull request before merging" (with the
#       repository's approval policy) + "Require conversation resolution".
#     Bypasses: NONE for ordinary merges (no "admin bypass"); an admin
#       override is reserved for the release-freeze emergency path only.
# ────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    # release/** PR bases must trigger the workflow or the release-freeze job
    # (if: startsWith(github.base_ref, 'release/')) can never run — a freeze
    # gate that cannot trigger is dead code.
    branches: [main, release/**]

env:
  TG_VERSION: "0.1.0"
  # Pinned known-good benchmark baseline release tag. The bench job fails when
  # the artifact is absent (no self-baselining).
  TG_BENCH_BASELINE_TAG: "tg-bench-baseline-v1"

jobs:
  # ———————————————————————————————————————
  # From-source bootstrap fixed-point
  # Proves: stage0 (Swift) -> stage1 -> stage2 -> stage3, stage2 == stage3.
  # Produces the validated stage3 artifact consumed by every other job.
  # ———————————————————————————————————————
  bootstrap:
    name: Bootstrap fixed point (macos aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift 6 toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Verify Swift toolchain
        run: swift --version

      - name: Run full bootstrap (stage0 -> stage1 -> stage2 -> stage3)
        env:
          TG_BOOTSTRAP_TRACE: "1"
        run: bash ./run_bootstrap.sh

      - name: Upload bootstrap logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs
          path: build/bootstrap/

      - name: Upload phase fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-fingerprints
          path: build/.fingerprints/

      - name: Upload native canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-native-tests
          path: build/.native_tests/

      - name: Upload stage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: |
            build/tg_stage1
            build/tg_stage2
            build/tg_stage3

  # ———————————————————————————————————————
  # Reusable step: materialize the validated stage3 artifact as build/tg.
  # All tg-consuming jobs `needs: bootstrap` and run on macos-14 (the only
  # host that can execute the macOS/aarch64 stage3 binary).
  # ———————————————————————————————————————

  # ———————————————————————————————————————
  # Lint & Format
  # ———————————————————————————————————————
  lint:
    name: Lint & Format
    runs-on: macos-14
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/

      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg

      - name: Check formatting
        run: |
          ./build/tg fmt --check tg_compiler/*.tg std/*.tg
          echo "✓ All files formatted correctly"

      - name: Check source encoding integrity
        run: |
          python3 scripts/check_encoding.py

      - name: Check Tangerine control-flow forms
        run: |
          python3 scripts/check_tg_control_flow_forms.py

      - name: Run linter
        run: |
          ./build/tg lint tg_compiler/*.tg std/*.tg --deny all

      - name: Check unsafe usage
        run: |
          ./build/tg check --unsafe-report tg_compiler/*.tg std/*.tg

  # ———————————————————————————————————————
  # Benchmarks (main branch only)
  # ———————————————————————————————————————
  bench:
    name: Benchmarks
    runs-on: macos-14
    if: github.ref == 'refs/heads/main'
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/

      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg

      - name: Fetch pinned benchmark baseline (no self-baselining)
        run: |
          set -euo pipefail
          if ! gh release download "$TG_BENCH_BASELINE_TAG" \
               --repo "$GITHUB_REPOSITORY" \
               --pattern bench_baseline.json \
               --dir . --clobber 2>/dev/null; then
            echo "::error::benchmark baseline missing from pinned release '$TG_BENCH_BASELINE_TAG'; absence of a pinned known-good baseline is a CI configuration failure — publish bench_baseline.json to that release before benchmarking"
            exit 1
          fi
          echo "Pinned baseline fetched from release '$TG_BENCH_BASELINE_TAG'"

      - name: Run benchmarks
        run: |
          ./build/tg bench --json > bench_results.json

      - name: Compare with pinned baseline
        run: |
          ./build/tg bench --baseline bench_baseline.json > bench_comparison.txt
          cat bench_comparison.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench_results.json
            bench_comparison.txt

  # ———————————————————————————————————————
  # Documentation
  # ———————————————————————————————————————
  docs:
    name: Generate Documentation
    runs-on: macos-14
    needs: bootstrap
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/

      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg

      - name: Generate docs
        run: |
          ./build/tg doc --format html --output docs/api/ std/*.tg

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/api/

  # ———————————————————————————————————————
  # Conformance Suite
  # ———————————————————————————————————————
  conformance:
    name: Conformance Tests
    runs-on: macos-14
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/

      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg

      - name: Run parser conformance
        run: |
          for f in golden/frontend_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ Parser conformance passed"

      - name: Run type-check conformance
        run: |
          for f in golden/types_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ Type-check conformance passed"

      - name: Run access/resource/set/sink/deinit/capability/generic conformance (manifest-driven headline)
        run: |
          bash tests/run_conformance_canaries.sh ./build/tg
          echo "✓ Ownership/access conformance headline passed (manifest-driven)"

      - name: Run historical borrow-era golden tests (kept for history; not the headline)
        run: |
          for f in golden/borrow_01.tg golden/borrow_02.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ Historical borrow-era tests passed"

      - name: Run MIR/SSA conformance
        run: |
          for f in golden/mir_*.tg golden/ssa_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ MIR/SSA conformance passed"

      - name: Run full smoke test
        run: |
          ./build/tg build golden/smoke_test.tg
          echo "✓ Smoke test passed"

      - name: Run diagnostics quality tests
        run: |
          echo "Testing golden/diagnostics_quality.tg..."
          ./build/tg check golden/diagnostics_quality.tg 2>&1 | tee diag_output.txt
          echo "✓ Diagnostics quality tests executed"

      - name: Run agentic audit
        run: |
          ./build/tg agent audit . | tee audit_report.txt
          echo "✓ Agentic audit completed"

      - name: Run stdlib tests
        run: |
          ./build/tg test golden/stdlib_tests.tg
          echo "✓ Stdlib tests passed"

      - name: Memory usage tracking
        run: |
          echo "Measuring compiler memory usage..."
          ./build/tg build --verbose golden/smoke_test.tg 2>&1 | tee memory_report.txt
          echo "✓ Memory usage tracked"

  # ———————————————————————————————————————
  # GFX/UI Module Tests (§22)
  # Runs on macos-14 with the validated stage3 artifact.
  # ———————————————————————————————————————
  gfx-ui:
    name: GFX/UI
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: GFX/UI module compilation check
        run: make test-gfx-ui
      - name: Stub scan
        run: make stub-scan
      - name: ABI layout check
        run: make abi-layout-check
      - name: Unit checks (geometry)
        run: ./build/tg test tests/unit/test_geom.tg
      - name: Unit checks (events)
        run: ./build/tg test tests/unit/test_events.tg
      - name: Unit checks (paint)
        run: ./build/tg test tests/unit/test_paint.tg
      - name: Unit checks (text)
        run: ./build/tg test tests/unit/test_text.tg
      - name: Unit checks (capability)
        run: ./build/tg test tests/unit/test_capability.tg
      - name: Integration checks
        run: ./build/tg test tests/integration/test_pipelines.tg
      - name: ABI conformance checks
        run: ./build/tg test tests/abi/test_abi_conformance.tg
      - name: Consistency checks
        run: ./build/tg test tests/consistency/test_consistency.tg

  gfx-ui-visual:
    name: GFX/UI Visual Regression
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Golden visual regression checks
        run: ./build/tg test tests/golden/test_visual_regression.tg
      - name: Determinism/replay checks
        run: ./build/tg test tests/determinism/test_replay.tg
      - name: Fuzz/property checks
        run: ./build/tg test tests/fuzz/test_fuzz.tg
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: target/visual-diffs/

  gfx-ui-gate:
    name: GFX/UI Required Gate
    needs: [gfx-ui, gfx-ui-visual]
    runs-on: macos-14
    steps:
      - name: All GFX/UI checks passed
        run: echo "✓ All GFX/UI CI gates passed"

  # ———————————————————————————————————————
  # Evidence gate (REQUIRED — the generate-then-diff discipline)
  # Regenerates the canary manifests' self-description (the suite count +
  # the manifest sha-256 + the test-list sha-256), the feature registry
  # (features.toml -> feature_registry.md) and the reviewer's item 34
  # normative spec docs (the five machine-readable schemas ->
  # language_spec.md / target_capabilities.md / pipeline_stages.md /
  # abi_layout.md / stabilized_layout_tables.md / test_requirements.md)
  # and runs `git diff --exit-code`:
  # a STALE COMMITTED COUNT CANNOT MERGE, and a drifted hand-edited
  # registry cannot merge either. Also machine-verifies the RELEASE-
  # REQUIRED JOBS set (the reviewer's item 35): EXACT SET EQUALITY
  # between .github/release_required_jobs.txt and the release-gate
  # aggregate's needs: list — no subset tests — and runs the structural
  # doctest coverage gate (the compiler-backed doctest path is the
  # `doctests` job).
  # Runs without the bootstrap artifact (pure shell + python3).
  # ———————————————————————————————————————
  evidence-gate:
    name: Evidence gate (generate-then-diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the canary manifest self-description (count + manifest sha256 + test-list sha256)
        run: |
          set -euo pipefail
          bash ./scripts/gen_status.sh --refresh-manifests
          git diff --exit-code -- tests/canary/MANIFEST tests/canary_neg/MANIFEST tests/arm64/MANIFEST
          echo "✓ Canary manifests are current (a stale committed count cannot merge)"

      - name: Regenerate the feature registry (features.toml -> feature_registry.md)
        run: |
          set -euo pipefail
          bash ./scripts/gen_feature_registry.sh
          git diff --exit-code -- features.toml docs/current/feature_registry.md
          echo "✓ The feature registry is current (generated evidence; a drifted registry cannot merge)"

      - name: Regenerate the normative spec docs (the five machine-readable schemas -> the generated docs)
        run: |
          set -euo pipefail
          # The reviewer's item 34 generate-then-diff discipline: the manually
          # maintained normative facts reduced to the machine-readable schemas
          # (language_spec.toml, target_capabilities.toml, abi_schema.toml,
          # compiler_pipeline.toml, stdlib_contracts.toml) + the generated docs.
          # gen_spec_docs.sh renders the target matrix, the pipeline stages,
          # the ABI layout tables, the stabilized layout tables, the language
          # spec tables and the exact test requirements from the schemas (and
          # regenerates the feature registry + the stdlib completeness doc),
          # mechanically verifying every evidence artifact exists. A stale
          # hand-edited schema OR generated doc cannot merge.
          bash ./scripts/gen_spec_docs.sh
          git diff --exit-code -- \
            docs/current/language_spec.toml docs/current/language_spec.md \
            docs/current/target_capabilities.toml docs/current/target_capabilities.md \
            docs/current/abi_schema.toml docs/current/abi_layout.md \
            docs/current/stabilized_layout_tables.md \
            docs/current/compiler_pipeline.toml docs/current/pipeline_stages.md \
            docs/current/stdlib_contracts.toml docs/current/stdlib_completeness.md \
            docs/current/test_requirements.md
          echo "✓ The normative spec docs are current (generated evidence; a stale hand-edited doc cannot merge)"

      - name: Verify the RELEASE-REQUIRED JOBS set (exact equality with the release-gate aggregate)
        run: |
          set -euo pipefail
          # The reviewer's item 35: .github/release_required_jobs.txt is the
          # machine-readable authority for the release-required job names.
          # This step asserts EXACT SET EQUALITY —
          #   set(release_required_jobs.txt) == set(release-gate.needs)
          # — both directions, no subset tests — and that every name is a
          # job in this workflow (a needs: entry without a job definition is
          # a YAML error anyway; the check keeps the failure local and
          # readable).
          FILE=".github/release_required_jobs.txt"
          RG_NEEDS="$(awk '/^  release-gate:/{f=1} f && /needs:/{print; exit}' .github/workflows/ci.yml)"
          python3 - "$FILE" "$RG_NEEDS" .github/workflows/ci.yml <<'PY'
          import re, sys
          file_path, needs_line, workflow = sys.argv[1], sys.argv[2], sys.argv[3]
          file_jobs = set()
          with open(file_path, encoding="utf-8") as fh:
              for line in fh:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  if not re.fullmatch(r"[a-z0-9-]+", line):
                      print("::error::release_required_jobs.txt has a malformed entry: %r" % line)
                      sys.exit(1)
                  file_jobs.add(line)
          needs_jobs = set()
          needs_m = re.search(r"needs:\s*\[([^\]]*)\]", needs_line)
          if not needs_m:
              print("::error::the release-gate aggregate job has no needs: list (the single required check)")
              sys.exit(1)
          needs_jobs = set(x for x in re.findall(r"[a-z0-9-]+", needs_m.group(1)))
          only_file = sorted(file_jobs - needs_jobs)
          only_needs = sorted(needs_jobs - file_jobs)
          missing_jobs = sorted(j for j in file_jobs if not re.search(r"^  %s:" % re.escape(j), open(workflow, encoding="utf-8").read(), re.M))
          if not file_jobs:
              print("::error::%s lists no release-required jobs" % file_path)
              sys.exit(1)
          if missing_jobs:
              print("::error::release-required job(s) are not jobs in this workflow: %s" % ", ".join(missing_jobs))
              sys.exit(1)
          if only_file or only_needs:
              if only_file:
                  print("::error::job(s) in release_required_jobs.txt but NOT in release-gate.needs: %s (the exact set equality requires adding them to the aggregate's needs:)" % ", ".join(only_file))
              if only_needs:
                  print("::error::job(s) in release-gate.needs but NOT in release_required_jobs.txt: %s (the exact set equality requires adding them to the file)" % ", ".join(only_needs))
              print("::error::the release-required set is NOT the exact equality: set(file) != set(release-gate.needs) — no subset tests are accepted")
              sys.exit(1)
          print("  [ok] %d release-required job(s) == the release-gate aggregate's needs: (exact set equality)" % len(file_jobs))
          PY
          echo "✓ The RELEASE-REQUIRED JOBS set (release_required_jobs.txt) equals the release-gate aggregate's needs: list exactly — set(file) == set(release-gate.needs), no subset tests (no admin bypass for ordinary merges)"

      - name: Run the structural doctest coverage gate (the compiler-backed path is the doctests job)
        run: |
          bash ./scripts/check_doctests.sh
          echo "✓ Every docs/current document is doctested or documented-excluded (history never scanned)"

      - name: Run the release-evidence schema tests (the P0 fail-closed contract)
        run: |
          bash tests/run_release_evidence_schema_tests.sh
          echo "✓ The release-evidence schema tests passed (missing artifact / wrong hash / failed job / extra artifact fail; a complete valid evidence set passes)"

  # ———————————————————————————————————————
  # Status snapshot (tested SHA + test-artifact hashes + the release
  # evidence)
  # Generates STATUS.txt FROM THE TESTED SHA (the CI checked-out commit)
  # after the tests ran, hashing the uploaded test artifacts (bootstrap
  # phase fingerprints, native canary outputs, cross-lane / litmus
  # binaries, the stage binaries, the Linux stage fingerprints + native
  # canaries), and uploads the snapshot as the
  # `status-snapshot-<tested-sha>` artifact — the artifact NAME is tied
  # to the tested SHA. The snapshot carries the EVIDENCE fields: the
  # repository SHA, the timestamp, the workflow run identity, the canary
  # suites' self-describing counts/hashes, the target suites, the
  # std-module counts, the ABI/integration suites, and the CI-run-
  # provided stage hashes / phase fingerprints (parsed by gen_status.sh
  # from the downloaded fingerprint artifacts).
  # --release-evidence (the reviewer's items 32/36 + the API-manifest
  # path) runs the RELEASE GATES from the tested SHA — the API-manifest
  # release check, the completeness enumeration, the run artifacts — and
  # writes build/release_evidence.json THROUGH THE RELEASE-EVIDENCE
  # SCHEMA (scripts/release_evidence_schema.sh): the workflow run
  # identity, the per-job conclusions (--job-results = toJSON(needs),
  # the ACTUAL observed results), the required artifact set with the
  # PER-ARTIFACT sha-256 read from the ACTUAL FILES (each downloaded
  # artifact lands in its own subdirectory of build/.status_artifacts/),
  # the stage binaries' hashes, the stage2 == stage3 / semantic-
  # fingerprint equality verdicts (the equality checks' actual results),
  # and the native-lane outputs — there is no "present" shorthand. The
  # release-proof job validates this file against the schema; a failing
  # release gate writes NO evidence file and FAILS this job (the honest
  # state: a release cannot be gated on this run); `status` is not a
  # release-gate dependency, so the ordinary merge gate stays green —
  # the failure is recorded in the release-proof artifact instead
  # (RELEASE_100 = FALSE FAILS the release-proof job's gate).
  # The COMMITTED STATUS.txt is the SHA-independent source-state
  # description and points here; it is never regenerated from a commit.
  # ———————————————————————————————————————
  status:
    name: Status snapshot (tested SHA + artifact hashes)
    needs: [abi-platform, allocator, atomic-litmus, bootstrap, cfg-matrix, conformance, cross-compile, crypto-kat, db-integration-mysql, db-integration-postgres, doctests, evidence-gate, gfx-ui, gfx-ui-visual, linux-x86-64-native, stdlib-e106-sweep, stdlib-new-modules, stdlib-integration, verifier-projection, verifier-stress]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # download-artifact@v4 takes ONE pattern per step: a multiline
      # `pattern:` is a single glob string (with embedded newlines), not
      # three patterns. One download per artifact name, each into its OWN
      # subdirectory (the artifact name IS the directory name — the
      # release-evidence schema requires exactly one subdirectory per
      # required artifact), so gen_status.sh's --release-evidence records
      # the per-artifact hashes from the actual files.
      - name: Download stage artifacts
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/.status_artifacts/tg-stages-macos-arm64/
      - name: Download bootstrap fingerprint artifact
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-fingerprints
          path: build/.status_artifacts/bootstrap-fingerprints/
      - name: Download bootstrap native canary artifact
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-native-tests
          path: build/.status_artifacts/bootstrap-native-tests/
      - name: Download cross-lane binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: cross-lane-binaries
          path: build/.status_artifacts/cross-lane-binaries/
      - name: Download Linux stage fingerprint artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-fingerprints
          path: build/.status_artifacts/linux-fingerprints/
      - name: Download Linux native canary artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-native-tests
          path: build/.status_artifacts/linux-native-tests/

      - name: Record the job conclusions (toJSON(needs) — the ACTUAL observed results)
        run: |
          set -euo pipefail
          mkdir -p build/.status_generated
          printf '%s\n' '${{ toJSON(needs) }}' > build/.status_generated/job_results.json

      - name: Generate the status snapshot from the tested SHA
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # --release-evidence runs the release gates (the API-manifest
          # release check, the completeness enumeration, the run-artifact
          # presence) and writes build/release_evidence.json THROUGH THE
          # RELEASE-EVIDENCE SCHEMA — the per-job conclusions (the job
          # results file), the per-artifact hashes read from the actual
          # files, the equality verdicts. A failing release gate FAILS
          # this job and writes no evidence (the honest state); the
          # release-proof job then FAILS its gate (PENDING categories).
          ./scripts/gen_status.sh \
            --artifacts build/.status_artifacts/ \
            --release-evidence build/.status_artifacts \
            --job-results build/.status_generated/job_results.json \
            build/.status_generated/STATUS.txt
          cp build/release_evidence.json build/.status_generated/ 2>/dev/null || true
          echo "SHA=$(git rev-parse HEAD)" | tee -a build/.status_generated/SHA.txt

      - name: Upload the status snapshot (artifact name tied to the tested SHA)
        uses: actions/upload-artifact@v4
        with:
          name: status-snapshot-${{ github.sha }}
          path: build/.status_generated/

  # ———————————————————————————————————————
  # Release proof (the reviewer's item 36; a release-gate dependency)
  # Generates the TANGERINE RELEASE PROOF artifact FROM THE TESTED SHA
  # after the tests ran: scripts/gen_release_proof.sh runs the release
  # checks (the inventory, the semantic checks, the manifest/registry
  # generations, the API manifest's release-check), VALIDATES the ladder
  # evidence from the status snapshot (build/release_evidence.json —
  # PRESENT only when the release gates passed at the tested SHA) against
  # the release-evidence schema (scripts/release_evidence_schema.sh),
  # writes the PASS / FAIL / PENDING-UNTIL-LADDER lines per the
  # reviewer's table plus the counts (UNTESTED PUBLIC SYMBOLS /
  # UNCLASSIFIED PRODUCT FILES / PHANTOM INTRINSICS / KNOWN SAFETY
  # WAIVERS / SKIPPED REQUIRED TESTS) and the RELEASE_100 = TRUE/FALSE
  # line, and uploads the proof as the `release-proof-<tested-sha>`
  # artifact. THE RELEASE-100 GATE: the generate step runs with --gate —
  # a proof whose verdict is RELEASE_100 = FALSE (any FAIL or
  # PENDING-UNTIL-LADDER category or nonzero count) FAILS the job: the
  # mere report generation is never the gate. The job runs
  # `if: always()`; when the status job failed (no evidence artifact),
  # the proof documents the blocked state (PENDING-UNTIL-LADDER lines)
  # and the gate FAILS.
  # ———————————————————————————————————————
  release-proof:
    name: Release proof (TANGERINE RELEASE PROOF from the tested SHA)
    needs: [status]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the status snapshot (the release evidence; absent when the release gates blocked the status run)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: status-snapshot-${{ github.sha }}
          path: build/.status_snapshot/

      - name: Generate the TANGERINE RELEASE PROOF from the tested SHA (the release-100 gate — a RELEASE_100 = FALSE verdict fails the job)
        run: |
          set -euo pipefail
          if [ -f build/.status_snapshot/release_evidence.json ]; then
            cp build/.status_snapshot/release_evidence.json build/release_evidence.json
          fi
          bash scripts/gen_release_proof.sh --sha "${{ github.sha }}" --gate build/release_proof.md
          echo "---"
          cat build/release_proof.md

      - name: Upload the release proof artifact (name tied to the tested SHA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-${{ github.sha }}
          path: build/release_proof.md

  # ———————————————————————————————————————
  # Crypto Known-Answer Tests (REQUIRED)
  # std::crypto against the published KAT vectors (FIPS 180-4, FIPS 197,
  # RFC 1321, RFC 4231, RFC 7914 §11, RFC 8439 §2.3.2, RFC 4648 §10).
  # ———————————————————————————————————————
  crypto-kat:
    name: Crypto KAT Suite
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Run crypto known-answer tests
        run: |
          ./build/tg test tests/unit/test_crypto_rigor.tg
          echo "✓ Crypto KAT suite passed"

  # ———————————————————————————————————————
  # MIR Verifier Projection Tests (REQUIRED)
  # The projected-place copy-safety backstop (verifier_check_operand_
  # ownership): 13 hand-built MirProgram cases asserting the verifier's
  # accept/reject decisions for projected MirCopy places.
  # ———————————————————————————————————————
  verifier-projection:
    name: Verifier Projection Tests
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Run verifier projection tests
        run: |
          ./build/tg test tests/verifier_projection_tests.tg
          echo "✓ Verifier projection tests passed"

  # ———————————————————————————————————————
  # MIR Verifier Stress (REQUIRED — reviewer item 46)
  # The debug/CI builds run the MIR verifier (verify_mir / verify_function_v2)
  # after MIR construction, after monomorphization, after EVERY transformative
  # optimizer pass (the per-pass checkpoints inside optimize_mir_verified)
  # and after optimization — the final firewall against an upstream checker
  # bug becoming machine-code corruption. This lane compiles the WHOLE canary
  # suite through the FULL pipeline at -O2 (NOT `tg check`, which stops
  # before the optimizer) so every optimizer pass runs — a pass that
  # corrupts the IR aborts the compile with the verifier's diagnostics. The
  # canary_neg set must still be REJECTED through the same verify-everything
  # pipeline. The unit/integration suites run through `tg test` (the
  # construction + final verifies at -O0 — the O0 optimizer runs no passes,
  # so the -O2 canary lane above is what exercises the per-pass
  # checkpoints). `--mode dev` is spelled explicitly: Mode::Dev / Mode::Strict
  # are the verify-everything build modes (Production/Hardened are the
  # verify-once release modes).
  # ———————————————————————————————————————
  verifier-stress:
    name: MIR Verifier Stress (verify-everything)
    # mutation-tests is a TRANSITIVE release-gate dependency: the semantic
    # mutation kill gate (mutate -> build -> behavioral suite) is required
    # for the release, and it is wired through THIS job's needs so the
    # release-gate aggregate + release_required_jobs.txt exact-set equality
    # (the evidence-gate check) stay untouched. A mutation finding (a
    # SURVIVED or PENDING-UNTIL-BINARY non-equivalent mutation) fails the
    # mutation-tests job, which fails this job, which fails the aggregate.
    needs: [bootstrap, mutation-tests]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: "Compile + run every positive canary with verify-everything (-O2: every optimizer pass, per-pass checkpoints)"
        run: |
          set -euo pipefail
          mkdir -p build/.verifier_stress
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              \#*|"") continue ;;
            esac
            name="${line%.tg}"
            ./build/tg compile --mode dev -O2 -o "build/.verifier_stress/${name}" "tests/canary/${line}"
            "build/.verifier_stress/${name}" >/dev/null
            echo "✓ verifier-stress canary: ${name}"
          done < tests/canary/MANIFEST
          echo "✓ All $(grep -vc '^#' tests/canary/MANIFEST) canaries compiled (verify-everything, -O2) and executed"
      - name: Negative canaries must be rejected through the verify-everything pipeline (-O2)
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              \#*|"") continue ;;
            esac
            if ./build/tg compile --mode dev -O2 -o "build/.verifier_stress/neg_${line%.tg}" "tests/canary_neg/${line}" >/dev/null 2>&1; then
              echo "::error::verifier-stress: canary_neg compiled successfully but must fail: ${line}"
              failures=$((failures + 1))
            fi
          done < tests/canary_neg/MANIFEST
          if [ "$failures" -ne 0 ]; then
            echo "::error::verifier-stress: $failures canary_neg file(s) compiled but must fail"
            exit 1
          fi
          echo "✓ All canary_neg rejected through the verify-everything pipeline"
      - name: Run the verifier + compiler-module test suites (construction + final verifies)
        run: |
          ./build/tg test tests/verifier_projection_tests.tg golden/compiler_module_tests.tg
          echo "✓ Verifier projection + compiler module tests passed through the verify-everything pipeline"
      - name: Run the unit / integration test suites (verify-everything pipeline)
        run: |
          ./build/tg test tests/unit/test_geom.tg tests/unit/test_events.tg tests/unit/test_paint.tg tests/unit/test_text.tg tests/unit/test_capability.tg tests/integration/test_pipelines.tg tests/abi/test_abi_conformance.tg tests/consistency/test_consistency.tg tests/golden/test_visual_regression.tg tests/determinism/test_replay.tg tests/fuzz/test_fuzz.tg
          echo "✓ Unit/integration suites passed through the verify-everything pipeline"

  # ———————————————————————————————————————
  # Mutation tests (REQUIRED — the SEMANTIC mutation kill gate)
  # The semantic mutation protocol (the reviewer's P0 mandate):
  #   mutate -> BUILD the mutated kernel (with the ladder's stage3
  #   current-grammar binary) -> RUN the per-mutation behavioral suite
  #   under the mutated compiler -> the mutation is KILLED iff the
  #   behavioral suite FAILS.
  # The per-mutation behavioral suite mapping (scripts/run_mutation_tests.sh
  # owns the table): the canaries' accepted/rejected sets, the resource
  # negatives, the verifier tests, the layout tests, the enum tests, the
  # numeric gate, the CFG oracle, the async waiter tests, the atomic
  # litmus suites, the trait-conformance negatives. The structural
  # detectors (scripts/mutation_detectors.sh + the G13 group of
  # scripts/verify_invariants.sh) are SOURCE-INTEGRITY checks ONLY — they
  # confirm the mutation was applied at the intended site and NEVER
  # classify a kill: a mutation killed by a grep noticing the source
  # changed is NOT a semantic kill.
  # THE HONEST STATE + THE GATE: without a usable compiler binary every
  # kill is PENDING-UNTIL-BINARY (never killed), and the release gate
  # cannot pass while any non-equivalent mutation's kill is unproven. This
  # job runs with --gate: any SURVIVED or PENDING-UNTIL-BINARY
  # non-equivalent mutation FAILS the job — the mutation-kill rows
  # (KILLED-BEHAVIORALLY / PENDING-UNTIL-BINARY / SURVIVED) in the report
  # are the release gate's evidence (the surviving non-equivalent mutation
  # blocks the release until the behavioral suite gains a detector).
  # The job is a transitive dependency of the release-gate aggregate via
  # verifier-stress's needs (see the verifier-stress block) — a mutation
  # finding fails the aggregate and blocks the merge.
  # ———————————————————————————————————————
  mutation-tests:
    name: Mutation tests (mutate -> build -> behavioral suite)
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: "Run the semantic mutation suite (the gate: every non-equivalent mutation must be KILLED-BEHAVIORALLY — any SURVIVED or PENDING-UNTIL-BINARY mutation fails the job)"
        run: |
          bash scripts/run_mutation_tests.sh --binary ./build/tg_stage3 --gate --out build/mutation_report.txt
      - name: Upload the mutation report (the per-mutation KILLED-BEHAVIORALLY / PENDING-UNTIL-BINARY / SURVIVED rows — the release gate's mutation-kill evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: build/mutation_report.txt

  # ———————————————————————————————————————
  # Allocator Suites (REQUIRED)
  # The runtime allocator boundary suites: churn/reclamation, free-list
  # reuse, large-path, fault-injection OOM, threaded contention, and
  # alignment. Each file is an executable canary (def main, @test-marked):
  # the `tg test` runner compiles it as-is and runs it once; the process
  # exit code is the outcome.
  # ———————————————————————————————————————
  allocator:
    name: Allocator Suites
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Run allocator suites (incl. Arc lifecycle)
        run: |
          ./build/tg test tests/allocator_churn_test.tg tests/allocator_reuse_test.tg tests/allocator_large_test.tg tests/allocator_oom_test.tg tests/allocator_threaded_test.tg tests/allocator_alignment_test.tg tests/arc_lifecycle_test.tg
          echo "✓ Allocator + Arc lifecycle suites passed"

  # ———————————————————————————————————————
  # ABI / Platform Contract Suites (REQUIRED)
  # The adversarial platform-contract layer: the pthread opaque ABI
  # (size AND native alignment) pinned per target, the per-target
  # syscall identity table (linux-aarch64 translation rows + *at
  # argument layouts), the AArch64 LSE requirement as explicit target
  # metadata, and the thread-spawn failure path (fault-injection flag;
  # the placed closure's drop glue must fire exactly once on the
  # failure path). Each file is an executable canary (@test-marked
  # main / @test suite), run once.
  # ———————————————————————————————————————
  abi-platform:
    name: ABI / Platform Contract Suites
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Run ABI / platform contract suites
        run: |
          ./build/tg test tests/pthread_abi_test.tg tests/syscall_translation_test.tg tests/target_lse_contract_test.tg tests/thread_spawn_failure_test.tg
          echo "✓ ABI / platform contract suites passed"

  # ———————————————————————————————————————
  # Atomic Litmus Suites (REQUIRED)
  # The memory-ordering litmus patterns (SB/MP/WRC/AcqRel/CAS-Publish/
  # CAS-Fail) over ITERATIONS independent slots; forbidden outcomes fail
  # the canary. Executable canaries (@test-marked main), run once each.
  # ———————————————————————————————————————
  atomic-litmus:
    name: Atomic Litmus Suites
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Run atomic litmus suites
        run: |
          ./build/tg test tests/atomic_litmus_*.tg
          echo "✓ Atomic litmus suites passed"

  # ———————————————————————————————————————
  # Stdlib Integration Suites (REQUIRED)
  # Minimal end-to-end suites for the network, database, TLS, sync, and
  # async modules: the TCP loopback (listener + client echo), the SQLite
  # in-memory open/create/insert/select, the TLS certificate parse
  # round-trip + config-ownership suites (fixed embedded PEMs) plus the
  # TLS handshake suite (the shim's SSL_accept/SSL_connect over loopback
  # sockets: trusted-CA success, untrusted and wrong-hostname rejections,
  # ALPN h2 negotiation), the mutex-guard contention churn across
  # threads (incl. the condvar notify_one/notify_all ticket semantics),
  # and the async structured-concurrency suites (the TaskScope's async
  # join_all + the error strategies, the CancellationToken tree + the
  # concurrent-registration race, and the reactor's readiness tokens —
  # the second-poll-stays-pending / ready-consume / EAGAIN-re-register
  # semantics on the kqueue-backed reactor).
  #
  # TLS lane self-containment: std::tls declares the custom extern shim
  # family (tls_x509_* / tls_ssl_* / tls_pkey_* / tls_load_file); this job
  # builds the in-repository implementation (native/tls_shims.c, small C
  # wrappers over the system OpenSSL) into build/libtg_tls_shims.dylib,
  # gates every declared extern as an exported Mach-O symbol, and supplies
  # the shim to the tg-compiled TLS test processes. The same pattern
  # builds the epoll shim (native/epoll_shims.c — the real libc packed
  # epoll_event struct + the conversion to the Tangerine-native
  # representation; ENOSYS stubs off-Linux) into
  # build/libtg_epoll_shims.dylib and gates its exports.
  # ———————————————————————————————————————
  stdlib-integration:
    name: Stdlib Integration (net/db/tls/sync/async)
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Build the TLS shim (native/tls_shims.c -> build/libtg_tls_shims.dylib)
        run: |
          set -euo pipefail
          mkdir -p build
          # OpenSSL headers/libs: Homebrew openssl@3 is preinstalled on the
          # macos-14 runners; fall back to the system /usr/lib libssl/libcrypto.
          if [ -d "$(brew --prefix openssl@3 2>/dev/null || true)/include/openssl" ]; then
            OPENSSL_PREFIX="$(brew --prefix openssl@3)"
            cc -fPIC -shared -o build/libtg_tls_shims.dylib native/tls_shims.c \
              -I"$OPENSSL_PREFIX/include" -L"$OPENSSL_PREFIX/lib" -lssl -lcrypto
          else
            cc -fPIC -shared -o build/libtg_tls_shims.dylib native/tls_shims.c -lssl -lcrypto
          fi
          # Structural gate: every tls_* extern declared by std::tls must be
          # exported by the shim (underscore-prefixed Mach-O symbols).
          for sym in \
            tls_ssl_new tls_ssl_free tls_ssl_set_min_version tls_ssl_set_max_version \
            tls_ssl_set_hostname tls_ssl_set_certificate tls_ssl_set_private_key \
            tls_ssl_set_verify tls_ssl_connect tls_ssl_accept tls_ssl_read \
            tls_ssl_write tls_ssl_shutdown \
            tls_ssl_set_default_verify_paths tls_ssl_add_ca_cert \
            tls_ssl_set_alpn_protos tls_ssl_set_alpn_select tls_ssl_get_alpn \
            tls_ssl_set_cipher_list tls_ssl_set_cipher_suites \
            tls_x509_from_pem tls_x509_free tls_x509_to_der \
            tls_x509_get_subject_cn tls_x509_is_expired \
            tls_pkey_from_pem tls_pkey_free tls_pkey_to_der tls_load_file; do
            nm -gU build/libtg_tls_shims.dylib | grep -q " _$sym$" \
              || { echo "::error::TLS shim missing export: $sym"; exit 1; }
          done
          echo "✓ libtg_tls_shims.dylib built with all 29 std::tls extern exports"

      - name: Build the epoll shim (native/epoll_shims.c -> build/libtg_epoll_shims.dylib)
        run: |
          set -euo pipefail
          mkdir -p build
          # The Linux x86-64 epoll_event is a PACKED 12-byte struct; the
          # std::async epoll calls route through this shim (the real libc
          # struct + the conversion to the Tangerine-native 16-byte
          # representation). On macOS the entry points are ENOSYS stubs
          # (the reactor uses kqueue) — the exports must still exist for
          # the flat-namespace preload contract.
          cc -fPIC -shared -o build/libtg_epoll_shims.dylib native/epoll_shims.c
          # Structural gate: every tg_epoll_* extern declared by std::async
          # must be exported by the shim (underscore-prefixed Mach-O
          # symbols).
          for sym in tg_epoll_create1 tg_epoll_ctl tg_epoll_wait tg_errno_is_eagain; do
            nm -gU build/libtg_epoll_shims.dylib | grep -q " _$sym$" \
              || { echo "::error::epoll shim missing export: $sym"; exit 1; }
          done
          echo "✓ libtg_epoll_shims.dylib built with all 4 std::async epoll exports"

      - name: Run net loopback / negative-return ABI / db / sync integration suites
        run: |
          ./build/tg test tests/net_loopback_test.tg tests/net_negative_abi_test.tg tests/db_integration_test.tg tests/db_lifecycle_test.tg tests/db_async_pool_test.tg tests/db_postgres_lexer_test.tg tests/sync_contention_test.tg tests/task_scope_test.tg tests/cancellation_token_test.tg tests/reactor_readiness_test.tg
          echo "✓ Net loopback / negative-return ABI / db / sync / task-scope / cancellation-token / reactor-readiness integration suites passed"

      - name: Run TLS interop + handshake suites (shim preloaded into the test processes)
        run: |
          set -euo pipefail
          # The tg toolchain's link step is the in-house Mach-O linker
          # (tg_compiler/linker.tg link_macho64): it emits exactly one
          # LC_LOAD_DYLIB (/usr/lib/libSystem.B.dylib) and records every
          # undefined extern — the tls_x509_* / tls_ssl_* / tls_pkey_*
          # calls among them — as a dyld import. The driver has no
          # link-flags / module-link-config mechanism to add the shim as a
          # second LC_LOAD_DYLIB dependency, so the lane supplies the shim
          # by preloading it into every tg-compiled test process
          # (DYLD_INSERT_LIBRARIES): libtg_tls_shims.dylib is then in the
          # process image list before main, and DYLD_FORCE_FLAT_NAMESPACE
          # routes the imports through flat lookup, which searches every
          # loaded image including the inserted shim.
          DYLD_INSERT_LIBRARIES="$PWD/build/libtg_tls_shims.dylib" \
          DYLD_FORCE_FLAT_NAMESPACE=1 \
            ./build/tg test tests/tls_interop_test.tg tests/tls_handshake_test.tg
          echo "✓ TLS interop + handshake suites passed"

  # ———————————————————————————————————————
  # DB Postgres lane (REQUIRED)
  # The std::db non-SQLite lane: the Postgres driver (libpq externs
  # PQconnectdb/PQexec/PQexecParams/PQprepare/PQexecPrepared/PQgetvalue/
  # ...) against a NATIVE Homebrew postgresql@16 server (localhost:5432,
  # initdb + pg_ctl started in the job). GitHub Actions forbids Docker
  # service containers on macOS runners, so the lane runs the server as a
  # native process instead. The tg toolchain's in-house Mach-O linker
  # emits exactly one LC_LOAD_DYLIB and records the PQ* calls as dyld
  # imports, so — exactly like the TLS shim lane — the lane preloads
  # libpq (and its brew OpenSSL deps) into the test process
  # (DYLD_INSERT_LIBRARIES + DYLD_FORCE_FLAT_NAMESPACE). The lane is
  # gated behind the started server: the test only runs where the server
  # exists. The driver translates the JDBC `?` placeholder to PostgreSQL's
  # $1..$n positional parameters, owns every parameter payload in the
  # PgParamBacking, and runs prepared statements server-side
  # (PQprepare/PQexecPrepared with a DEALLOCATE on drop).
  # ———————————————————————————————————————
  db-integration-postgres:
    name: DB Postgres Lane (native Homebrew postgresql@16)
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Install libpq + PostgreSQL 16 (native server)
        run: |
          set -euo pipefail
          brew install libpq postgresql@16 openssl@3
          echo "libpq: $(brew --prefix libpq)/lib/libpq.dylib"
          echo "openssl: $(brew --prefix openssl@3)"
      - name: Initialize and start the PostgreSQL server (native process)
        run: |
          set -euo pipefail
          PGBIN="$(brew --prefix postgresql@16)/bin"
          PGDATA="$RUNNER_TEMP/pgdata"
          rm -rf "$PGDATA"
          "$PGBIN/initdb" -D "$PGDATA" -U postgres --auth=trust >/dev/null
          "$PGBIN/pg_ctl" -D "$PGDATA" -l "$RUNNER_TEMP/postgres.log" -o "-p 5432" start
          for _ in $(seq 1 30); do
            if "$PGBIN/pg_isready" -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          "$PGBIN/pg_isready" -h 127.0.0.1 -p 5432 -U postgres
      - name: Run the Postgres driver lane (libpq preloaded, native server)
        run: |
          set -euo pipefail
          DYLD_INSERT_LIBRARIES="$(brew --prefix libpq)/lib/libpq.dylib:$(brew --prefix openssl@3)/lib/libssl.3.dylib:$(brew --prefix openssl@3)/lib/libcrypto.3.dylib" \
          DYLD_FORCE_FLAT_NAMESPACE=1 \
            ./build/tg test tests/db_postgres_integration_test.tg
          echo "✓ DB Postgres lane passed (native Homebrew server)"

  # ———————————————————————————————————————
  # DB MySQL lane (REQUIRED)
  # The std::db MySQL driver (libmysqlclient externs
  # mysql_init/mysql_real_connect/mysql_query/mysql_real_query/
  # mysql_stmt_init/mysql_stmt_prepare/mysql_stmt_execute/
  # mysql_store_result/mysql_fetch_row/... plus the tg_mysql_* shim
  # externs) against a NATIVE Homebrew mysql server (127.0.0.1:3306,
  # root/root, database test — mysqld initialized and started in the
  # job). GitHub Actions forbids Docker service containers on macOS
  # runners, so the lane runs the server as a native process instead.
  # The tg toolchain's in-house Mach-O linker emits exactly one
  # LC_LOAD_DYLIB and records the mysql_* / tg_mysql_* calls as dyld
  # imports, so — exactly like the TLS shim lane — the lane preloads the
  # MYSQL SHIM (build/libtg_mysql_shims.dylib, built from
  # native/mysql_shims.c — the in-repository implementation of the
  # tg_mysql_* extern family that internally manipulates the real
  # MYSQL_BIND) plus libmysqlclient (and its brew OpenSSL deps) into the
  # test process (DYLD_INSERT_LIBRARIES + DYLD_FORCE_FLAT_NAMESPACE).
  # The lane is gated behind the started server: the test only runs
  # where the server exists. Every parameterized statement uses the REAL
  # MYSQL_BIND parameter binding (built inside the shim from the
  # Tangerine MysqlParam descriptors + mysql_stmt_execute) — the
  # hostile-value / multibyte / binary-blob cases are shipped as data,
  # never interpolated. The layout-probe test pins the Tangerine
  # @repr(C) descriptor layouts against the C-side facts, and the
  # large-result test exercises the truncation + mysql_stmt_fetch_column
  # refetch path at the 64KiB boundary and beyond.
  # ———————————————————————————————————————
  db-integration-mysql:
    name: DB MySQL Lane (native Homebrew mysql)
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Install MySQL (native server + client libraries)
        run: |
          set -euo pipefail
          brew install mysql openssl@3
          echo "mysqlclient: $(brew --prefix mysql)/lib/libmysqlclient.dylib"
          echo "openssl: $(brew --prefix openssl@3)"
      - name: Initialize and start the MySQL server (native process)
        run: |
          set -euo pipefail
          MYSQL_BIN="$(brew --prefix mysql)/bin"
          MYSQL_DATADIR="$RUNNER_TEMP/mysql-data"
          rm -rf "$MYSQL_DATADIR"
          mkdir -p "$MYSQL_DATADIR"
          "$MYSQL_BIN/mysqld" --initialize-insecure --datadir="$MYSQL_DATADIR" --log-error="$RUNNER_TEMP/mysql-init.log"
          "$MYSQL_BIN/mysqld" --datadir="$MYSQL_DATADIR" --port=3306 \
            --socket="$RUNNER_TEMP/mysql.sock" --log-error="$RUNNER_TEMP/mysql.log" &
          for _ in $(seq 1 30); do
            if "$MYSQL_BIN/mysqladmin" ping -h 127.0.0.1 -uroot >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          "$MYSQL_BIN/mysqladmin" ping -h 127.0.0.1 -uroot
          "$MYSQL_BIN/mysql" -h 127.0.0.1 -uroot -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'root'; CREATE DATABASE IF NOT EXISTS test;"
      - name: Build the MySQL shim (native/mysql_shims.c -> build/libtg_mysql_shims.dylib)
        run: |
          set -euo pipefail
          mkdir -p build
          # The tg_mysql_* extern family (std::db) routes every MYSQL_BIND
          # touch through this shim — the real st_mysql_bind is manipulated
          # HERE (compiled against the real mysql.h), never in the Tangerine
          # module. The same build pattern as the TLS / epoll shims.
          MYSQL_PREFIX="$(brew --prefix mysql)"
          cc -fPIC -shared -o build/libtg_mysql_shims.dylib native/mysql_shims.c \
            -I"$MYSQL_PREFIX/include/mysql" -L"$MYSQL_PREFIX/lib" -lmysqlclient
          # Structural gate: every tg_mysql_* extern declared by std::db must
          # be exported by the shim (underscore-prefixed Mach-O symbols).
          for sym in tg_mysql_stmt_bind_and_execute tg_mysql_stmt_bind_result \
                     tg_mysql_stmt_fetch_column tg_mysql_layout_probe; do
            nm -gU build/libtg_mysql_shims.dylib | grep -q " _$sym$" \
              || { echo "::error::MySQL shim missing export: $sym"; exit 1; }
          done
          echo "✓ libtg_mysql_shims.dylib built with all 4 std::db tg_mysql_* extern exports"
      - name: Run the MySQL driver lane (shim + libmysqlclient preloaded, native server)
        run: |
          set -euo pipefail
          DYLD_INSERT_LIBRARIES="$PWD/build/libtg_mysql_shims.dylib:$(brew --prefix mysql)/lib/libmysqlclient.dylib:$(brew --prefix openssl@3)/lib/libssl.3.dylib:$(brew --prefix openssl@3)/lib/libcrypto.3.dylib" \
          DYLD_FORCE_FLAT_NAMESPACE=1 \
            ./build/tg test tests/db_mysql_integration_test.tg tests/db_mysql_layout_probe_test.tg tests/db_mysql_large_result_test.tg
          echo "✓ DB MySQL lane passed (shim + native Homebrew server)"

  # ———————————————————————————————————————
  # New stdlib module tests
  # Runs on macos-14 with the validated stage3 artifact.
  # ———————————————————————————————————————
  stdlib-new-modules:
    name: Stdlib New Modules
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Test-runner integrity gate (pass / fail / zero-test / parse-error / implicit-recognized-selection)
        run: |
          bash tests/run_test_runner_integrity.sh ./build/tg
      - name: Bench-runner integrity gate (pass / fail / parse-error / zero-@bench / compile-error / discovery / zero-discovery)
        run: |
          bash tests/run_bench_runner_integrity.sh ./build/tg
      - name: Verify stdlib modules without @test suites (simd embedded mmap gpu)
        run: |
          set -euo pipefail
          mkdir -p build/.stdlib_verify
          for m in simd embedded mmap gpu; do
            echo "=== std/$m.tg ==="
            ./build/tg check "std/$m.tg"
            ./build/tg compile -c -o "build/.stdlib_verify/std_${m}.o" "std/$m.tg"
            printf 'use std::%s\n\ndef main() -> Int\n  0\nend\n' "$m" > "build/.stdlib_verify/std_${m}_smoke.tg"
            ./build/tg compile -o "build/.stdlib_verify/std_${m}_smoke" "build/.stdlib_verify/std_${m}_smoke.tg"
            ./build/.stdlib_verify/std_${m}_smoke
          done
          echo "✓ simd/embedded/mmap/gpu: check + object + link/import smoke passed"
      - name: Verify stdlib modules with @test suites (linalg float_control validation web_ext opentelemetry wasm_js)
        run: |
          set -euo pipefail
          mkdir -p build/.stdlib_verify
          for m in linalg float_control validation web_ext opentelemetry wasm_js; do
            echo "=== std/$m.tg ==="
            ./build/tg check "std/$m.tg"
            ./build/tg compile -c -o "build/.stdlib_verify/std_${m}.o" "std/$m.tg"
            printf 'use std::%s\n\ndef main() -> Int\n  0\nend\n' "$m" > "build/.stdlib_verify/std_${m}_smoke.tg"
            ./build/tg compile -o "build/.stdlib_verify/std_${m}_smoke" "build/.stdlib_verify/std_${m}_smoke.tg"
            ./build/.stdlib_verify/std_${m}_smoke
            ./build/tg test "std/$m.tg"
          done
          echo "✓ linalg/float_control/validation/web_ext/opentelemetry/wasm_js: check + object + link/import smoke + @test suites passed"

  # ———————————————————————————————————————
  # Cross-compilation target lane
  # Builds and executes native canaries for BOTH the arm64 native lane and the
  # x86-64 cross lane. Every emitted object must be free of trap stubs
  # (disassembled via otool: no ud2 on x86-64, no udf/foreign brk on arm64);
  # the x86 ud2 holes are closed and this gate asserts they stay closed.
  # x86-64 execution uses Rosetta (arch -x86_64) when present, else qemu,
  # else the disassembly/trap-stub gate alone.
  # ———————————————————————————————————————
  cross-compile:
    name: Cross-target canary lanes (arm64 + x86_64)
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Native lane (arm64) — compile, execute, trap-stub gate
        run: |
          bash tests/run_target_lane_canaries.sh ./build/tg build/.cross_lane_arm64 aarch64
      - name: Cross lane (x86_64) — compile, Rosetta/emulator execute, mandatory trap-stub gate
        run: |
          bash tests/run_target_lane_canaries.sh ./build/tg build/.cross_lane_x86_64 x86_64
      - name: Upload cross-lane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-lane-binaries
          path: |
            build/.cross_lane_arm64/
            build/.cross_lane_x86_64/

  # ———————————————————————————————————————
  # Native Linux x86-64 runtime evidence (REVIEWER ITEM 18 — from source)
  # The macOS stage3 artifact is Mach-O and CANNOT run on Linux; there is
  # no pretend distribution. The feasible design implemented here:
  #   (a) the stage0 Swift seed is built NATIVELY on Ubuntu
  #       (swift-actions/setup-swift — the same toolchain action the
  #       macOS bootstrap uses);
  #   (b) the stage ladder runs NATIVELY: stage0 -> stage1 -> stage2 ->
  #       stage3, each compiled for x86_64-unknown-linux-gnu with the
  #       ELF64 linker (link_elf64), each gated as ELF64 + --version, and
  #       the stage2 == stage3 fixed-point gate runs (format-agnostic
  #       cmp);
  #   (c) the native canary manifest (compile + ELF64 gate + execute),
  #       the trap-stub gate (objdump — the otool gate's Linux
  #       equivalent), and the epoll/pthread/net/DB/TLS suites run against
  #       the Linux stage3 with the SAME `tg test` commands the macOS
  #       lanes use.
  # Linux-specific wiring: the epoll shim (native/epoll_shims.c — the
  # REAL packed 12-byte Linux epoll_event) and the TLS shim
  # (native/tls_shims.c over OpenSSL) build as .so and are preloaded
  # (LD_PRELOAD — the DYLD_INSERT_LIBRARIES equivalent); SQLite is
  # in-process via the real libsqlite3 (preloaded; on macOS SQLite lives
  # inside libSystem, on Linux it is a separate .so).
  # HONEST LIMITATIONS (recorded, not papered over):
  #   - the harness's Mach-O gates (bh_is_macho64 / otool) do not apply
  #     to ELF; this job uses the ELF64 magic check + objdump equivalents
  #     instead (the helpers stay untouched);
  #   - tests/x86_64 (the arch-specific x86-64 suite the harness makes
  #     mandatory on x86_64 hosts) does not exist yet, so the arch suite
  #     here is the positive canary manifest; the aarch64 suite
  #     (tests/arm64) is aarch64-only;
  #   - the Postgres/MySQL native-server lanes remain the macOS lanes
  #     (the SQLite in-process path is the Linux DB evidence); the
  #     Linux apt-server lanes are future work;
  #   - until this job's first green run, the x86-64 registry row stays
  #     "codegen/cross-runtime tested, not full host-runtime release
  #     verified" (see docs/current/feature_registry.md).
  # The job is NOT part of the release-gate aggregate: it is evidence,
  # not a merge gate, until proven.
  # ———————————————————————————————————————
  linux-x86-64-native:
    name: Native Linux x86-64 self-host evidence
    runs-on: ubuntu-22.04
    env:
      TG_BOOTSTRAP_TARGET: x86_64-unknown-linux-gnu
      TG_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift 6 toolchain (the stage0 seed builds natively)
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Verify Swift toolchain
        run: swift --version

      - name: Bootstrap-unit parity gate (the kernel manifest closure)
        run: |
          set -euo pipefail
          bash ./scripts/gen_bootstrap_input.sh --write
          echo "✓ bootstrap kernel manifest closure valid (imports closed, entry roots listed)"

      - name: Build the stage0 Swift seed natively
        run: |
          set -euo pipefail
          swift build --package-path stage0_swift -c release
          test -x stage0_swift/.build/release/tg_stage0
          echo "✓ stage0 seed built natively on Ubuntu x86-64"

      - name: Stage ladder (stage0 -> stage1 -> stage2 -> stage3, native ELF64)
        run: |
          set -euo pipefail
          STAGE0="$PWD/stage0_swift/.build/release/tg_stage0"
          TARGET="$TG_TARGET"
          mkdir -p build/bootstrap
          echo "== Stage 1: the kernel via the seed, for $TARGET =="
          "$STAGE0" compile --strict-resolution tg_compiler/bootstrap_main.tg -o build/tg_stage1 --target "$TARGET" 2>&1 | tee build/bootstrap/linux-stage1.log
          chmod +x build/tg_stage1
          echo "== Stage 2: self-host via stage1 =="
          build/tg_stage1 compile --strict-resolution tg_compiler/bootstrap_main.tg -o build/tg_stage2 --target "$TARGET" 2>&1 | tee build/bootstrap/linux-stage2.log
          chmod +x build/tg_stage2
          echo "== Stage 3: self-host via stage2 =="
          build/tg_stage2 compile --strict-resolution tg_compiler/bootstrap_main.tg -o build/tg_stage3 --target "$TARGET" 2>&1 | tee build/bootstrap/linux-stage3.log
          chmod +x build/tg_stage3
          for s in 1 2 3; do
            bin="build/tg_stage$s"
            magic="$(od -An -tx1 -N4 "$bin" | tr -d ' \n')"
            if [ "$magic" != "7f454c46" ]; then
              echo "::error::linux stage$s is not an ELF64 image (magic $magic)"
              exit 1
            fi
            if ! "$bin" --version >/dev/null 2>&1 && ! "$bin" version >/dev/null 2>&1; then
              echo "::error::linux stage$s did not answer --version"
              exit 1
            fi
            echo "stage$s: ELF64, $(wc -c < "$bin" | tr -d ' ') bytes, sha256=$(shasum -a 256 "$bin" | cut -d' ' -f1)"
          done
          echo "== Fixed-point gate: stage2 == stage3 (byte-identical) =="
          cmp build/tg_stage2 build/tg_stage3
          echo "✓ stage2 == stage3 on native Linux x86-64 (the reproducibility gate)"
          cp build/tg_stage3 build/tg
          echo "== Self-check: the Linux stage3 checks its own kernel =="
          build/tg check tg_compiler/bootstrap_main.tg
          echo "✓ Linux stage3 self-check passed"

      - name: Record the Linux stage fingerprints (CI-run-provided evidence)
        run: |
          set -euo pipefail
          mkdir -p build/.linux_fingerprints
          for s in 1 2 3; do
            printf 'FINGERPRINT tg_stage%s link-image %s\n' "$s" "$(shasum -a 256 "build/tg_stage$s" | cut -d' ' -f1)"
          done > build/.linux_fingerprints/tg_stages.fingerprints
          cat build/.linux_fingerprints/tg_stages.fingerprints

      - name: Native canary lanes (the positive manifest — compile + ELF64 gate + execute)
        run: |
          set -euo pipefail
          mkdir -p build/.linux_native
          failures=0; total=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            src="tests/canary/$line"
            [ -f "$src" ] || { echo "::error::linux canary missing: $src"; exit 1; }
            bin="build/.linux_native/${line%.tg}"
            total=$((total + 1))
            if ! ./build/tg compile "$src" -o "$bin" --target "$TG_TARGET" >/dev/null 2>&1; then
              echo "::error::linux canary failed to compile: $src"
              failures=$((failures + 1)); continue
            fi
            if [ "$(od -An -tx1 -N4 "$bin" | tr -d ' \n')" != "7f454c46" ]; then
              echo "::error::linux canary output is not ELF64: $src"
              failures=$((failures + 1)); continue
            fi
            chmod +x "$bin"
            if ! "$bin" >/dev/null 2>&1; then
              echo "::error::linux canary exited nonzero: $src"
              failures=$((failures + 1)); continue
            fi
          done < tests/canary/MANIFEST
          if [ "$total" -eq 0 ]; then
            echo "::error::zero canaries discovered (a zero suite is fatal)"
            exit 1
          fi
          echo "linux native canaries: $((total - failures))/$total passed (ELF64, executed natively)"
          [ "$failures" -eq 0 ]

      - name: Trap-stub gate (objdump — the otool gate's Linux equivalent)
        run: |
          set -euo pipefail
          WHITELIST=" __intrinsic_abort panic panic_unwind begin_unwind resume_unwind unreachable assert "
          failures=0
          for bin in build/.linux_native/*; do
            [ -f "$bin" ] || continue
            cur=""; banned=0
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                *"<"*">:")
                  cur="${line##*<}"; cur="${cur%%>*}" ;;
                *)
                  if [[ "$line" == *ud2* ]]; then
                    ok=0
                    for w in "$cur" "${cur#_}"; do
                      if [[ "$WHITELIST" == *" $w "* ]]; then ok=1; break; fi
                    done
                    [ "$ok" -eq 1 ] || banned=$((banned + 1))
                  fi
                  ;;
              esac
            done < <(objdump -d "$bin" 2>/dev/null || true)
            if [ "$banned" -ne 0 ]; then
              echo "::error::trap-stub gate: $bin contains $banned banned ud2 trap(s) outside the documented abort/panic whitelist"
              failures=$((failures + 1))
            fi
          done
          [ "$failures" -eq 0 ]
          echo "✓ trap-stub gate OK on $(ls build/.linux_native | wc -l | tr -d ' ') linux canary binaries"

      - name: Build the epoll shim (the Linux-specific lane — the real packed epoll_event)
        run: |
          set -euo pipefail
          cc -fPIC -shared -o build/libtg_epoll_shims.so native/epoll_shims.c
          for sym in tg_epoll_create1 tg_epoll_ctl tg_epoll_wait tg_errno_is_eagain; do
            nm -D --defined-only build/libtg_epoll_shims.so | grep -qE " $sym$" \
              || { echo "::error::linux epoll shim missing export: $sym"; exit 1; }
          done
          echo "✓ libtg_epoll_shims.so built with all 4 std::async epoll exports"

      - name: Run the pthread / ABI / net / sync / allocator / atomic / crypto / verifier suites (Linux native)
        run: |
          set -euo pipefail
          ./build/tg test tests/pthread_abi_test.tg tests/syscall_translation_test.tg tests/thread_spawn_failure_test.tg tests/net_loopback_test.tg tests/net_negative_abi_test.tg
          ./build/tg test tests/allocator_churn_test.tg tests/allocator_reuse_test.tg tests/allocator_large_test.tg tests/allocator_oom_test.tg tests/allocator_threaded_test.tg tests/allocator_alignment_test.tg tests/arc_lifecycle_test.tg
          ./build/tg test tests/atomic_litmus_sb_test.tg tests/atomic_litmus_mp_test.tg tests/atomic_litmus_wrc_test.tg tests/atomic_litmus_acqrel_test.tg tests/atomic_litmus_cas_pub_test.tg tests/atomic_litmus_cas_fail_test.tg
          ./build/tg test tests/sync_contention_test.tg tests/condvar_waiter_queue_test.tg tests/once_cas_test.tg tests/thread_channel_ownership_test.tg tests/thread_local_drop_test.tg tests/thread_result_cell_test.tg
          ./build/tg test tests/unit/test_crypto_rigor.tg tests/verifier_projection_tests.tg golden/compiler_module_tests.tg
          echo "✓ pthread/ABI/net/sync/allocator/atomic/crypto/verifier suites passed on native Linux x86-64"

      - name: Run the async suites with the epoll shim preloaded (the Linux epoll reactor)
        run: |
          set -euo pipefail
          LD_PRELOAD="$PWD/build/libtg_epoll_shims.so" \
            ./build/tg test tests/task_scope_test.tg tests/cancellation_token_test.tg tests/reactor_readiness_test.tg tests/async_mutex_waiter_test.tg tests/join_cancel_test.tg tests/executor_clock_test.tg tests/exec_conservation_test.tg
          echo "✓ async/exec suites passed on the Linux epoll reactor"

      - name: Run the DB suites (SQLite in-process via the real libsqlite3, preloaded)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-0
          SQLITE_SO="$(dpkg -L libsqlite3-0 | grep -E 'libsqlite3\.so\.' | head -1)"
          test -n "$SQLITE_SO" && test -f "$SQLITE_SO"
          echo "preloading: $SQLITE_SO"
          LD_PRELOAD="$SQLITE_SO" \
            ./build/tg test tests/db_integration_test.tg tests/db_lifecycle_test.tg tests/db_async_pool_test.tg tests/db_postgres_lexer_test.tg
          echo "✓ DB suites passed (SQLite in-process; the Postgres/MySQL native-server lanes remain the macOS lanes — documented limitation)"

      - name: Build the TLS shim + run the TLS suites (LD_PRELOAD)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq libssl-dev
          cc -fPIC -shared -o build/libtg_tls_shims.so native/tls_shims.c -lssl -lcrypto
          for sym in \
            tls_ssl_new tls_ssl_free tls_ssl_set_min_version tls_ssl_set_max_version \
            tls_ssl_set_hostname tls_ssl_set_certificate tls_ssl_set_private_key \
            tls_ssl_set_verify tls_ssl_connect tls_ssl_accept tls_ssl_read \
            tls_ssl_write tls_ssl_shutdown \
            tls_ssl_set_default_verify_paths tls_ssl_add_ca_cert \
            tls_ssl_set_alpn_protos tls_ssl_set_alpn_select tls_ssl_get_alpn \
            tls_ssl_set_cipher_list tls_ssl_set_cipher_suites \
            tls_x509_from_pem tls_x509_free tls_x509_to_der \
            tls_x509_get_subject_cn tls_x509_is_expired \
            tls_pkey_from_pem tls_pkey_free tls_pkey_to_der tls_load_file; do
            nm -D --defined-only build/libtg_tls_shims.so | grep -qE " $sym$" \
              || { echo "::error::linux TLS shim missing export: $sym"; exit 1; }
          done
          LD_PRELOAD="$PWD/build/libtg_tls_shims.so" \
            ./build/tg test tests/tls_interop_test.tg tests/tls_handshake_test.tg
          echo "✓ libtg_tls_shims.so built (all 29 std::tls extern exports) + TLS suites passed on native Linux x86-64"

      - name: Upload Linux stage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-stage-artifacts
          path: |
            build/tg_stage1
            build/tg_stage2
            build/tg_stage3

      - name: Upload Linux native canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-tests
          path: build/.linux_native/

      - name: Upload Linux stage fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-fingerprints
          path: build/.linux_fingerprints/

  # ———————————————————————————————————————
  # CFG cross-target matrix (REQUIRED)
  # The @cfg compile-time elimination pass driven across the explicit
  # target triples (tests/run_cfg_matrix_tests.sh): the linux member
  # kept on x86_64-linux-gnu, the macos member kept on
  # aarch64-apple-darwin, the un-gated cross references REJECTED with
  # the exact unresolved-name diagnostic, and the host-agnostic family
  # canary compiled AND run. All 6 canaries must pass.
  # ———————————————————————————————————————
  cfg-matrix:
    name: CFG Cross-Target Matrix
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Run the @cfg cross-target matrix (6 canaries)
        run: |
          bash tests/run_cfg_matrix_tests.sh ./build/tg
          echo "✓ CFG cross-target matrix passed (all 6 canaries)"

  # ———————————————————————————————————————
  # Stdlib E106 migration sweep (REQUIRED — reviewer item 16: the whole
  # semantic std sweep)
  # The gate behind docs/current/stdlib_reference.md "E106 migration
  # COMPLETE": every std/*.tg module must (1) pass `tg check` — the
  # driver's check command runs the FULL semantic pipeline per module:
  # lex/parse, the imported-dependency merge, the @cfg target elimination,
  # macro expansion, name resolution, the strict type check, the access
  # check, the resource check, MIR lowering, and the post-lower MIR
  # verification (no extra flags: check stops at StopAfter::Mir after the
  # unconditional post-lower verify, before monomorphization/codegen) —
  # with zero diagnostics, and (2) pass the forbidden-syntax grep
  # backstop (refs in type positions outside the __intrinsic_ externs,
  # lifetime tokens, when-in-enum variants, angle-bracket generics,
  # Box[dyn Any]). The sweep enumerates ALL of std/*.tg (currently 133
  # files) and cross-checks the kernel closure's manifest std modules
  # against the swept set, so kernel-closure and non-kernel modules are
  # swept by the same list.
  # Mandatory — a module that checks clean through a parsing gap still
  # fails the grep backstop, so the completeness claim cannot drift.
  # ———————————————————————————————————————
  stdlib-e106-sweep:
    name: Stdlib E106 Sweep
    runs-on: macos-14
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/

      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg

      - name: Run stdlib E106 sweep (full semantic pipeline + forbidden-syntax backstop)
        run: |
          bash tests/run_stdlib_e106_sweep.sh ./build/tg
          echo "✓ Stdlib E106 sweep passed (all std/*.tg modules pass the full semantic pipeline and the forbidden-syntax grep backstop)"

      - name: Upload sweep diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stdlib-e106-sweep-diagnostics
          path: build/.stdlib_e106_sweep/

  # ———————————————————————————————————————
  # Doctests (REQUIRED)
  # The docs/current doctest gate: every fenced Tangerine example in the
  # six doctested documents is canonical-form or carries a verified
  # `compile_fail: <expected diagnostic>` annotation. Runs with the
  # stage3 artifact so the blocks are actually compiled (the structural
  # forbidden-syntax scan is the fallback when no current binary exists).
  # ———————————————————————————————————————
  doctests:
    name: Doctests (docs/current grammar blocks)
    runs-on: macos-14
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/

      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg

      - name: Run the doctest gate
        run: |
          bash scripts/check_doctests.sh ./build/tg
          echo "✓ Every fenced Tangerine example in the doctested documents is canonical-form or a verified compile_fail"

  # ———————————————————————————————————————
  # SAST (CodeQL)
  # ———————————————————————————————————————
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: actions

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  release-freeze:
    name: Release Branch Freeze
    if: startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Enforce permitted path set (fail on unpermitted changes; waivers require a reviewed entry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Bootstrap/test-infrastructure paths permitted on release branches.
          # Everything else fails unless BOTH a tests/release_waivers.json
          # entry and an explicit 'release-waiver:' line in the PR body exist.
          PERMITTED=(
            "run_bootstrap.sh"
            "scripts/bootstrap_helpers.sh"
            "scripts/gen_bootstrap_input.sh"
            "bootstrap/compiler_kernel.manifest"
            "tests/"
            "docs/"
            ".github/workflows/ci.yml"
          )
          BODY="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)"
          HAS_MARKER=0
          if printf '%s' "$BODY" | grep -qE '^release-waiver:'; then
            HAS_MARKER=1
          fi
          CHANGED="$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only 2>/dev/null || true)"
          if [ -z "$CHANGED" ]; then
            echo "::error::release-freeze: could not enumerate changed files for PR $PR_NUMBER"
            exit 1
          fi
          FAILED=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if python3 - "$path" "$HAS_MARKER" "${PERMITTED[@]}" <<'PY'
            import json, sys
            path = sys.argv[1]
            marker = sys.argv[2] == "1"
            permitted = sys.argv[3:]
            if any(path == p or path.startswith(p) for p in permitted):
                sys.exit(0)
            waived = False
            try:
                data = json.load(open("tests/release_waivers.json"))
                waived = path in data.get("waived", {})
            except Exception:
                waived = False
            if waived and marker:
                print(f"::notice::release-freeze: {path} waived by reviewed waiver entry")
                sys.exit(0)
            print(f"::error::release-freeze: {path} is outside the permitted path set; a change requires a tests/release_waivers.json entry AND a 'release-waiver:' line in the PR body")
            sys.exit(1)
            PY
            then
              :
            else
              FAILED=$((FAILED + 1))
            fi
          done <<< "$CHANGED"
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::release-freeze: $FAILED path(s) outside the permitted set (no reviewed waiver)"
            exit 1
          fi
          echo "✓ Release-branch path set enforced: all changed paths permitted or waived"

  # ———————————————————————————————————————
  # Workflow lint
  # ———————————————————————————————————————
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  # ———————————————————————————————————————
  # Release gate — THE AGGREGATE (the one required status check)
  # The `main` ruleset requires exactly TWO required-status-checks
  # contexts: `release-gate` (this job) and `CodeQL` (the check run the
  # sast job's CodeQL action records — required separately; see the
  # MAIN-BRANCH PROTECTION block at the top of this file). This job runs
  # `if: always()` — it executes even when a dependency failed — and its
  # check step inspects the result of every dependency (toJSON(needs)):
  # it lists each dependency whose result is not success and exits
  # nonzero when any failed. The evidence-gate job machine-verifies EXACT
  # SET EQUALITY between this needs: list and
  # .github/release_required_jobs.txt (the reviewer's item 35; sast is
  # excluded — the ruleset requires it as the separate "CodeQL" context),
  # so the policy cannot drift from the aggregate or from the file.
  # ———————————————————————————————————————
  release-gate:
    name: Release gate (aggregate of every required check)
    needs: [abi-platform, allocator, atomic-litmus, bootstrap, cfg-matrix, conformance, cross-compile, crypto-kat, db-integration-mysql, db-integration-postgres, doctests, evidence-gate, gfx-ui, gfx-ui-visual, lint, release-proof, stdlib-e106-sweep, stdlib-integration, stdlib-new-modules, verifier-projection, verifier-stress, workflow-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required dependency succeeded
        run: |
          set -euo pipefail
          printf '%s\n' '${{ toJSON(needs) }}' > .release-gate-needs.json
          python3 - .release-gate-needs.json <<'PY'
          import json, sys
          with open(sys.argv[1]) as fh:
              needs = json.load(fh)
          failed = sorted(n for n, r in needs.items() if r.get("result") != "success")
          total = len(needs)
          if failed:
              print("::error::release-gate FAILED: %d of %d required dependencies did not succeed: %s"
                    % (len(failed), total, ", ".join(failed)))
              sys.exit(1)
          print("release-gate OK: all %d required dependencies succeeded" % total)
          PY

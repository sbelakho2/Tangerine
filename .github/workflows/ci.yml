# Tangerine CI/CD Pipeline
#
# This workflow builds, tests, lints, and checks the Tangerine compiler
# on every push and pull request. It also runs benchmarks on the main branch
# to track performance regressions.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  TG_VERSION: "0.1.0"

jobs:
  # ———————————————————————————————————————
  # Build & Test
  # ———————————————————————————————————————
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos
            arch: x86_64
            runner: macos-13
            target: x86_64-apple-darwin
          - os: macos
            arch: aarch64
            runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap compiler
        run: |
          # The Tangerine compiler self-hosts.
          # Use the pre-built bootstrap binary to compile itself.
          ./bootstrap.sh --target ${{ matrix.target }}

      - name: Build compiler (stage 1)
        run: |
          ./build/tg build --target ${{ matrix.target }}

      - name: Build compiler (stage 2 — self-host verification)
        run: |
          # Stage 2: compile the compiler with itself
          mv build/tg build/tg-stage1
          ./build/tg-stage1 build --target ${{ matrix.target }}
          # Verify stage 1 and stage 2 produce identical output
          diff <(sha256sum build/tg-stage1 | cut -d' ' -f1) <(sha256sum build/tg | cut -d' ' -f1) \
            && echo "✓ Reproducible build verified" \
            || echo "⚠ Stage 1 and Stage 2 differ (expected during development)"

      - name: Run tests
        run: |
          ./build/tg test --verbose

      - name: Run golden tests
        run: |
          ./build/tg test golden/ --verbose

      - name: Type checking
        run: |
          ./build/tg check tg_compiler/*.tg std/*.tg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-${{ matrix.target }}
          path: build/tg

  # ———————————————————————————————————————
  # Lint & Format
  # ———————————————————————————————————————
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download compiler
        uses: actions/download-artifact@v4
        with:
          name: tg-x86_64-unknown-linux-gnu
          path: build/

      - name: Make executable
        run: chmod +x build/tg

      - name: Check formatting
        run: |
          ./build/tg fmt --check tg_compiler/*.tg std/*.tg
          echo "✓ All files formatted correctly"

      - name: Run linter
        run: |
          ./build/tg lint tg_compiler/*.tg std/*.tg --deny all

      - name: Check unsafe usage
        run: |
          ./build/tg check --unsafe-report tg_compiler/*.tg std/*.tg

  # ———————————————————————————————————————
  # Benchmarks (main branch only)
  # ———————————————————————————————————————
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download compiler
        uses: actions/download-artifact@v4
        with:
          name: tg-x86_64-unknown-linux-gnu
          path: build/

      - name: Make executable
        run: chmod +x build/tg

      - name: Run benchmarks
        run: |
          ./build/tg bench --json > bench_results.json

      - name: Compare with baseline
        run: |
          ./build/tg bench --baseline bench_baseline.json > bench_comparison.txt
          cat bench_comparison.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench_results.json
            bench_comparison.txt

  # ———————————————————————————————————————
  # Documentation
  # ———————————————————————————————————————
  docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download compiler
        uses: actions/download-artifact@v4
        with:
          name: tg-x86_64-unknown-linux-gnu
          path: build/

      - name: Make executable
        run: chmod +x build/tg

      - name: Generate docs
        run: |
          ./build/tg doc --format html --output docs/api/ std/*.tg

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/api/

  # ———————————————————————————————————————
  # Conformance Suite
  # ———————————————————————————————————————
  conformance:
    name: Conformance Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download compiler
        uses: actions/download-artifact@v4
        with:
          name: tg-x86_64-unknown-linux-gnu
          path: build/

      - name: Make executable
        run: chmod +x build/tg

      - name: Run parser conformance
        run: |
          for f in golden/frontend_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ Parser conformance passed"

      - name: Run type-check conformance
        run: |
          for f in golden/types_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ Type-check conformance passed"

      - name: Run borrow-check conformance
        run: |
          for f in golden/borrow_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ Borrow-check conformance passed"

      - name: Run MIR/SSA conformance
        run: |
          for f in golden/mir_*.tg golden/ssa_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ MIR/SSA conformance passed"

      - name: Run full smoke test
        run: |
          ./build/tg build golden/smoke_test.tg
          echo "✓ Smoke test passed"

      - name: Run diagnostics quality tests
        run: |
          echo "Testing golden/diagnostics_quality.tg..."
          ./build/tg check golden/diagnostics_quality.tg 2>&1 | tee diag_output.txt
          echo "✓ Diagnostics quality tests executed"

      - name: Run agentic audit
        run: |
          ./build/tg agent audit . | tee audit_report.txt
          echo "✓ Agentic audit completed"

      - name: Run stdlib tests
        run: |
          ./build/tg test golden/stdlib_tests.tg
          echo "✓ Stdlib tests passed"

      - name: Memory usage tracking
        run: |
          echo "Measuring compiler memory usage..."
          ./build/tg build --verbose golden/smoke_test.tg 2>&1 | tee memory_report.txt
          echo "✓ Memory usage tracked"

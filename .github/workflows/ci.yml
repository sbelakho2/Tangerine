# Tangerine CI/CD Pipeline
#
# Radical simplification per the bootstrap audit:
#   macOS/AArch64 bootstrap fixed point
#         -> stage3 artifact
#         -> bootstrap tests / conformance / stdlib / tooling
#
# Everything that needs `tg` downloads the validated stage3 artifact from the
# `bootstrap` job. There is no pretend Linux/x86_64 self-host matrix: Tangerine
# does not yet supply a Linux bootstrap artifact, and the empty `build/tg`
# placeholder fallback has been removed.
#
# ────────────────────────────────────────────────────────────────────────────
# MAIN-BRANCH PROTECTION — THE DOCUMENTED REQUIRED-CHECK POLICY
# (the reviewer's "no admin bypass for ordinary merges" item)
# ────────────────────────────────────────────────────────────────────────────
# The merge gate for `main` is the REQUIRED CHECKS list below. It IS the
# enforced gate: every job in the list must be green before an ordinary
# merge, and NO ADMIN BYPASS applies to ordinary merges (the documented
# branch-protection policy — an admin override is reserved for the
# release-freeze emergency path only, and even that path must pass the
# release-freeze job's path-set gate). The list is machine-verified by the
# `evidence-gate` job: every documented check id must exist as a job in
# this workflow, so the policy cannot drift from the workflow's job list.
#
# REQUIRED CHECKS FOR MAIN (each id is a job in this workflow):
#   abi-platform          ABI / platform contract suites (pthread ABI,
#                         syscall translation, LSE contract, extern-ABI
#                         negative returns, spawn failure path)
#   allocator             allocator boundary suites (churn/large/oom/
#                         reuse/threaded/alignment + Arc lifecycle)
#   atomic-litmus         memory-ordering litmus suites (SB/MP/WRC/AcqRel/
#                         CAS-Publish/CAS-Fail)
#   bootstrap             stage0 -> stage1 -> stage2 -> stage3 fixed point
#                         (stage2 == stage3 byte-identical) -> the stage3
#                         artifact every other job consumes
#   cfg-matrix            the @cfg cross-target matrix (6 canaries, explicit
#                         --target overrides)
#   conformance           parser/type-check/access/resource/generic/MIR
#                         conformance + the agentic audit
#   cross-compile         native arm64 lane + x86-64 cross lane (trap-stub
#                         gate; Rosetta/qemu execution when available)
#   crypto-kat            known-answer vectors over std/crypto.tg
#   db-integration-mysql  MySQL driver lane (native Homebrew server + the
#                         tg_mysql_* shim with the real MYSQL_BIND)
#   db-integration-postgres Postgres driver lane (native Homebrew server,
#                         ? -> $n translation, prepared statements)
#   doctests              every fenced Tangerine example in docs/current/**
#                         compiled/checked (structural fallback; the
#                         history excluded)
#   evidence-gate         GENERATE-THEN-DIFF: regenerates the canary
#                         manifests' self-description (count + manifest
#                         sha256 + test-list sha256) and the feature
#                         registry (features.toml -> feature_registry.md)
#                         and runs `git diff --exit-code` — a stale
#                         committed count or a drifted registry cannot
#                         merge; also machine-verifies this REQUIRED
#                         CHECKS list
#   gfx-ui                GFX/UI module checks (compile, stub scan, ABI
#                         layout, unit + integration + conformance)
#   gfx-ui-visual         golden visual regression + determinism/replay +
#                         fuzz/property checks
#   lint                  fmt --check, encoding, control-flow forms,
#                         lint --deny all, unsafe-report
#   stdlib-e106-sweep     two-layer parse-clean gate over every std/*.tg
#   stdlib-integration    net / db / sync / async integration suites +
#                         the TLS/epoll shim lanes
#   stdlib-new-modules    test-runner + bench-runner integrity gates and
#                         the simd/embedded/mmap/gpu/linalg/... lanes
#   sast                  CodeQL SAST (actions)
#   verifier-projection   the projected-place copy-safety backstop
#   workflow-lint         actionlint over this workflow
#
# The `bench` and `docs` jobs are main-branch-only EXTRAS (benchmark
# baselining, Pages deploy): they run on main pushes but are not part of
# the ordinary-merge gate. The `release-freeze` job gates release/**
# branch PRs (the permitted path set + reviewed waivers).
# ────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    # release/** PR bases must trigger the workflow or the release-freeze job
    # (if: startsWith(github.base_ref, 'release/')) can never run — a freeze
    # gate that cannot trigger is dead code.
    branches: [main, release/**]

env:
  TG_VERSION: "0.1.0"
  # Pinned known-good benchmark baseline release tag. The bench job fails when
  # the artifact is absent (no self-baselining).
  TG_BENCH_BASELINE_TAG: "tg-bench-baseline-v1"

jobs:
  # ———————————————————————————————————————
  # From-source bootstrap fixed-point
  # Proves: stage0 (Swift) -> stage1 -> stage2 -> stage3, stage2 == stage3.
  # Produces the validated stage3 artifact consumed by every other job.
  # ———————————————————————————————————————
  bootstrap:
    name: Bootstrap fixed point (macos aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift 6 toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Verify Swift toolchain
        run: swift --version

      - name: Run full bootstrap (stage0 -> stage1 -> stage2 -> stage3)
        env:
          TG_BOOTSTRAP_TRACE: "1"
        run: bash ./run_bootstrap.sh

      - name: Upload bootstrap logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs
          path: build/bootstrap/

      - name: Upload phase fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-fingerprints
          path: build/.fingerprints/

      - name: Upload native canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-native-tests
          path: build/.native_tests/

      - name: Upload stage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: |
            build/tg_stage1
            build/tg_stage2
            build/tg_stage3

  # ———————————————————————————————————————
  # Reusable step: materialize the validated stage3 artifact as build/tg.
  # All tg-consuming jobs `needs: bootstrap` and run on macos-14 (the only
  # host that can execute the macOS/aarch64 stage3 binary).
  # ———————————————————————————————————————

  # ———————————————————————————————————————
  # Lint & Format
  # ———————————————————————————————————————
  lint:
    name: Lint & Format
    runs-on: macos-14
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/

      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg

      - name: Check formatting
        run: |
          ./build/tg fmt --check tg_compiler/*.tg std/*.tg
          echo "✓ All files formatted correctly"

      - name: Check source encoding integrity
        run: |
          python3 scripts/check_encoding.py

      - name: Check Tangerine control-flow forms
        run: |
          python3 scripts/check_tg_control_flow_forms.py

      - name: Run linter
        run: |
          ./build/tg lint tg_compiler/*.tg std/*.tg --deny all

      - name: Check unsafe usage
        run: |
          ./build/tg check --unsafe-report tg_compiler/*.tg std/*.tg

  # ———————————————————————————————————————
  # Benchmarks (main branch only)
  # ———————————————————————————————————————
  bench:
    name: Benchmarks
    runs-on: macos-14
    if: github.ref == 'refs/heads/main'
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/

      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg

      - name: Fetch pinned benchmark baseline (no self-baselining)
        run: |
          set -euo pipefail
          if ! gh release download "$TG_BENCH_BASELINE_TAG" \
               --repo "$GITHUB_REPOSITORY" \
               --pattern bench_baseline.json \
               --dir . --clobber 2>/dev/null; then
            echo "::error::benchmark baseline missing from pinned release '$TG_BENCH_BASELINE_TAG'; absence of a pinned known-good baseline is a CI configuration failure — publish bench_baseline.json to that release before benchmarking"
            exit 1
          fi
          echo "Pinned baseline fetched from release '$TG_BENCH_BASELINE_TAG'"

      - name: Run benchmarks
        run: |
          ./build/tg bench --json > bench_results.json

      - name: Compare with pinned baseline
        run: |
          ./build/tg bench --baseline bench_baseline.json > bench_comparison.txt
          cat bench_comparison.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench_results.json
            bench_comparison.txt

  # ———————————————————————————————————————
  # Documentation
  # ———————————————————————————————————————
  docs:
    name: Generate Documentation
    runs-on: macos-14
    needs: bootstrap
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/

      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg

      - name: Generate docs
        run: |
          ./build/tg doc --format html --output docs/api/ std/*.tg

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/api/

  # ———————————————————————————————————————
  # Conformance Suite
  # ———————————————————————————————————————
  conformance:
    name: Conformance Tests
    runs-on: macos-14
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/

      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg

      - name: Run parser conformance
        run: |
          for f in golden/frontend_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ Parser conformance passed"

      - name: Run type-check conformance
        run: |
          for f in golden/types_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ Type-check conformance passed"

      - name: Run access/resource/set/sink/deinit/capability/generic conformance (manifest-driven headline)
        run: |
          bash tests/run_conformance_canaries.sh ./build/tg
          echo "✓ Ownership/access conformance headline passed (manifest-driven)"

      - name: Run historical borrow-era golden tests (kept for history; not the headline)
        run: |
          for f in golden/borrow_01.tg golden/borrow_02.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ Historical borrow-era tests passed"

      - name: Run MIR/SSA conformance
        run: |
          for f in golden/mir_*.tg golden/ssa_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ MIR/SSA conformance passed"

      - name: Run full smoke test
        run: |
          ./build/tg build golden/smoke_test.tg
          echo "✓ Smoke test passed"

      - name: Run diagnostics quality tests
        run: |
          echo "Testing golden/diagnostics_quality.tg..."
          ./build/tg check golden/diagnostics_quality.tg 2>&1 | tee diag_output.txt
          echo "✓ Diagnostics quality tests executed"

      - name: Run agentic audit
        run: |
          ./build/tg agent audit . | tee audit_report.txt
          echo "✓ Agentic audit completed"

      - name: Run stdlib tests
        run: |
          ./build/tg test golden/stdlib_tests.tg
          echo "✓ Stdlib tests passed"

      - name: Memory usage tracking
        run: |
          echo "Measuring compiler memory usage..."
          ./build/tg build --verbose golden/smoke_test.tg 2>&1 | tee memory_report.txt
          echo "✓ Memory usage tracked"

  # ———————————————————————————————————————
  # GFX/UI Module Tests (§22)
  # Runs on macos-14 with the validated stage3 artifact.
  # ———————————————————————————————————————
  gfx-ui:
    name: GFX/UI
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: GFX/UI module compilation check
        run: make test-gfx-ui
      - name: Stub scan
        run: make stub-scan
      - name: ABI layout check
        run: make abi-layout-check
      - name: Unit checks (geometry)
        run: ./build/tg test tests/unit/test_geom.tg
      - name: Unit checks (events)
        run: ./build/tg test tests/unit/test_events.tg
      - name: Unit checks (paint)
        run: ./build/tg test tests/unit/test_paint.tg
      - name: Unit checks (text)
        run: ./build/tg test tests/unit/test_text.tg
      - name: Unit checks (capability)
        run: ./build/tg test tests/unit/test_capability.tg
      - name: Integration checks
        run: ./build/tg test tests/integration/test_pipelines.tg
      - name: ABI conformance checks
        run: ./build/tg test tests/abi/test_abi_conformance.tg
      - name: Consistency checks
        run: ./build/tg test tests/consistency/test_consistency.tg

  gfx-ui-visual:
    name: GFX/UI Visual Regression
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Golden visual regression checks
        run: ./build/tg test tests/golden/test_visual_regression.tg
      - name: Determinism/replay checks
        run: ./build/tg test tests/determinism/test_replay.tg
      - name: Fuzz/property checks
        run: ./build/tg test tests/fuzz/test_fuzz.tg
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: target/visual-diffs/

  gfx-ui-gate:
    name: GFX/UI Required Gate
    needs: [gfx-ui, gfx-ui-visual]
    runs-on: macos-14
    steps:
      - name: All GFX/UI checks passed
        run: echo "✓ All GFX/UI CI gates passed"

  # ———————————————————————————————————————
  # Evidence gate (REQUIRED — the generate-then-diff discipline)
  # Regenerates the canary manifests' self-description (the suite count +
  # the manifest sha-256 + the test-list sha-256) and the feature registry
  # (features.toml -> feature_registry.md) and runs `git diff --exit-code`:
  # a STALE COMMITTED COUNT CANNOT MERGE, and a drifted hand-edited
  # registry cannot merge either. Also machine-verifies the documented
  # REQUIRED CHECKS list (the main-branch protection policy) against the
  # workflow's own job list, and runs the structural doctest coverage
  # gate (the compiler-backed doctest path is the `doctests` job).
  # Runs without the bootstrap artifact (pure shell + python3).
  # ———————————————————————————————————————
  evidence-gate:
    name: Evidence gate (generate-then-diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the canary manifest self-description (count + manifest sha256 + test-list sha256)
        run: |
          set -euo pipefail
          bash ./scripts/gen_status.sh --refresh-manifests
          git diff --exit-code -- tests/canary/MANIFEST tests/canary_neg/MANIFEST tests/arm64/MANIFEST
          echo "✓ Canary manifests are current (a stale committed count cannot merge)"

      - name: Regenerate the feature registry (features.toml -> feature_registry.md)
        run: |
          set -euo pipefail
          bash ./scripts/gen_feature_registry.sh
          git diff --exit-code -- features.toml docs/current/feature_registry.md
          echo "✓ The feature registry is current (generated evidence; a drifted registry cannot merge)"

      - name: Verify the REQUIRED CHECKS list (the documented main-branch protection policy)
        run: |
          set -euo pipefail
          # Extract the documented check ids from the REQUIRED CHECKS block
          # at the top of this workflow and assert every one is a job in
          # this workflow — the documented policy cannot drift from the
          # job list.
          BLOCK="$(sed -n '/^# REQUIRED CHECKS FOR MAIN/,/^# ─────/p' .github/workflows/ci.yml)"
          MISSING=0
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            if ! grep -qE "^  ${id}:" .github/workflows/ci.yml; then
              echo "::error::required check '$id' is documented but is not a job in this workflow"
              MISSING=1
            else
              echo "  [ok] required check '$id' -> job in this workflow"
            fi
          done <<< "$(printf '%s\n' "$BLOCK" | sed -n 's/^#   \([a-z0-9-][a-z0-9-]*\)  .*/\1/p')"
          [ "$MISSING" -eq 0 ]
          echo "✓ The REQUIRED CHECKS list matches the workflow's job list (no admin bypass for ordinary merges)"

      - name: Run the structural doctest coverage gate (the compiler-backed path is the doctests job)
        run: |
          bash ./scripts/check_doctests.sh
          echo "✓ Every docs/current document is doctested or documented-excluded (history never scanned)"

  # ———————————————————————————————————————
  # Status snapshot (tested SHA + test-artifact hashes)
  # Generates STATUS.txt FROM THE TESTED SHA (the CI checked-out commit)
  # after the tests ran, hashing the uploaded test artifacts (bootstrap
  # phase fingerprints, native canary outputs, cross-lane / litmus
  # binaries), and uploads the snapshot as the `status-snapshot` artifact.
  # The snapshot carries the EVIDENCE fields: the repository SHA, the
  # timestamp, the workflow identity, the canary suites' self-describing
  # counts/hashes, the target suites, the std-module counts, the
  # ABI/integration suites, and the CI-run-provided stage hashes / phase
  # fingerprints.
  # The COMMITTED STATUS.txt is the SHA-independent source-state
  # description and points here; it is never regenerated from a commit.
  # ———————————————————————————————————————
  status:
    name: Status snapshot (tested SHA + artifact hashes)
    needs: [abi-platform, allocator, atomic-litmus, bootstrap, cfg-matrix, conformance, cross-compile, crypto-kat, db-integration-mysql, db-integration-postgres, doctests, evidence-gate, gfx-ui, gfx-ui-visual, stdlib-e106-sweep, stdlib-new-modules, stdlib-integration, verifier-projection, verifier-stress]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # download-artifact@v4 takes ONE pattern per step: a multiline
      # `pattern:` is a single glob string (with embedded newlines), not
      # three patterns. One download per artifact name, all into the
      # hashing dir, so gen_status.sh's --artifacts hash section sees the
      # same file set as before.
      - name: Download bootstrap fingerprint artifact
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-fingerprints
          path: build/.status_artifacts/
      - name: Download bootstrap native canary artifact
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-native-tests
          path: build/.status_artifacts/
      - name: Download cross-lane binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: cross-lane-binaries
          path: build/.status_artifacts/

      - name: Generate the status snapshot from the tested SHA
        run: |
          mkdir -p build/.status_artifacts/generated
          ./scripts/gen_status.sh \
            --artifacts build/.status_artifacts/ \
            build/.status_artifacts/generated/STATUS.txt
          echo "SHA=$(git rev-parse HEAD)" | tee -a build/.status_artifacts/generated/SHA.txt

      - name: Upload the status snapshot
        uses: actions/upload-artifact@v4
        with:
          name: status-snapshot
          path: build/.status_artifacts/generated/

  # ———————————————————————————————————————
  # Crypto Known-Answer Tests (REQUIRED)
  # std::crypto against the published KAT vectors (FIPS 180-4, FIPS 197,
  # RFC 1321, RFC 4231, RFC 7914 §11, RFC 8439 §2.3.2, RFC 4648 §10).
  # ———————————————————————————————————————
  crypto-kat:
    name: Crypto KAT Suite
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Run crypto known-answer tests
        run: |
          ./build/tg test tests/unit/test_crypto_rigor.tg
          echo "✓ Crypto KAT suite passed"

  # ———————————————————————————————————————
  # MIR Verifier Projection Tests (REQUIRED)
  # The projected-place copy-safety backstop (verifier_check_operand_
  # ownership): 13 hand-built MirProgram cases asserting the verifier's
  # accept/reject decisions for projected MirCopy places.
  # ———————————————————————————————————————
  verifier-projection:
    name: Verifier Projection Tests
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Run verifier projection tests
        run: |
          ./build/tg test tests/verifier_projection_tests.tg
          echo "✓ Verifier projection tests passed"

  # ———————————————————————————————————————
  # MIR Verifier Stress (REQUIRED — reviewer item 46)
  # The debug/CI builds run the MIR verifier (verify_mir / verify_function_v2)
  # after MIR construction, after monomorphization, after EVERY transformative
  # optimizer pass (the per-pass checkpoints inside optimize_mir_verified)
  # and after optimization — the final firewall against an upstream checker
  # bug becoming machine-code corruption. This lane compiles the WHOLE canary
  # suite through the FULL pipeline at -O2 (NOT `tg check`, which stops
  # before the optimizer) so every optimizer pass runs — a pass that
  # corrupts the IR aborts the compile with the verifier's diagnostics. The
  # canary_neg set must still be REJECTED through the same verify-everything
  # pipeline. The unit/integration suites run through `tg test` (the
  # construction + final verifies at -O0 — the O0 optimizer runs no passes,
  # so the -O2 canary lane above is what exercises the per-pass
  # checkpoints). `--mode dev` is spelled explicitly: Mode::Dev / Mode::Strict
  # are the verify-everything build modes (Production/Hardened are the
  # verify-once release modes).
  # ———————————————————————————————————————
  verifier-stress:
    name: MIR Verifier Stress (verify-everything)
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: "Compile + run every positive canary with verify-everything (-O2: every optimizer pass, per-pass checkpoints)"
        run: |
          set -euo pipefail
          mkdir -p build/.verifier_stress
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              \#*|"") continue ;;
            esac
            name="${line%.tg}"
            ./build/tg compile --mode dev -O2 -o "build/.verifier_stress/${name}" "tests/canary/${line}"
            "build/.verifier_stress/${name}" >/dev/null
            echo "✓ verifier-stress canary: ${name}"
          done < tests/canary/MANIFEST
          echo "✓ All $(grep -vc '^#' tests/canary/MANIFEST) canaries compiled (verify-everything, -O2) and executed"
      - name: Negative canaries must be rejected through the verify-everything pipeline (-O2)
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              \#*|"") continue ;;
            esac
            if ./build/tg compile --mode dev -O2 -o "build/.verifier_stress/neg_${line%.tg}" "tests/canary_neg/${line}" >/dev/null 2>&1; then
              echo "::error::verifier-stress: canary_neg compiled successfully but must fail: ${line}"
              failures=$((failures + 1))
            fi
          done < tests/canary_neg/MANIFEST
          if [ "$failures" -ne 0 ]; then
            echo "::error::verifier-stress: $failures canary_neg file(s) compiled but must fail"
            exit 1
          fi
          echo "✓ All canary_neg rejected through the verify-everything pipeline"
      - name: Run the verifier + compiler-module test suites (construction + final verifies)
        run: |
          ./build/tg test tests/verifier_projection_tests.tg golden/compiler_module_tests.tg
          echo "✓ Verifier projection + compiler module tests passed through the verify-everything pipeline"
      - name: Run the unit / integration test suites (verify-everything pipeline)
        run: |
          ./build/tg test tests/unit/test_geom.tg tests/unit/test_events.tg tests/unit/test_paint.tg tests/unit/test_text.tg tests/unit/test_capability.tg tests/integration/test_pipelines.tg tests/abi/test_abi_conformance.tg tests/consistency/test_consistency.tg tests/golden/test_visual_regression.tg tests/determinism/test_replay.tg tests/fuzz/test_fuzz.tg
          echo "✓ Unit/integration suites passed through the verify-everything pipeline"

  # ———————————————————————————————————————
  # Allocator Suites (REQUIRED)
  # The runtime allocator boundary suites: churn/reclamation, free-list
  # reuse, large-path, fault-injection OOM, threaded contention, and
  # alignment. Each file is an executable canary (def main, @test-marked):
  # the `tg test` runner compiles it as-is and runs it once; the process
  # exit code is the outcome.
  # ———————————————————————————————————————
  allocator:
    name: Allocator Suites
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Run allocator suites (incl. Arc lifecycle)
        run: |
          ./build/tg test tests/allocator_churn_test.tg tests/allocator_reuse_test.tg tests/allocator_large_test.tg tests/allocator_oom_test.tg tests/allocator_threaded_test.tg tests/allocator_alignment_test.tg tests/arc_lifecycle_test.tg
          echo "✓ Allocator + Arc lifecycle suites passed"

  # ———————————————————————————————————————
  # ABI / Platform Contract Suites (REQUIRED)
  # The adversarial platform-contract layer: the pthread opaque ABI
  # (size AND native alignment) pinned per target, the per-target
  # syscall identity table (linux-aarch64 translation rows + *at
  # argument layouts), the AArch64 LSE requirement as explicit target
  # metadata, and the thread-spawn failure path (fault-injection flag;
  # the placed closure's drop glue must fire exactly once on the
  # failure path). Each file is an executable canary (@test-marked
  # main / @test suite), run once.
  # ———————————————————————————————————————
  abi-platform:
    name: ABI / Platform Contract Suites
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Run ABI / platform contract suites
        run: |
          ./build/tg test tests/pthread_abi_test.tg tests/syscall_translation_test.tg tests/target_lse_contract_test.tg tests/thread_spawn_failure_test.tg
          echo "✓ ABI / platform contract suites passed"

  # ———————————————————————————————————————
  # Atomic Litmus Suites (REQUIRED)
  # The memory-ordering litmus patterns (SB/MP/WRC/AcqRel/CAS-Publish/
  # CAS-Fail) over ITERATIONS independent slots; forbidden outcomes fail
  # the canary. Executable canaries (@test-marked main), run once each.
  # ———————————————————————————————————————
  atomic-litmus:
    name: Atomic Litmus Suites
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Run atomic litmus suites
        run: |
          ./build/tg test tests/atomic_litmus_*.tg
          echo "✓ Atomic litmus suites passed"

  # ———————————————————————————————————————
  # Stdlib Integration Suites (REQUIRED)
  # Minimal end-to-end suites for the network, database, TLS, sync, and
  # async modules: the TCP loopback (listener + client echo), the SQLite
  # in-memory open/create/insert/select, the TLS certificate parse
  # round-trip + config-ownership suites (fixed embedded PEMs) plus the
  # TLS handshake suite (the shim's SSL_accept/SSL_connect over loopback
  # sockets: trusted-CA success, untrusted and wrong-hostname rejections,
  # ALPN h2 negotiation), the mutex-guard contention churn across
  # threads (incl. the condvar notify_one/notify_all ticket semantics),
  # and the async structured-concurrency suites (the TaskScope's async
  # join_all + the error strategies, the CancellationToken tree + the
  # concurrent-registration race, and the reactor's readiness tokens —
  # the second-poll-stays-pending / ready-consume / EAGAIN-re-register
  # semantics on the kqueue-backed reactor).
  #
  # TLS lane self-containment: std::tls declares the custom extern shim
  # family (tls_x509_* / tls_ssl_* / tls_pkey_* / tls_load_file); this job
  # builds the in-repository implementation (native/tls_shims.c, small C
  # wrappers over the system OpenSSL) into build/libtg_tls_shims.dylib,
  # gates every declared extern as an exported Mach-O symbol, and supplies
  # the shim to the tg-compiled TLS test processes. The same pattern
  # builds the epoll shim (native/epoll_shims.c — the real libc packed
  # epoll_event struct + the conversion to the Tangerine-native
  # representation; ENOSYS stubs off-Linux) into
  # build/libtg_epoll_shims.dylib and gates its exports.
  # ———————————————————————————————————————
  stdlib-integration:
    name: Stdlib Integration (net/db/tls/sync/async)
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Build the TLS shim (native/tls_shims.c -> build/libtg_tls_shims.dylib)
        run: |
          set -euo pipefail
          mkdir -p build
          # OpenSSL headers/libs: Homebrew openssl@3 is preinstalled on the
          # macos-14 runners; fall back to the system /usr/lib libssl/libcrypto.
          if [ -d "$(brew --prefix openssl@3 2>/dev/null || true)/include/openssl" ]; then
            OPENSSL_PREFIX="$(brew --prefix openssl@3)"
            cc -fPIC -shared -o build/libtg_tls_shims.dylib native/tls_shims.c \
              -I"$OPENSSL_PREFIX/include" -L"$OPENSSL_PREFIX/lib" -lssl -lcrypto
          else
            cc -fPIC -shared -o build/libtg_tls_shims.dylib native/tls_shims.c -lssl -lcrypto
          fi
          # Structural gate: every tls_* extern declared by std::tls must be
          # exported by the shim (underscore-prefixed Mach-O symbols).
          for sym in \
            tls_ssl_new tls_ssl_free tls_ssl_set_min_version tls_ssl_set_max_version \
            tls_ssl_set_hostname tls_ssl_set_certificate tls_ssl_set_private_key \
            tls_ssl_set_verify tls_ssl_connect tls_ssl_accept tls_ssl_read \
            tls_ssl_write tls_ssl_shutdown \
            tls_ssl_set_default_verify_paths tls_ssl_add_ca_cert \
            tls_ssl_set_alpn_protos tls_ssl_set_alpn_select tls_ssl_get_alpn \
            tls_ssl_set_cipher_list tls_ssl_set_cipher_suites \
            tls_x509_from_pem tls_x509_free tls_x509_to_der \
            tls_x509_get_subject_cn tls_x509_is_expired \
            tls_pkey_from_pem tls_pkey_free tls_pkey_to_der tls_load_file; do
            nm -gU build/libtg_tls_shims.dylib | grep -q " _$sym$" \
              || { echo "::error::TLS shim missing export: $sym"; exit 1; }
          done
          echo "✓ libtg_tls_shims.dylib built with all 29 std::tls extern exports"

      - name: Build the epoll shim (native/epoll_shims.c -> build/libtg_epoll_shims.dylib)
        run: |
          set -euo pipefail
          mkdir -p build
          # The Linux x86-64 epoll_event is a PACKED 12-byte struct; the
          # std::async epoll calls route through this shim (the real libc
          # struct + the conversion to the Tangerine-native 16-byte
          # representation). On macOS the entry points are ENOSYS stubs
          # (the reactor uses kqueue) — the exports must still exist for
          # the flat-namespace preload contract.
          cc -fPIC -shared -o build/libtg_epoll_shims.dylib native/epoll_shims.c
          # Structural gate: every tg_epoll_* extern declared by std::async
          # must be exported by the shim (underscore-prefixed Mach-O
          # symbols).
          for sym in tg_epoll_create1 tg_epoll_ctl tg_epoll_wait tg_errno_is_eagain; do
            nm -gU build/libtg_epoll_shims.dylib | grep -q " _$sym$" \
              || { echo "::error::epoll shim missing export: $sym"; exit 1; }
          done
          echo "✓ libtg_epoll_shims.dylib built with all 4 std::async epoll exports"

      - name: Run net loopback / negative-return ABI / db / sync integration suites
        run: |
          ./build/tg test tests/net_loopback_test.tg tests/net_negative_abi_test.tg tests/db_integration_test.tg tests/db_lifecycle_test.tg tests/db_async_pool_test.tg tests/db_postgres_lexer_test.tg tests/sync_contention_test.tg tests/task_scope_test.tg tests/cancellation_token_test.tg tests/reactor_readiness_test.tg
          echo "✓ Net loopback / negative-return ABI / db / sync / task-scope / cancellation-token / reactor-readiness integration suites passed"

      - name: Run TLS interop + handshake suites (shim preloaded into the test processes)
        run: |
          set -euo pipefail
          # The tg toolchain's link step is the in-house Mach-O linker
          # (tg_compiler/linker.tg link_macho64): it emits exactly one
          # LC_LOAD_DYLIB (/usr/lib/libSystem.B.dylib) and records every
          # undefined extern — the tls_x509_* / tls_ssl_* / tls_pkey_*
          # calls among them — as a dyld import. The driver has no
          # link-flags / module-link-config mechanism to add the shim as a
          # second LC_LOAD_DYLIB dependency, so the lane supplies the shim
          # by preloading it into every tg-compiled test process
          # (DYLD_INSERT_LIBRARIES): libtg_tls_shims.dylib is then in the
          # process image list before main, and DYLD_FORCE_FLAT_NAMESPACE
          # routes the imports through flat lookup, which searches every
          # loaded image including the inserted shim.
          DYLD_INSERT_LIBRARIES="$PWD/build/libtg_tls_shims.dylib" \
          DYLD_FORCE_FLAT_NAMESPACE=1 \
            ./build/tg test tests/tls_interop_test.tg tests/tls_handshake_test.tg
          echo "✓ TLS interop + handshake suites passed"

  # ———————————————————————————————————————
  # DB Postgres lane (REQUIRED)
  # The std::db non-SQLite lane: the Postgres driver (libpq externs
  # PQconnectdb/PQexec/PQexecParams/PQprepare/PQexecPrepared/PQgetvalue/
  # ...) against a NATIVE Homebrew postgresql@16 server (localhost:5432,
  # initdb + pg_ctl started in the job). GitHub Actions forbids Docker
  # service containers on macOS runners, so the lane runs the server as a
  # native process instead. The tg toolchain's in-house Mach-O linker
  # emits exactly one LC_LOAD_DYLIB and records the PQ* calls as dyld
  # imports, so — exactly like the TLS shim lane — the lane preloads
  # libpq (and its brew OpenSSL deps) into the test process
  # (DYLD_INSERT_LIBRARIES + DYLD_FORCE_FLAT_NAMESPACE). The lane is
  # gated behind the started server: the test only runs where the server
  # exists. The driver translates the JDBC `?` placeholder to PostgreSQL's
  # $1..$n positional parameters, owns every parameter payload in the
  # PgParamBacking, and runs prepared statements server-side
  # (PQprepare/PQexecPrepared with a DEALLOCATE on drop).
  # ———————————————————————————————————————
  db-integration-postgres:
    name: DB Postgres Lane (native Homebrew postgresql@16)
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Install libpq + PostgreSQL 16 (native server)
        run: |
          set -euo pipefail
          brew install libpq postgresql@16 openssl@3
          echo "libpq: $(brew --prefix libpq)/lib/libpq.dylib"
          echo "openssl: $(brew --prefix openssl@3)"
      - name: Initialize and start the PostgreSQL server (native process)
        run: |
          set -euo pipefail
          PGBIN="$(brew --prefix postgresql@16)/bin"
          PGDATA="$RUNNER_TEMP/pgdata"
          rm -rf "$PGDATA"
          "$PGBIN/initdb" -D "$PGDATA" -U postgres --auth=trust >/dev/null
          "$PGBIN/pg_ctl" -D "$PGDATA" -l "$RUNNER_TEMP/postgres.log" -o "-p 5432" start
          for _ in $(seq 1 30); do
            if "$PGBIN/pg_isready" -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          "$PGBIN/pg_isready" -h 127.0.0.1 -p 5432 -U postgres
      - name: Run the Postgres driver lane (libpq preloaded, native server)
        run: |
          set -euo pipefail
          DYLD_INSERT_LIBRARIES="$(brew --prefix libpq)/lib/libpq.dylib:$(brew --prefix openssl@3)/lib/libssl.3.dylib:$(brew --prefix openssl@3)/lib/libcrypto.3.dylib" \
          DYLD_FORCE_FLAT_NAMESPACE=1 \
            ./build/tg test tests/db_postgres_integration_test.tg
          echo "✓ DB Postgres lane passed (native Homebrew server)"

  # ———————————————————————————————————————
  # DB MySQL lane (REQUIRED)
  # The std::db MySQL driver (libmysqlclient externs
  # mysql_init/mysql_real_connect/mysql_query/mysql_real_query/
  # mysql_stmt_init/mysql_stmt_prepare/mysql_stmt_execute/
  # mysql_store_result/mysql_fetch_row/... plus the tg_mysql_* shim
  # externs) against a NATIVE Homebrew mysql server (127.0.0.1:3306,
  # root/root, database test — mysqld initialized and started in the
  # job). GitHub Actions forbids Docker service containers on macOS
  # runners, so the lane runs the server as a native process instead.
  # The tg toolchain's in-house Mach-O linker emits exactly one
  # LC_LOAD_DYLIB and records the mysql_* / tg_mysql_* calls as dyld
  # imports, so — exactly like the TLS shim lane — the lane preloads the
  # MYSQL SHIM (build/libtg_mysql_shims.dylib, built from
  # native/mysql_shims.c — the in-repository implementation of the
  # tg_mysql_* extern family that internally manipulates the real
  # MYSQL_BIND) plus libmysqlclient (and its brew OpenSSL deps) into the
  # test process (DYLD_INSERT_LIBRARIES + DYLD_FORCE_FLAT_NAMESPACE).
  # The lane is gated behind the started server: the test only runs
  # where the server exists. Every parameterized statement uses the REAL
  # MYSQL_BIND parameter binding (built inside the shim from the
  # Tangerine MysqlParam descriptors + mysql_stmt_execute) — the
  # hostile-value / multibyte / binary-blob cases are shipped as data,
  # never interpolated. The layout-probe test pins the Tangerine
  # @repr(C) descriptor layouts against the C-side facts, and the
  # large-result test exercises the truncation + mysql_stmt_fetch_column
  # refetch path at the 64KiB boundary and beyond.
  # ———————————————————————————————————————
  db-integration-mysql:
    name: DB MySQL Lane (native Homebrew mysql)
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Install MySQL (native server + client libraries)
        run: |
          set -euo pipefail
          brew install mysql openssl@3
          echo "mysqlclient: $(brew --prefix mysql)/lib/libmysqlclient.dylib"
          echo "openssl: $(brew --prefix openssl@3)"
      - name: Initialize and start the MySQL server (native process)
        run: |
          set -euo pipefail
          MYSQL_BIN="$(brew --prefix mysql)/bin"
          MYSQL_DATADIR="$RUNNER_TEMP/mysql-data"
          rm -rf "$MYSQL_DATADIR"
          mkdir -p "$MYSQL_DATADIR"
          "$MYSQL_BIN/mysqld" --initialize-insecure --datadir="$MYSQL_DATADIR" --log-error="$RUNNER_TEMP/mysql-init.log"
          "$MYSQL_BIN/mysqld" --datadir="$MYSQL_DATADIR" --port=3306 \
            --socket="$RUNNER_TEMP/mysql.sock" --log-error="$RUNNER_TEMP/mysql.log" &
          for _ in $(seq 1 30); do
            if "$MYSQL_BIN/mysqladmin" ping -h 127.0.0.1 -uroot >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          "$MYSQL_BIN/mysqladmin" ping -h 127.0.0.1 -uroot
          "$MYSQL_BIN/mysql" -h 127.0.0.1 -uroot -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'root'; CREATE DATABASE IF NOT EXISTS test;"
      - name: Build the MySQL shim (native/mysql_shims.c -> build/libtg_mysql_shims.dylib)
        run: |
          set -euo pipefail
          mkdir -p build
          # The tg_mysql_* extern family (std::db) routes every MYSQL_BIND
          # touch through this shim — the real st_mysql_bind is manipulated
          # HERE (compiled against the real mysql.h), never in the Tangerine
          # module. The same build pattern as the TLS / epoll shims.
          MYSQL_PREFIX="$(brew --prefix mysql)"
          cc -fPIC -shared -o build/libtg_mysql_shims.dylib native/mysql_shims.c \
            -I"$MYSQL_PREFIX/include/mysql" -L"$MYSQL_PREFIX/lib" -lmysqlclient
          # Structural gate: every tg_mysql_* extern declared by std::db must
          # be exported by the shim (underscore-prefixed Mach-O symbols).
          for sym in tg_mysql_stmt_bind_and_execute tg_mysql_stmt_bind_result \
                     tg_mysql_stmt_fetch_column tg_mysql_layout_probe; do
            nm -gU build/libtg_mysql_shims.dylib | grep -q " _$sym$" \
              || { echo "::error::MySQL shim missing export: $sym"; exit 1; }
          done
          echo "✓ libtg_mysql_shims.dylib built with all 4 std::db tg_mysql_* extern exports"
      - name: Run the MySQL driver lane (shim + libmysqlclient preloaded, native server)
        run: |
          set -euo pipefail
          DYLD_INSERT_LIBRARIES="$PWD/build/libtg_mysql_shims.dylib:$(brew --prefix mysql)/lib/libmysqlclient.dylib:$(brew --prefix openssl@3)/lib/libssl.3.dylib:$(brew --prefix openssl@3)/lib/libcrypto.3.dylib" \
          DYLD_FORCE_FLAT_NAMESPACE=1 \
            ./build/tg test tests/db_mysql_integration_test.tg tests/db_mysql_layout_probe_test.tg tests/db_mysql_large_result_test.tg
          echo "✓ DB MySQL lane passed (shim + native Homebrew server)"

  # ———————————————————————————————————————
  # New stdlib module tests
  # Runs on macos-14 with the validated stage3 artifact.
  # ———————————————————————————————————————
  stdlib-new-modules:
    name: Stdlib New Modules
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Test-runner integrity gate (pass / fail / zero-test / parse-error / implicit-recognized-selection)
        run: |
          bash tests/run_test_runner_integrity.sh ./build/tg
      - name: Bench-runner integrity gate (pass / fail / parse-error / zero-@bench / compile-error / discovery / zero-discovery)
        run: |
          bash tests/run_bench_runner_integrity.sh ./build/tg
      - name: Verify stdlib modules without @test suites (simd embedded mmap gpu)
        run: |
          set -euo pipefail
          mkdir -p build/.stdlib_verify
          for m in simd embedded mmap gpu; do
            echo "=== std/$m.tg ==="
            ./build/tg check "std/$m.tg"
            ./build/tg compile -c -o "build/.stdlib_verify/std_${m}.o" "std/$m.tg"
            printf 'use std::%s\n\ndef main() -> Int\n  0\nend\n' "$m" > "build/.stdlib_verify/std_${m}_smoke.tg"
            ./build/tg compile -o "build/.stdlib_verify/std_${m}_smoke" "build/.stdlib_verify/std_${m}_smoke.tg"
            ./build/.stdlib_verify/std_${m}_smoke
          done
          echo "✓ simd/embedded/mmap/gpu: check + object + link/import smoke passed"
      - name: Verify stdlib modules with @test suites (linalg float_control validation web_ext opentelemetry wasm_js)
        run: |
          set -euo pipefail
          mkdir -p build/.stdlib_verify
          for m in linalg float_control validation web_ext opentelemetry wasm_js; do
            echo "=== std/$m.tg ==="
            ./build/tg check "std/$m.tg"
            ./build/tg compile -c -o "build/.stdlib_verify/std_${m}.o" "std/$m.tg"
            printf 'use std::%s\n\ndef main() -> Int\n  0\nend\n' "$m" > "build/.stdlib_verify/std_${m}_smoke.tg"
            ./build/tg compile -o "build/.stdlib_verify/std_${m}_smoke" "build/.stdlib_verify/std_${m}_smoke.tg"
            ./build/.stdlib_verify/std_${m}_smoke
            ./build/tg test "std/$m.tg"
          done
          echo "✓ linalg/float_control/validation/web_ext/opentelemetry/wasm_js: check + object + link/import smoke + @test suites passed"

  # ———————————————————————————————————————
  # Cross-compilation target lane
  # Builds and executes native canaries for BOTH the arm64 native lane and the
  # x86-64 cross lane. Every emitted object must be free of trap stubs
  # (disassembled via otool: no ud2 on x86-64, no udf/foreign brk on arm64);
  # the x86 ud2 holes are closed and this gate asserts they stay closed.
  # x86-64 execution uses Rosetta (arch -x86_64) when present, else qemu,
  # else the disassembly/trap-stub gate alone.
  # ———————————————————————————————————————
  cross-compile:
    name: Cross-target canary lanes (arm64 + x86_64)
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Native lane (arm64) — compile, execute, trap-stub gate
        run: |
          bash tests/run_target_lane_canaries.sh ./build/tg build/.cross_lane_arm64 aarch64
      - name: Cross lane (x86_64) — compile, Rosetta/emulator execute, mandatory trap-stub gate
        run: |
          bash tests/run_target_lane_canaries.sh ./build/tg build/.cross_lane_x86_64 x86_64
      - name: Upload cross-lane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-lane-binaries
          path: |
            build/.cross_lane_arm64/
            build/.cross_lane_x86_64/

  # ———————————————————————————————————————
  # CFG cross-target matrix (REQUIRED)
  # The @cfg compile-time elimination pass driven across the explicit
  # target triples (tests/run_cfg_matrix_tests.sh): the linux member
  # kept on x86_64-linux-gnu, the macos member kept on
  # aarch64-apple-darwin, the un-gated cross references REJECTED with
  # the exact unresolved-name diagnostic, and the host-agnostic family
  # canary compiled AND run. All 6 canaries must pass.
  # ———————————————————————————————————————
  cfg-matrix:
    name: CFG Cross-Target Matrix
    needs: bootstrap
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/
      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg
      - name: Run the @cfg cross-target matrix (6 canaries)
        run: |
          bash tests/run_cfg_matrix_tests.sh ./build/tg
          echo "✓ CFG cross-target matrix passed (all 6 canaries)"

  # ———————————————————————————————————————
  # Stdlib E106 migration sweep (REQUIRED)
  # The gate behind docs/current/stdlib_reference.md "E106 migration
  # COMPLETE": every std/*.tg module must (1) pass `tg check` with zero
  # diagnostics and (2) pass the forbidden-syntax grep backstop (refs in
  # type positions outside the __intrinsic_ externs, lifetime tokens,
  # when-in-enum variants, angle-bracket generics, Box[dyn Any]).
  # Mandatory — a module that checks clean through a parsing gap still
  # fails the grep backstop, so the completeness claim cannot drift.
  # ———————————————————————————————————————
  stdlib-e106-sweep:
    name: Stdlib E106 Sweep
    runs-on: macos-14
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/

      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg

      - name: Run stdlib E106 sweep (parse-clean + forbidden-syntax backstop)
        run: |
          bash tests/run_stdlib_e106_sweep.sh ./build/tg
          echo "✓ Stdlib E106 sweep passed (all std/*.tg modules parse clean and pass the forbidden-syntax grep backstop)"

      - name: Upload sweep diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stdlib-e106-sweep-diagnostics
          path: build/.stdlib_e106_sweep/

  # ———————————————————————————————————————
  # Doctests (REQUIRED)
  # The docs/current doctest gate: every fenced Tangerine example in the
  # six doctested documents is canonical-form or carries a verified
  # `compile_fail: <expected diagnostic>` annotation. Runs with the
  # stage3 artifact so the blocks are actually compiled (the structural
  # forbidden-syntax scan is the fallback when no current binary exists).
  # ———————————————————————————————————————
  doctests:
    name: Doctests (docs/current grammar blocks)
    runs-on: macos-14
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Download stage3 artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-stages-macos-arm64
          path: build/

      - name: Materialize tg
        run: |
          cp build/tg_stage3 build/tg
          chmod +x build/tg

      - name: Run the doctest gate
        run: |
          bash scripts/check_doctests.sh ./build/tg
          echo "✓ Every fenced Tangerine example in the doctested documents is canonical-form or a verified compile_fail"

  # ———————————————————————————————————————
  # SAST (CodeQL)
  # ———————————————————————————————————————
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: actions

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  release-freeze:
    name: Release Branch Freeze
    if: startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Enforce permitted path set (fail on unpermitted changes; waivers require a reviewed entry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Bootstrap/test-infrastructure paths permitted on release branches.
          # Everything else fails unless BOTH a tests/release_waivers.json
          # entry and an explicit 'release-waiver:' line in the PR body exist.
          PERMITTED=(
            "run_bootstrap.sh"
            "scripts/bootstrap_helpers.sh"
            "scripts/gen_bootstrap_input.sh"
            "bootstrap/compiler_kernel.manifest"
            "tests/"
            "docs/"
            ".github/workflows/ci.yml"
          )
          BODY="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)"
          HAS_MARKER=0
          if printf '%s' "$BODY" | grep -qE '^release-waiver:'; then
            HAS_MARKER=1
          fi
          CHANGED="$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only 2>/dev/null || true)"
          if [ -z "$CHANGED" ]; then
            echo "::error::release-freeze: could not enumerate changed files for PR $PR_NUMBER"
            exit 1
          fi
          FAILED=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if python3 - "$path" "$HAS_MARKER" "${PERMITTED[@]}" <<'PY'
            import json, sys
            path = sys.argv[1]
            marker = sys.argv[2] == "1"
            permitted = sys.argv[3:]
            if any(path == p or path.startswith(p) for p in permitted):
                sys.exit(0)
            waived = False
            try:
                data = json.load(open("tests/release_waivers.json"))
                waived = path in data.get("waived", {})
            except Exception:
                waived = False
            if waived and marker:
                print(f"::notice::release-freeze: {path} waived by reviewed waiver entry")
                sys.exit(0)
            print(f"::error::release-freeze: {path} is outside the permitted path set; a change requires a tests/release_waivers.json entry AND a 'release-waiver:' line in the PR body")
            sys.exit(1)
            PY
            then
              :
            else
              FAILED=$((FAILED + 1))
            fi
          done <<< "$CHANGED"
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::release-freeze: $FAILED path(s) outside the permitted set (no reviewed waiver)"
            exit 1
          fi
          echo "✓ Release-branch path set enforced: all changed paths permitted or waived"

  # ———————————————————————————————————————
  # Workflow lint
  # ———————————————————————————————————————
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

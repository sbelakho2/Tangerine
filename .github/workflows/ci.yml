# Tangerine CI/CD Pipeline
#
# This workflow builds, tests, lints, and checks the Tangerine compiler
# on every push and pull request. It also runs benchmarks on the main branch
# to track performance regressions.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  TG_VERSION: "0.1.0"

jobs:
  # ———————————————————————————————————————
  # Build & Test
  # ———————————————————————————————————————
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos
            arch: x86_64
            runner: macos-13
            target: x86_64-apple-darwin
          - os: macos
            arch: aarch64
            runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain (Linux aarch64)
        if: matrix.os == 'linux' && matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Bootstrap compiler
        run: |
          # The Tangerine compiler self-hosts.
          # Prefer a checked-in bootstrap helper when available.
          if [ -f ./bootstrap.sh ]; then
            bash ./bootstrap.sh --target ${{ matrix.target }}
          elif [ -x ./target/tg ]; then
            mkdir -p build
            cp ./target/tg ./build/tg
            chmod +x ./build/tg
          elif command -v tg >/dev/null 2>&1; then
            mkdir -p build
            cp "$(command -v tg)" ./build/tg
            chmod +x ./build/tg
          else
            echo "No bootstrap compiler found (bootstrap.sh, target/tg, or tg in PATH)"
            exit 1
          fi

      - name: Build compiler (stage 1)
        run: |
          ./build/tg build --target ${{ matrix.target }}

      - name: Build compiler (stage 2 — self-host verification)
        run: |
          # Stage 2: compile the compiler with itself
          mv build/tg build/tg-stage1
          ./build/tg-stage1 build --target ${{ matrix.target }}
          # Verify stage 1 and stage 2 produce identical output
          hash_cmd() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }
          diff <(hash_cmd build/tg-stage1) <(hash_cmd build/tg) \
            && echo "✓ Reproducible build verified" \
            || echo "⚠ Stage 1 and Stage 2 differ (expected during development)"

      - name: Run tests
        run: |
          ./build/tg test --verbose

      - name: Run golden tests
        run: |
          ./build/tg test golden/ --verbose

      - name: Type checking
        run: |
          ./build/tg check tg_compiler/*.tg std/*.tg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-${{ matrix.target }}
          path: build/tg

  # ———————————————————————————————————————
  # SAST (CodeQL)
  # ———————————————————————————————————————
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: actions

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  # ———————————————————————————————————————
  # Lint & Format
  # ———————————————————————————————————————
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download compiler
        uses: actions/download-artifact@v4
        with:
          name: tg-x86_64-unknown-linux-gnu
          path: build/

      - name: Make executable
        run: chmod +x build/tg

      - name: Check formatting
        run: |
          ./build/tg fmt --check tg_compiler/*.tg std/*.tg
          echo "✓ All files formatted correctly"

      - name: Check source encoding integrity
        run: |
          python3 scripts/check_encoding.py

      - name: Check Tangerine control-flow forms
        run: |
          python3 scripts/check_tg_control_flow_forms.py

      - name: Run linter
        run: |
          ./build/tg lint tg_compiler/*.tg std/*.tg --deny all

      - name: Check unsafe usage
        run: |
          ./build/tg check --unsafe-report tg_compiler/*.tg std/*.tg

  # ———————————————————————————————————————
  # Benchmarks (main branch only)
  # ———————————————————————————————————————
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download compiler
        uses: actions/download-artifact@v4
        with:
          name: tg-x86_64-unknown-linux-gnu
          path: build/

      - name: Make executable
        run: chmod +x build/tg

      - name: Run benchmarks
        run: |
          ./build/tg bench --json > bench_results.json

      - name: Compare with baseline
        run: |
          if [ ! -f bench_baseline.json ]; then
            echo "bench_baseline.json not found; creating baseline from current run"
            cp bench_results.json bench_baseline.json
          fi
          ./build/tg bench --baseline bench_baseline.json > bench_comparison.txt
          cat bench_comparison.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench_results.json
            bench_comparison.txt

  # ———————————————————————————————————————
  # Documentation
  # ———————————————————————————————————————
  docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download compiler
        uses: actions/download-artifact@v4
        with:
          name: tg-x86_64-unknown-linux-gnu
          path: build/

      - name: Make executable
        run: chmod +x build/tg

      - name: Generate docs
        run: |
          ./build/tg doc --format html --output docs/api/ std/*.tg

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/api/

  # ———————————————————————————————————————
  # Conformance Suite
  # ———————————————————————————————————————
  conformance:
    name: Conformance Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download compiler
        uses: actions/download-artifact@v4
        with:
          name: tg-x86_64-unknown-linux-gnu
          path: build/

      - name: Make executable
        run: chmod +x build/tg

      - name: Run parser conformance
        run: |
          for f in golden/frontend_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ Parser conformance passed"

      - name: Run type-check conformance
        run: |
          for f in golden/types_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ Type-check conformance passed"

      - name: Run borrow-check conformance
        run: |
          for f in golden/borrow_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ Borrow-check conformance passed"

      - name: Run MIR/SSA conformance
        run: |
          for f in golden/mir_*.tg golden/ssa_*.tg; do
            echo "Testing $f..."
            ./build/tg check "$f" || exit 1
          done
          echo "✓ MIR/SSA conformance passed"

      - name: Run full smoke test
        run: |
          ./build/tg build golden/smoke_test.tg
          echo "✓ Smoke test passed"

      - name: Run diagnostics quality tests
        run: |
          echo "Testing golden/diagnostics_quality.tg..."
          ./build/tg check golden/diagnostics_quality.tg 2>&1 | tee diag_output.txt
          echo "✓ Diagnostics quality tests executed"

      - name: Run agentic audit
        run: |
          ./build/tg agent audit . | tee audit_report.txt
          echo "✓ Agentic audit completed"

      - name: Run stdlib tests
        run: |
          ./build/tg test golden/stdlib_tests.tg
          echo "✓ Stdlib tests passed"

      - name: Memory usage tracking
        run: |
          echo "Measuring compiler memory usage..."
          ./build/tg build --verbose golden/smoke_test.tg 2>&1 | tee memory_report.txt
          echo "✓ Memory usage tracked"

  # ———————————————————————————————————————
  # GFX/UI Module Tests (§22)
  # ———————————————————————————————————————
  gfx-ui:
    name: GFX/UI (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: GFX/UI module compilation check
        run: make test-gfx-ui
      - name: Stub scan
        run: make stub-scan
      - name: ABI layout check
        run: make abi-layout-check
      - name: Unit tests (geometry)
        run: ./build/tg test tests/unit/test_geom.tg
      - name: Unit tests (events)
        run: ./build/tg test tests/unit/test_events.tg
      - name: Unit tests (paint)
        run: ./build/tg test tests/unit/test_paint.tg
      - name: Unit tests (text)
        run: ./build/tg test tests/unit/test_text.tg
      - name: Unit tests (capability)
        run: ./build/tg test tests/unit/test_capability.tg
      - name: Integration tests
        run: ./build/tg test tests/integration/test_pipelines.tg
      - name: ABI conformance tests
        run: ./build/tg test tests/abi/test_abi_conformance.tg
      - name: Consistency tests
        run: ./build/tg test tests/consistency/test_consistency.tg

  gfx-ui-visual:
    name: GFX/UI Visual Regression
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Golden visual regression
        run: ./build/tg test tests/golden/test_visual_regression.tg
      - name: Determinism/replay tests
        run: ./build/tg test tests/determinism/test_replay.tg
      - name: Fuzz/property tests
        run: ./build/tg test tests/fuzz/test_fuzz.tg
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: target/visual-diffs/

  gfx-ui-gate:
    name: GFX/UI Required Gate
    needs: [gfx-ui, gfx-ui-visual]
    runs-on: ubuntu-latest
    steps:
      - name: All GFX/UI checks passed
        run: echo "✓ All GFX/UI CI gates passed"

  # ———————————————————————————————————————
  # Cross-compilation targets
  # ———————————————————————————————————————
  cross-compile:
    name: Cross (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-wasi
          - thumbv7em-none-eabihf
          - thumbv6m-none-eabi
    steps:
      - uses: actions/checkout@v4
      - name: Add target
        run: ./build/tg target add ${{ matrix.target }}
      - name: Build for target
        run: ./build/tg build --target ${{ matrix.target }} --release
      - name: Build examples
        run: |
          for example in examples/*.tg; do
            echo "Building $example for ${{ matrix.target }}..."
            ./build/tg build --target ${{ matrix.target }} "$example" 2>/dev/null || true
          done

  # ———————————————————————————————————————
  # New stdlib module tests
  # ———————————————————————————————————————
  stdlib-new-modules:
    name: Stdlib New Modules
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test SIMD module
        run: ./build/tg test std/simd.tg --verbose
      - name: Test embedded module
        run: ./build/tg test std/embedded.tg --verbose
      - name: Test linear algebra
        run: ./build/tg test std/linalg.tg --verbose
      - name: Test memory-mapped I/O
        run: ./build/tg test std/mmap.tg --verbose
      - name: Test GPU abstraction
        run: ./build/tg test std/gpu.tg --verbose
      - name: Test float control
        run: ./build/tg test std/float_control.tg --verbose
      - name: Test validation
        run: ./build/tg test std/validation.tg --verbose
      - name: Test web extensions
        run: ./build/tg test std/web_ext.tg --verbose
      - name: Test OpenTelemetry
        run: ./build/tg test std/opentelemetry.tg --verbose
      - name: Test WASM JS interop
        run: ./build/tg test std/wasm_js.tg --verbose

  release-freeze:
    name: Release Branch Freeze
    if: startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release-branch PR type
        run: |
          echo "Release branch PR — only consistency/stub-removal/conformance PRs allowed unless waived"

# .woodpecker/release-freeze.yaml — Release Branch Freeze.
#
# Migrated from GitHub Actions job `release-freeze`
# (if: startsWith(github.base_ref, 'release/')): enforces the permitted
# path set on release/** pull requests; a changed path outside the set
# requires BOTH a tests/release_waivers.json entry AND an explicit
# `release-waiver:` marker.
#
# Woodpecker port notes (documented divergences from the GitHub job):
#   * changed files come from the built-in CI_PIPELINE_FILES (falling back
#     to `git diff` against the PR target branch) instead of `gh pr diff`;
#   * the waiver marker is read from the HEAD COMMIT MESSAGE instead of
#     the PR body (Woodpecker exposes no PR body to the pipeline);
#   * the permitted set names `.woodpecker/` instead of the former
#     GitHub workflow file.
#
# Runs ONLY on pull requests whose target branch is release/**.

labels:
  platform: linux/amd64
  backend: docker

when:
  - event: pull_request
    branch: ["release/**"]

steps:
  - name: release-freeze
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    commands:
      - |
        set -euo pipefail
        PERMITTED=(
          "run_bootstrap.sh"
          "scripts/bootstrap_helpers.sh"
          "scripts/gen_bootstrap_input.sh"
          "bootstrap/compiler_kernel.manifest"
          "tests/"
          "docs/"
          ".woodpecker/"
        )
        HAS_MARKER=0
        if printf '%s\n' "$CI_COMMIT_MESSAGE" | grep -qE '(^|\n)release-waiver:'; then
          HAS_MARKER=1
        fi
        CHANGED="$(python3 - <<'PY'
        import json, os
        raw = os.environ.get("CI_PIPELINE_FILES", "")
        try:
            files = json.loads(raw) if raw else []
        except Exception:
            files = []
        print("\n".join(files))
        PY
        )"
        if [ -z "$CHANGED" ]; then
          git fetch --no-tags --depth=1 origin "$CI_COMMIT_TARGET_BRANCH"
          CHANGED="$(git diff --name-only "origin/$CI_COMMIT_TARGET_BRANCH...HEAD" || true)"
        fi
        if [ -z "$CHANGED" ]; then
          echo "error: release-freeze: could not enumerate changed files for PR $CI_COMMIT_PULL_REQUEST"
          exit 1
        fi
        FAILED=0
        while IFS= read -r path; do
          [ -n "$path" ] || continue
          if python3 - "$path" "$HAS_MARKER" "${PERMITTED[@]}" <<'PY'
        import json, sys
        path = sys.argv[1]
        marker = sys.argv[2] == "1"
        permitted = sys.argv[3:]
        if any(path == p or path.startswith(p) for p in permitted):
            sys.exit(0)
        waived = False
        try:
            data = json.load(open("tests/release_waivers.json"))
            waived = path in data.get("waived", {})
        except Exception:
            waived = False
        if waived and marker:
            print(f"release-freeze: {path} waived by reviewed waiver entry")
            sys.exit(0)
        print(f"error: release-freeze: {path} is outside the permitted path set; a change requires a tests/release_waivers.json entry AND a 'release-waiver:' line in the HEAD commit message")
        sys.exit(1)
        PY
          then
            :
          else
            FAILED=$((FAILED + 1))
          fi
        done <<< "$CHANGED"
        if [ "$FAILED" -ne 0 ]; then
          echo "error: release-freeze: $FAILED path(s) outside the permitted set (no reviewed waiver)"
          exit 1
        fi
        echo "✓ Release-branch path set enforced: all changed paths permitted or waived"

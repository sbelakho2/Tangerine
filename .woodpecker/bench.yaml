# .woodpecker/bench.yaml — Benchmarks (main branch only).
#
# Migrated from GitHub Actions job `bench` (if: github.ref == main):
# the pinned known-good benchmark baseline is fetched from the S3-
# compatible store (no self-baselining — a missing baseline fails the
# lane, exactly like the former `gh release download` failure path).
# Operator: publish `bench_baseline.json` under
#   s3://<bucket>/bench-baseline/<TG_BENCH_BASELINE_TAG>/bench_baseline.json
#
# Darwin/arm64 local-backend agent (macOS/aarch64 stage3 `tg` binary).

labels:
  platform: darwin/arm64
  backend: local

when:
  - event: push
    branch: [main]

steps:
  - name: restore-stage3
    image: bash
    environment: &tg_s3_env
      AWS_ACCESS_KEY_ID:
        from_secret: s3_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: s3_secret_key
      AWS_DEFAULT_REGION: us-east-1
      TG_S3_BUCKET: tangerine-ci
      TG_S3_ENDPOINT: http://127.0.0.1:9000
      TG_BENCH_BASELINE_TAG: tg-bench-baseline-v1
    commands:
      - mkdir -p build
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/tg-stages-macos-arm64" build/ --no-progress

  - name: materialize-tg
    image: bash
    depends_on: [restore-stage3]
    commands:
      - |
        set -euo pipefail
        if [ -f build/tg ]; then
          chmod +x build/tg
        else
          cp build/tg_stage3 build/tg
          chmod +x build/tg
        fi

  - name: bench
    image: bash
    depends_on: [materialize-tg]
    environment: *tg_s3_env
    commands:
      - |
        set -euo pipefail
        rm -f bench_baseline.json
        aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp "s3://$TG_S3_BUCKET/bench-baseline/$TG_BENCH_BASELINE_TAG/bench_baseline.json" bench_baseline.json --no-progress || true
        if [ ! -s bench_baseline.json ]; then
          echo "error: benchmark baseline missing from s3://$TG_S3_BUCKET/bench-baseline/$TG_BENCH_BASELINE_TAG/; absence of a pinned known-good baseline is a CI configuration failure — publish bench_baseline.json before benchmarking"
          exit 1
        fi
        echo "Pinned baseline fetched from s3://$TG_S3_BUCKET/bench-baseline/$TG_BENCH_BASELINE_TAG/"
      - ./build/tg bench --json > bench_results.json
      - |
        set -euo pipefail
        ./build/tg bench --baseline bench_baseline.json > bench_comparison.txt
        cat bench_comparison.txt

  - name: upload-bench-results
    image: bash
    depends_on: [bench]
    environment: *tg_s3_env
    when:
      - event: [push]
        status: [success, failure]
    commands:
      - |
        set -euo pipefail
        for f in bench_results.json bench_comparison.txt; do
          [ -f "$f" ] || continue
          aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp "$f" "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/bench-results/$f" --no-progress
        done

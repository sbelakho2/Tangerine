# .woodpecker/system-intel-native.yaml — system_intel (P0-10) NATIVE
# release-gate lane.
#
# The compiler-consuming sibling of the generic lane
# (`system-intel-generic.yaml`, pure python3 + bash): this lane proves the
# system_intel layer actually consumes the Tangerine compiler's native
# semantic surface through the `tangerine-native` provider
# (system_intel/providers/tangerine_native.py):
#   * the §30 SemanticSnapshot artifact route (compile with
#     TANGERINE_SNAPSHOT), and
#   * the §39 semantic-server session (`tg server --snapshot-only
#     --snapshot=<path>`).
#
# Agent requirements (see docs/current/ci.md):
#   * Darwin/arm64 host agent, LOCAL backend (`build/tg` is a
#     Mach-O/aarch64 binary executed natively — the same agent class as
#     the bootstrap lane):
#       labels: platform=darwin/arm64, backend=local
#   * host `aws` CLI (S3-compatible artifact store access);
#   * host `python3` (system or Homebrew) for the provider layer.
#
# Dependency wiring:
#   * `depends_on: [bootstrap]` (cross-workflow, as in status.yaml): the
#     lane starts only after the bootstrap workflow succeeded, so its
#     published `tg-stages-macos-arm64` artifact is complete;
#   * the restore step consumes that artifact's materialized full driver
#     `build/tg` (published by `run_bootstrap.sh` -> upload-tg-stages); the
#     compiler is NEVER rebuilt here and there is intentionally NO
#     `tg_stage3` fallback (unlike the verify-*.yaml `materialize-tg`):
#     a missing `build/tg` FAILS the lane loudly, it can never skip.
#
# Steps:
#   restore-tg-stages    download the bootstrap artifact into build/
#   materialize-tg       chmod the published full driver; missing -> FAIL
#   system-intel-native  scripts/check_system_intel_native.sh — the
#                        fail-closed native gate (compiler assertion,
#                        provider selection, §30/§39 consumption smoke)
#   job-results + upload-job-results publish the `system-intel-native`
#                        success marker the aggregate gate consumes.

labels:
  platform: darwin/arm64
  backend: local

when:
  - event: push
    branch: [main, dev]
  - event: pull_request
    branch: [main, "release/**"]

depends_on:
  - bootstrap

steps:
  - name: restore-tg-stages
    image: bash
    environment: &tg_s3_env
      AWS_ACCESS_KEY_ID:
        from_secret: s3_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: s3_secret_key
      AWS_DEFAULT_REGION: us-east-1
      TG_S3_BUCKET: tangerine-ci
      TG_S3_ENDPOINT: http://127.0.0.1:9000
    commands:
      - mkdir -p build
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/tg-stages-macos-arm64" build/ --no-progress

  - name: materialize-tg
    image: bash
    depends_on: [restore-tg-stages]
    commands:
      - |
        set -euo pipefail
        if [ -f build/tg ]; then
          chmod +x build/tg
          echo "✓ build/tg restored from the bootstrap tg-stages-macos-arm64 artifact"
        else
          echo "error: materialize-tg: build/tg is missing from the tg-stages-macos-arm64 artifact"
          echo "error: the bootstrap lane did not materialize the full driver — the native system-intel lane"
          echo "error: consumes build/tg only and must not fall back to tg_stage3 (the ladder binary has no"
          echo "error: §30 snapshot route / §39 server); failing closed."
          exit 1
        fi

  - name: system-intel-native
    image: bash
    depends_on: [materialize-tg]
    commands:
      - bash scripts/check_system_intel_native.sh

  - name: job-results
    image: bash
    depends_on: [system-intel-native]
    commands:
      - mkdir -p build/.ci_results
      - printf 'success\n' > build/.ci_results/system-intel-native

  - name: upload-job-results
    image: bash
    depends_on: [job-results]
    environment: *tg_s3_env
    commands:
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive build/.ci_results "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/ci-results" --no-progress

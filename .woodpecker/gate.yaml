# .woodpecker/gate.yaml — Release gate (aggregate of every required lane).
#
# The Woodpecker port of the GitHub `release-gate` job: the ONE aggregate
# check for ordinary merges. It depends on EVERY workflow that carries a
# release-required step, and it runs on success AND failure
# (`when: status: [success, failure]`) so the failure report is always
# produced.
#
# The gate step re-derives the ACTUAL per-lane conclusions from the
# `ci-results/` success markers published by each workflow (the
# Woodpecker replacement for GitHub's toJSON(needs): a marker exists only
# when the lane's step actually succeeded). Any required lane without a
# marker FAILS the gate and is reported by name. The exact set equality
# between `.woodpecker/release_required_jobs.txt` and these dependencies
# is machine-verified by scripts/check_ci_required_jobs.sh in the
# evidence-gate workflow.
#
# Linux/amd64 container lane.

labels:
  platform: linux/amd64
  backend: docker

when:
  - event: [push]
    branch: [main, dev]
    status: [success, failure]
  - event: [pull_request]
    branch: [main, "release/**"]
    status: [success, failure]

depends_on:
  - bootstrap
  - verify-core
  - verify-stdlib
  - verify-gfx
  - verify-cross
  - evidence-gate
  - release-proof
  - workflow-lint

steps:
  - name: release-gate
    image: amazon/aws-cli:2.36.44
    entrypoint: ["/bin/bash", "-c"]
    environment: &tg_s3_env
      AWS_ACCESS_KEY_ID:
        from_secret: s3_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: s3_secret_key
      AWS_DEFAULT_REGION: us-east-1
      TG_S3_BUCKET: tangerine-ci
      TG_S3_ENDPOINT: http://127.0.0.1:9000
    when:
      - event: [push]
        status: [success, failure]
      - event: [pull_request]
        status: [success, failure]
    commands:
      - |
        set -euo pipefail
        aws configure set default.s3.addressing_style path
        mkdir -p build/.ci_results
        aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/ci-results" build/.ci_results --no-progress || true
        missing=""
        total=0
        while IFS= read -r job || [ -n "$job" ]; do
          case "$job" in
            ""|\#*) continue ;;
          esac
          total=$((total + 1))
          if [ ! -f "build/.ci_results/$job" ]; then
            missing="$missing $job"
          fi
        done < .woodpecker/release_required_jobs.txt
        if [ -n "$missing" ]; then
          echo "error: release-gate FAILED: required job(s) without a success result:$missing"
          echo "error: see the pipeline view: $CI_PIPELINE_URL"
          exit 1
        fi
        echo "release-gate OK: all $total required dependencies succeeded"

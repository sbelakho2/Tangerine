# .woodpecker/verify-cross.yaml — cross-target canary lanes (arm64 + x86_64).
#
# Migrated from GitHub Actions job `cross-compile`:
#   native arm64 lane + x86-64 cross lane (Rosetta `arch -x86_64` when
#   present, else qemu, else the disassembly/trap-stub gate alone). The
#   trap-stub gate uses `otool`/`nm` on Darwin objects — hence the
#   Darwin/arm64 local-backend agent (no Linux container can run otool).
#
# Uploads the emitted binaries under `cross-lane-binaries/` so the status
# workflow can hash them into the release evidence (artifact name matches
# the former GitHub artifact).

labels:
  platform: darwin/arm64
  backend: local

concurrency: 1

when:
  - event: push
    branch: [main, dev]
  - event: pull_request
    branch: [main, "release/**"]

steps:
  - name: restore-stage3
    image: bash
    environment: &tg_s3_env
      AWS_ACCESS_KEY_ID:
        from_secret: s3_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: s3_secret_key
      AWS_DEFAULT_REGION: us-east-1
      TG_S3_BUCKET: tangerine-ci
      TG_S3_ENDPOINT: http://127.0.0.1:9000
    commands:
      - mkdir -p build
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/tg-stages-macos-arm64" build/ --no-progress

  - name: materialize-tg
    image: bash
    depends_on: [restore-stage3]
    commands:
      - |
        set -euo pipefail
        if [ -f build/tg ]; then
          chmod +x build/tg
        else
          cp build/tg_stage3 build/tg
          chmod +x build/tg
        fi

  - name: cross-compile
    image: bash
    depends_on: [materialize-tg]
    commands:
      - bash tests/run_target_lane_canaries.sh ./build/tg build/.cross_lane_arm64 aarch64
      - bash tests/run_target_lane_canaries.sh ./build/tg build/.cross_lane_x86_64 x86_64

  - name: upload-cross-lane-arm64
    image: bash
    depends_on: [cross-compile]
    environment: *tg_s3_env
    when:
      - event: [push, pull_request]
        status: [success, failure]
    commands:
      - '[ -d build/.cross_lane_arm64 ] && aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive build/.cross_lane_arm64 "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/cross-lane-binaries/.cross_lane_arm64" --no-progress || true'

  - name: upload-cross-lane-x86-64
    image: bash
    depends_on: [cross-compile]
    environment: *tg_s3_env
    when:
      - event: [push, pull_request]
        status: [success, failure]
    commands:
      - '[ -d build/.cross_lane_x86_64 ] && aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive build/.cross_lane_x86_64 "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/cross-lane-binaries/.cross_lane_x86_64" --no-progress || true'

  - name: job-results
    image: bash
    depends_on: [cross-compile]
    commands:
      - mkdir -p build/.ci_results
      - printf 'success\n' > build/.ci_results/cross-compile

  - name: upload-job-results
    image: bash
    depends_on: [job-results]
    environment: *tg_s3_env
    commands:
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive build/.ci_results "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/ci-results" --no-progress

# .woodpecker/workflow-lint.yaml — Workflow lint.
#
# Migrated from GitHub Actions job `workflow-lint` (actionlint -> the
# Woodpecker linter). Runs `woodpecker-cli lint` over every
# `.woodpecker/*.yaml` workflow with the pinned CLI image, then publishes
# the `workflow-lint` success marker for the release gate.
#
# Linux/amd64 container lane.

labels:
  platform: linux/amd64
  backend: docker

when:
  - event: push
    branch: [main, dev]
  - event: pull_request
    branch: [main, "release/**"]

steps:
  - name: workflow-lint
    image: woodpeckerci/woodpecker-cli:v3.18.1
    commands:
      - |
        set -e
        for f in .woodpecker/*.yaml .woodpecker/*.yml; do
          [ -f "$f" ] || continue
          echo "linting $f"
          woodpecker-cli lint "$f"
        done
        echo "✓ all Woodpecker workflow files lint clean"

  - name: job-results
    image: python:3.12-bookworm
    depends_on: [workflow-lint]
    commands:
      - mkdir -p build/.ci_results
      - printf 'success\n' > build/.ci_results/workflow-lint

  - name: upload-job-results
    image: amazon/aws-cli:2.36.44
    depends_on: [job-results]
    environment: &tg_s3_env
      AWS_ACCESS_KEY_ID:
        from_secret: s3_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: s3_secret_key
      AWS_DEFAULT_REGION: us-east-1
      TG_S3_BUCKET: tangerine-ci
      TG_S3_ENDPOINT: http://127.0.0.1:9000
    commands:
      - aws configure set default.s3.addressing_style path
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive build/.ci_results "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/ci-results" --no-progress

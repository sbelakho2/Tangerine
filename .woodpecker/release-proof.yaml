# .woodpecker/release-proof.yaml — TANGERINE RELEASE PROOF from the tested SHA.
#
# Migrated from GitHub Actions job `release-proof` (needs: [status],
# if: always()): it runs even when the status workflow failed/was skipped
# (the `optional: true` dependency + the success/failure status filter),
# downloads the status snapshot when present, and runs
# scripts/gen_release_proof.sh --gate — a RELEASE_100 = FALSE verdict
# FAILS this workflow. This workflow IS a release-gate dependency.
#
# Linux/amd64 container lane (shell + python3; no compiler execution).

labels:
  platform: linux/amd64
  backend: docker

when:
  - event: [push]
    branch: [main, dev]
    status: [success, failure]
  - event: [pull_request]
    branch: [main, "release/**"]
    status: [success, failure]

depends_on:
  - name: status
    optional: true

steps:
  - name: restore-status-snapshot
    image: amazon/aws-cli:2.36.44
    entrypoint: ["/bin/bash", "-c"]
    environment: &tg_s3_env
      AWS_ACCESS_KEY_ID:
        from_secret: s3_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: s3_secret_key
      AWS_DEFAULT_REGION: us-east-1
      TG_S3_BUCKET: tangerine-ci
      TG_S3_ENDPOINT: http://127.0.0.1:9000
    commands:
      - |
        set -euo pipefail
        aws configure set default.s3.addressing_style path
        mkdir -p build/.status_snapshot
        aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/status-snapshot-$CI_COMMIT_SHA" build/.status_snapshot/ --no-progress || true
        if [ -f build/.status_snapshot/release_evidence.json ]; then
          echo "release evidence present (the status workflow passed its release gates)"
        else
          echo "no release evidence snapshot (the release gates blocked status); the proof will stay PENDING-UNTIL-LADDER"
        fi

  - name: release-proof
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [restore-status-snapshot]
    commands:
      - |
        set -euo pipefail
        if [ -f build/.status_snapshot/release_evidence.json ]; then
          cp build/.status_snapshot/release_evidence.json build/release_evidence.json
        fi
        bash scripts/gen_release_proof.sh --sha "$CI_COMMIT_SHA" --gate build/release_proof.md
        echo "---"
        cat build/release_proof.md

  - name: job-results
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [release-proof]
    commands:
      - mkdir -p build/.ci_results
      - printf 'success\n' > build/.ci_results/release-proof

  - name: upload-job-results
    image: amazon/aws-cli:2.36.44
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [job-results]
    environment: *tg_s3_env
    commands:
      - aws configure set default.s3.addressing_style path
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive build/.ci_results "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/ci-results" --no-progress

  - name: upload-release-proof
    image: amazon/aws-cli:2.36.44
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [release-proof]
    environment: *tg_s3_env
    when:
      - event: [push]
        status: [success, failure]
      - event: [pull_request]
        status: [success, failure]
    commands:
      - |
        set -euo pipefail
        aws configure set default.s3.addressing_style path
        aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp build/release_proof.md "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/release-proof-$CI_COMMIT_SHA/release_proof.md" --no-progress

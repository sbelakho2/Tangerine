# .woodpecker/evidence-gate.yaml — Evidence gate (generate-then-diff).
#
# Migrated from GitHub Actions job `evidence-gate` (ubuntu-latest; pure
# shell + python3, no bootstrap artifact):
#   * regenerate the canary manifests' self-description + `git diff`;
#   * regenerate the feature registry (features.toml -> registry) + diff;
#   * regenerate the five normative schema docs + diff;
#   * machine-verify the RELEASE-REQUIRED JOBS set against the Woodpecker
#     aggregate (scripts/check_ci_required_jobs.sh — the item-35 port:
#     `.woodpecker/release_required_jobs.txt` == the step names, and the
#     workflows containing them == `.woodpecker/gate.yaml` depends_on);
#   * run the structural doctest coverage gate;
#   * run the release-evidence schema tests (the P0 fail-closed contract).
#
# Linux/amd64 container lane. It also publishes the `evidence-gate`
# success marker for the status/gate workflows.

labels:
  platform: linux/amd64
  backend: docker

when:
  - event: push
    branch: [main, dev]
  - event: pull_request
    branch: [main, "release/**"]

steps:
  - name: prepare
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends perl ca-certificates
        git --version
        python3 --version
        shasum --version

  - name: regenerate-canary-manifests
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [prepare]
    commands:
      - |
        set -euo pipefail
        bash ./scripts/gen_status.sh --refresh-manifests
        git diff --exit-code -- tests/canary/MANIFEST tests/canary_neg/MANIFEST tests/arm64/MANIFEST
        echo "✓ Canary manifests are current (a stale committed count cannot merge)"

  - name: regenerate-feature-registry
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [prepare]
    commands:
      - |
        set -euo pipefail
        bash ./scripts/gen_feature_registry.sh
        git diff --exit-code -- features.toml docs/current/feature_registry.md
        echo "✓ The feature registry is current (generated evidence; a drifted registry cannot merge)"

  - name: regenerate-normative-spec-docs
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [prepare]
    commands:
      - |
        set -euo pipefail
        bash ./scripts/gen_spec_docs.sh
        git diff --exit-code -- \
          docs/current/language_spec.toml docs/current/language_spec.md \
          docs/current/target_capabilities.toml docs/current/target_capabilities.md \
          docs/current/abi_schema.toml docs/current/abi_layout.md \
          docs/current/stabilized_layout_tables.md \
          docs/current/compiler_pipeline.toml docs/current/pipeline_stages.md \
          docs/current/stdlib_contracts.toml docs/current/stdlib_completeness.md \
          docs/current/test_requirements.md
        echo "✓ The normative spec docs are current (generated evidence; a stale hand-edited doc cannot merge)"

  - name: verify-release-required-jobs
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [prepare]
    commands:
      - |
        set -euo pipefail
        bash ./scripts/check_ci_required_jobs.sh
        echo "✓ The RELEASE-REQUIRED JOBS set (.woodpecker/release_required_jobs.txt) equals the step names exactly and the workflows containing them equal .woodpecker/gate.yaml depends_on — no subset tests (no admin bypass for ordinary merges)"

  - name: structural-doctest-coverage-gate
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [prepare]
    commands:
      - |
        set -euo pipefail
        bash ./scripts/check_doctests.sh
        echo "✓ Every docs/current document is doctested or documented-excluded (history never scanned)"

  - name: release-evidence-schema-tests
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [prepare]
    commands:
      - |
        set -euo pipefail
        bash tests/run_release_evidence_schema_tests.sh
        echo "✓ The release-evidence schema tests passed (missing artifact / wrong hash / failed job / extra artifact fail; a complete valid evidence set passes)"

  - name: evidence-gate
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [regenerate-canary-manifests, regenerate-feature-registry, regenerate-normative-spec-docs, verify-release-required-jobs, structural-doctest-coverage-gate, release-evidence-schema-tests]
    commands:
      - echo "✓ Evidence gate passed (generate-then-diff — manifests, feature registry, normative spec docs, release-required jobs, doctest coverage, release-evidence schema)"

  - name: job-results
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [evidence-gate]
    commands:
      - mkdir -p build/.ci_results
      - printf 'success\n' > build/.ci_results/evidence-gate

  - name: upload-job-results
    image: amazon/aws-cli:2.36.44
    depends_on: [job-results]
    environment: &tg_s3_env
      AWS_ACCESS_KEY_ID:
        from_secret: s3_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: s3_secret_key
      AWS_DEFAULT_REGION: us-east-1
      TG_S3_BUCKET: tangerine-ci
      TG_S3_ENDPOINT: http://127.0.0.1:9000
    commands:
      - aws configure set default.s3.addressing_style path
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive build/.ci_results "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/ci-results" --no-progress

# .woodpecker/system-intel-generic.yaml — system_intel (P0-10) GENERIC
# release-gate lane (renamed from `system-intel.yaml`; the generic /
# native split mirrors the two provider routes).
#
# The subsystem gate for `system_intel` (INTERFACES.md §7): the 36-test
# suite plus its CLI smoke and the protocol regression had no CI lane at
# all; the release-required step set now carries the two step names below,
# so a system_intel regression blocks the aggregate `gate.yaml` exactly
# like any other release lane. The native sibling lane
# (`system-intel-native.yaml`) carries the build/tg-consuming smoke; this
# lane stays compiler-free.
#
# Pure python3 + bash: this lane MUST NOT depend on the compiler toolchain
# (no stage3 `tg`, no bootstrap artifact), so it runs on the cheapest
# correct agent — the linux/amd64 container lane used by the other
# pure-script workflows (evidence-gate, workflow-lint). No S3 restore is
# needed for checkout; the S3 anchor appears only on the job-results
# upload step, which publishes the `system-intel-test` /
# `system-intel-gate` success markers the aggregate gate consumes.
#
# The step names (`system-intel-test`, `system-intel-gate`) are unchanged:
# they are the release-required jobs listed in release_required_jobs.txt
# and the `make system-intel-test` / `make system-intel-gate` entry points.
#
# Steps (each named after the release-required job it publishes):
#   system-intel-test  unittest discover + CLI smoke (Makefile target)
#   system-intel-gate  scripts/check_system_intel_gate.sh — the full gate
#                      (suite + CLI smoke + protocol regression + the
#                      core v2 suite once the parallel workstream lands)

labels:
  platform: linux/amd64
  backend: docker

when:
  - event: push
    branch: [main, dev]
  - event: pull_request
    branch: [main, "release/**"]

steps:
  - name: system-intel-test
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    commands:
      - make system-intel-test

  - name: system-intel-gate
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [system-intel-test]
    commands:
      - bash scripts/check_system_intel_gate.sh

  - name: job-results
    image: python:3.12-bookworm
    entrypoint: ["/bin/bash", "-c"]
    depends_on: [system-intel-gate]
    commands:
      - |
        set -euo pipefail
        mkdir -p build/.ci_results
        for j in system-intel-test system-intel-gate; do
          printf 'success\n' > "build/.ci_results/$j"
        done

  - name: upload-job-results
    image: amazon/aws-cli:2.36.44
    depends_on: [job-results]
    environment: &tg_s3_env
      AWS_ACCESS_KEY_ID:
        from_secret: s3_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: s3_secret_key
      AWS_DEFAULT_REGION: us-east-1
      TG_S3_BUCKET: tangerine-ci
      TG_S3_ENDPOINT: http://127.0.0.1:9000
    commands:
      - aws configure set default.s3.addressing_style path
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive build/.ci_results "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/ci-results" --no-progress

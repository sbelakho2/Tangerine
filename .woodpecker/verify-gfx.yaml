# .woodpecker/verify-gfx.yaml — GFX/UI module + visual-regression lanes.
#
# Migrated from GitHub Actions jobs (each is a STEP named after the job):
#   gfx-ui (module compilation, stub scan, ABI layout, unit/integration/
#           ABI/consistency checks),
#   gfx-ui-visual (golden visual regression, determinism/replay, fuzz),
#   gfx-ui-gate (the trivial aggregate — kept as the final step).
#
# Darwin/arm64 local-backend agent (macOS/aarch64 stage3 `tg` binary).
# The Makefile targets this lane invokes (`test-gfx-ui`, `stub-scan`,
# `abi-layout-check`, plus `gfx-ui-test` / `gfx-ui-visual`) are defined in
# the root Makefile and backed by the real `tg check` / `tg test` commands
# over the GFX/UI modules and suites.

labels:
  platform: darwin/arm64
  backend: local

concurrency: 1

when:
  - event: push
    branch: [main, dev]
  - event: pull_request
    branch: [main, "release/**"]

steps:
  - name: restore-stage3
    image: bash
    environment: &tg_s3_env
      AWS_ACCESS_KEY_ID:
        from_secret: s3_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: s3_secret_key
      AWS_DEFAULT_REGION: us-east-1
      TG_S3_BUCKET: tangerine-ci
      TG_S3_ENDPOINT: http://127.0.0.1:9000
    commands:
      - mkdir -p build
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/tg-stages-macos-arm64" build/ --no-progress

  - name: materialize-tg
    image: bash
    depends_on: [restore-stage3]
    commands:
      - |
        set -euo pipefail
        if [ -f build/tg ]; then
          chmod +x build/tg
        else
          cp build/tg_stage3 build/tg
          chmod +x build/tg
        fi

  - name: gfx-ui
    image: bash
    depends_on: [materialize-tg]
    commands:
      - make test-gfx-ui
      - make stub-scan
      - make abi-layout-check
      - make gfx-ui-test

  - name: gfx-ui-visual
    image: bash
    depends_on: [materialize-tg]
    commands:
      - make gfx-ui-visual

  - name: upload-visual-diffs
    image: bash
    depends_on: [gfx-ui-visual]
    environment: *tg_s3_env
    when:
      - event: [push, pull_request]
        status: [failure]
    commands:
      - '[ -d target/visual-diffs ] && aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive target/visual-diffs "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/visual-diffs" --no-progress || true'

  - name: gfx-ui-gate
    image: bash
    depends_on: [gfx-ui, gfx-ui-visual]
    commands:
      - echo "✓ All GFX/UI CI gates passed"

  - name: job-results
    image: bash
    depends_on: [gfx-ui, gfx-ui-visual]
    commands:
      - mkdir -p build/.ci_results
      - printf 'success\n' > build/.ci_results/gfx-ui
      - printf 'success\n' > build/.ci_results/gfx-ui-visual

  - name: upload-job-results
    image: bash
    depends_on: [job-results]
    environment: *tg_s3_env
    commands:
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive build/.ci_results "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/ci-results" --no-progress

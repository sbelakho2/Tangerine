# .woodpecker/docs.yaml — Generate Documentation (main branch only).
#
# Migrated from GitHub Actions job `docs` (if: github.ref == main):
#   `tg doc --format html --output docs/api/ std/*.tg` + deployment.
# GitHub Pages (peaceiris/actions-gh-pages) has no Woodpecker equivalent:
# the docs are force-pushed to a static-pages branch served by the
# self-hosted forge (Gitea/Forgejo Pages or any branch-based Pages host).
# Operator: create the branch (default `pages`), enable it in the forge's
# Pages settings, and provide the `docs_publish_token` secret (write
# access to the repository).
#
# Darwin/arm64 local-backend agent (macOS/aarch64 stage3 `tg` binary).

labels:
  platform: darwin/arm64
  backend: local

when:
  - event: push
    branch: [main]

steps:
  - name: restore-stage3
    image: bash
    environment: &tg_s3_env
      AWS_ACCESS_KEY_ID:
        from_secret: s3_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: s3_secret_key
      AWS_DEFAULT_REGION: us-east-1
      TG_S3_BUCKET: tangerine-ci
      TG_S3_ENDPOINT: http://127.0.0.1:9000
    commands:
      - mkdir -p build
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/tg-stages-macos-arm64" build/ --no-progress

  - name: materialize-tg
    image: bash
    depends_on: [restore-stage3]
    commands:
      - |
        set -euo pipefail
        if [ -f build/tg ]; then
          chmod +x build/tg
        else
          cp build/tg_stage3 build/tg
          chmod +x build/tg
        fi

  - name: docs
    image: bash
    depends_on: [materialize-tg]
    commands:
      - ./build/tg doc --format html --output docs/api/ std/*.tg

  - name: docs-publish
    image: bash
    depends_on: [docs]
    environment:
      TG_DOCS_BRANCH: pages
      TG_PAGES_TOKEN:
        from_secret: docs_publish_token
    commands:
      - |
        set -euo pipefail
        if [ -z "${TG_PAGES_TOKEN:-}" ]; then
          echo "operator: the docs_publish_token secret is not set (docs branch publish skipped)"
          exit 1
        fi
        git config user.email "woodpecker@tangerine.invalid"
        git config user.name "Tangerine CI"
        git checkout -B "$TG_DOCS_BRANCH"
        git add -f docs/api
        git commit -m "docs: publish API docs for $CI_COMMIT_SHA"
        PUSH_URL="$(printf '%s' "$CI_REPO_CLONE_URL" | sed "s#://#://oauth2:$TG_PAGES_TOKEN@#")"
        git push --force "$PUSH_URL" "HEAD:$TG_DOCS_BRANCH"
        echo "✓ docs published to the $TG_DOCS_BRANCH branch of $CI_REPO"

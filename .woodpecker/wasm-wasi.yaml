# .woodpecker/wasm-wasi.yaml — wasm / WASI conformance lane (opt-in).
#
# ADDITION (documented): the former GitHub Actions workflow did NOT wire
# tests/run_wasm_conformance.sh or tests/run_wasi_conformance.sh — the
# scripts existed but no job invoked them. This manual workflow makes the
# existing lanes runnable on Woodpecker without changing the gate: it only
# runs on a manual trigger, it is NOT a dependency of `.woodpecker/gate.yaml`
# and NOT in `.woodpecker/release_required_jobs.txt`.
#
# The lanes are structural (section/import validation through the stage3
# compiler); the wasmtime execution sub-lane is reported as skipped unless
# `wasmtime` is on the agent host (install it with `brew install wasmtime`).
#
# Darwin/arm64 local-backend agent (macOS/aarch64 stage3 `tg` binary).

labels:
  platform: darwin/arm64
  backend: local

when:
  - event: [manual]

depends_on:
  - bootstrap

steps:
  - name: restore-stage3
    image: bash
    environment: &tg_s3_env
      AWS_ACCESS_KEY_ID:
        from_secret: s3_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: s3_secret_key
      AWS_DEFAULT_REGION: us-east-1
      TG_S3_BUCKET: tangerine-ci
      TG_S3_ENDPOINT: http://127.0.0.1:9000
    commands:
      - mkdir -p build
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/tg-stages-macos-arm64" build/ --no-progress

  - name: materialize-tg
    image: bash
    depends_on: [restore-stage3]
    commands:
      - |
        set -euo pipefail
        if [ -f build/tg ]; then
          chmod +x build/tg
        else
          cp build/tg_stage3 build/tg
          chmod +x build/tg
        fi

  - name: wasm-conformance
    image: bash
    depends_on: [materialize-tg]
    commands:
      - bash tests/run_wasm_conformance.sh ./build/tg build/.wasm_conformance

  - name: wasi-conformance
    image: bash
    depends_on: [materialize-tg]
    commands:
      - bash tests/run_wasi_conformance.sh ./build/tg build/.wasi_conformance

  - name: upload-wasm-wasi-artifacts
    image: bash
    depends_on: [wasm-conformance, wasi-conformance]
    environment: *tg_s3_env
    when:
      - event: [manual]
        status: [success, failure]
    commands:
      - |
        set -euo pipefail
        for d in build/.wasm_conformance build/.wasi_conformance; do
          [ -d "$d" ] || continue
          name="$(basename "$d")"
          aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp --recursive "$d" "s3://$TG_S3_BUCKET/$CI_REPO/$CI_PIPELINE_NUMBER/$name" --no-progress
        done

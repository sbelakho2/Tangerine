# .woodpecker/ocaml-seed-health.yaml — OCaml seed DEVELOPMENT HEALTH.
#
# Migrated from GitHub Actions job `ocaml-seed-health` (NON-BLOCKING by
# design: this workflow is NOT a dependency of `.woodpecker/gate.yaml` and
# is NOT in `.woodpecker/release_required_jobs.txt`).
#
# Runs scripts/check_ocaml_seed_health.sh with the pinned toolchain from
# bootstrap/ocaml-toolchain.lock (OCaml 5.4.0 / Dune 3.21.1 / arm64):
#   dune build + the exact 230-test inventory + every selfcheck executable
#   + the tg_bootstrap_gate NO-REGRESSION debt gate.
#
# Agent: Darwin/arm64 local backend (the lock pins arm64), host opam with
# the 5.4.0 switch, host `aws` CLI for the opam/dune cache.

labels:
  platform: darwin/arm64
  backend: local

concurrency:
  limit: 1
  group: tg-opam

when:
  - event: push
    branch: [main, dev]
  - event: pull_request
    branch: [main, "release/**"]

steps:
  - name: cache-restore
    image: bash
    failure: ignore
    environment: &tg_s3_env
      AWS_ACCESS_KEY_ID:
        from_secret: s3_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: s3_secret_key
      AWS_DEFAULT_REGION: us-east-1
      TG_S3_BUCKET: tangerine-ci
      TG_S3_ENDPOINT: http://127.0.0.1:9000
    commands:
      - mkdir -p "$HOME/.opam/download-cache" "$HOME/.cache/dune"
      - LOCK_SHA="$(shasum -a 256 bootstrap/ocaml-toolchain.lock | cut -d' ' -f1)"
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp "s3://$TG_S3_BUCKET/$CI_REPO/cache/opam-dune-$LOCK_SHA.tar.gz" /tmp/opam-dune-cache.tar.gz --no-progress || true
      - tar -xzf /tmp/opam-dune-cache.tar.gz -C "$HOME" 2>/dev/null || true

  - name: ocaml-seed-health
    image: bash
    depends_on: [cache-restore]
    commands:
      - |
        set -euo pipefail
        command -v opam >/dev/null 2>&1 || { echo "operator: opam is not on PATH (see docs/current/ci.md)"; exit 1; }
        if ! opam switch list --short 2>/dev/null | grep -qx "5.4.0"; then
          echo "operator: create the pinned switch once with: opam switch create 5.4.0 ocaml-base-compiler.5.4.0"
          exit 1
        fi
        eval "$(opam env --switch=5.4.0 --set-switch)"
        opam install -y dune.3.21.1
        bash scripts/check_ocaml_seed_health.sh

  - name: hostptr-fast-lane
    image: bash
    depends_on: [ocaml-seed-health]
    commands:
      - |
        set -euo pipefail
        # The address_of/address_of_mut host-pointer boundary micro-repro
        # (bootstrap/addrprobe_mini.manifest + selfcheck/addrprobe.tg):
        # measured ~1 s on the Darwin/arm64 host.  The aggregate
        # ocaml-seed-health step already runs it through the enumerated
        # selfcheck lane; this explicit step gives the fast
        # host-boundary regression its own attribution and timing.
        eval "$(opam env --switch=5.4.0 --set-switch)"
        cd stage0_ocaml
        dune build selfcheck/tg_hostptr.exe
        start=$SECONDS
        _build/default/selfcheck/tg_hostptr.exe ..
        echo "tg_hostptr fast lane: $((SECONDS - start)) s (exit 0 = address_of_mut crossed the host boundary with copy-out)"

  - name: spawn-fast-lane
    image: bash
    depends_on: [hostptr-fast-lane]
    commands:
      - |
        set -euo pipefail
        # The seed VM child-process boundary micro-repro
        # (bootstrap/spawnprobe_mini.manifest + selfcheck/spawnprobe.tg):
        # fork/execvp/pipe/poll/read/waitpid through the REAL
        # std::process::run_command, plus the raw c_fork/_exit(23) status
        # channel.  This is the lane that reproduces the kernel-native
        # `codesign failed: ` empty-detail class (the argv `Vec[Ptr[u8]]`
        # as_ptr materialization and the stderr/status capture).
        # Measured ~1.4 s on the Darwin/arm64 host.
        eval "$(opam env --switch=5.4.0 --set-switch)"
        cd stage0_ocaml
        dune build selfcheck/tg_spawnprobe.exe
        start=$SECONDS
        _build/default/selfcheck/tg_spawnprobe.exe ..
        echo "tg_spawnprobe fast lane: $((SECONDS - start)) s (exit 0 = echo/sh-stderr/codesign-stderr all crossed the VM process boundary)"

  - name: kernel-native-link-lane
    image: bash
    depends_on: [spawn-fast-lane]
    commands:
      - |
        set -euo pipefail
        # The kernel-native compile-to-executable lane
        # (bootstrap/linkprobe_mini.manifest + selfcheck/linkprobe.tg):
        #   --mode linkobj : the probe builds a minimal aarch64 object in
        #                    the VM and runs the REAL link_executable path
        #                    (Mach-O emission, validation, output.tmp,
        #                    chmod, codesign -s -, codesign --verify,
        #                    rename).  The cold run builds the prepared-VM
        #                    program cache (build/linkprobe.vmcache); warm
        #                    runs execute ONLY the VM stage (measured
        #                    ~1 s).  This is the CI-gated fast lane.
        #   --mode full    : the REAL kernel compile entry
        #                    (compile_startup_entry -> generate_executable)
        #                    over a tiny embedded source.  The seed VM's
        #                    copy-on-push Array model makes the kernel's
        #                    byte-at-a-time Mach-O emission quadratic
        #                    (minutes-scale), so the full mode is OPT-IN
        #                    here (TG_LINKPROBE_FULL=1) — the aggregate
        #                    bootstrap-check step already runs the same
        #                    path over the corpus and gates on its
        #                    artifact.
        eval "$(opam env --switch=5.4.0 --set-switch)"
        cd stage0_ocaml
        dune build selfcheck/tg_linkprobe.exe
        start=$SECONDS
        _build/default/selfcheck/tg_linkprobe.exe .. --mode linkobj
        echo "tg_linkprobe linkobj lane: $((SECONDS - start)) s"
        if [ "${TG_LINKPROBE_FULL:-0}" = "1" ]; then
          start=$SECONDS
          _build/default/selfcheck/tg_linkprobe.exe .. --mode full
          echo "tg_linkprobe full lane (warm cache): $((SECONDS - start)) s"
        else
          echo "tg_linkprobe full lane: skipped (set TG_LINKPROBE_FULL=1 to run the minutes-scale end-to-end compile)"
        fi

  - name: full-completeness-report
    image: bash
    depends_on: [ocaml-seed-health]
    failure: ignore
    commands:
      - cat /tmp/ocaml_full_completeness_verdict.txt

  - name: cache-save
    image: bash
    depends_on: [ocaml-seed-health]
    failure: ignore
    environment: *tg_s3_env
    commands:
      - |
        set -euo pipefail
        LOCK_SHA="$(shasum -a 256 bootstrap/ocaml-toolchain.lock | cut -d' ' -f1)"
        tar -czf /tmp/opam-dune-cache.tar.gz -C "$HOME" .opam/download-cache .cache/dune 2>/dev/null || true
        if [ -s /tmp/opam-dune-cache.tar.gz ]; then
          aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp /tmp/opam-dune-cache.tar.gz "s3://$TG_S3_BUCKET/$CI_REPO/cache/opam-dune-$LOCK_SHA.tar.gz" --no-progress
        fi

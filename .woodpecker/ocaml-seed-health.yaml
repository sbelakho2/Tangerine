# .woodpecker/ocaml-seed-health.yaml — OCaml seed DEVELOPMENT HEALTH.
#
# Migrated from GitHub Actions job `ocaml-seed-health` (NON-BLOCKING by
# design: this workflow is NOT a dependency of `.woodpecker/gate.yaml` and
# is NOT in `.woodpecker/release_required_jobs.txt`).
#
# Runs scripts/check_ocaml_seed_health.sh with the pinned toolchain from
# bootstrap/ocaml-toolchain.lock (OCaml 5.4.0 / Dune 3.21.1 / arm64):
#   dune build + the exact 230-test inventory + every selfcheck executable
#   + the tg_bootstrap_gate NO-REGRESSION debt gate.
#
# Agent: Darwin/arm64 local backend (the lock pins arm64), host opam with
# the 5.4.0 switch, host `aws` CLI for the opam/dune cache.

labels:
  platform: darwin/arm64
  backend: local

concurrency:
  limit: 1
  group: tg-opam

when:
  - event: push
    branch: [main, dev]
  - event: pull_request
    branch: [main, "release/**"]

steps:
  - name: cache-restore
    image: bash
    failure: ignore
    environment: &tg_s3_env
      AWS_ACCESS_KEY_ID:
        from_secret: s3_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: s3_secret_key
      AWS_DEFAULT_REGION: us-east-1
      TG_S3_BUCKET: tangerine-ci
      TG_S3_ENDPOINT: http://127.0.0.1:9000
    commands:
      - mkdir -p "$HOME/.opam/download-cache" "$HOME/.cache/dune"
      - LOCK_SHA="$(shasum -a 256 bootstrap/ocaml-toolchain.lock | cut -d' ' -f1)"
      - aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp "s3://$TG_S3_BUCKET/$CI_REPO/cache/opam-dune-$LOCK_SHA.tar.gz" /tmp/opam-dune-cache.tar.gz --no-progress || true
      - tar -xzf /tmp/opam-dune-cache.tar.gz -C "$HOME" 2>/dev/null || true

  - name: ocaml-seed-health
    image: bash
    depends_on: [cache-restore]
    commands:
      - |
        set -euo pipefail
        command -v opam >/dev/null 2>&1 || { echo "operator: opam is not on PATH (see docs/current/ci.md)"; exit 1; }
        if ! opam switch list --short 2>/dev/null | grep -qx "5.4.0"; then
          echo "operator: create the pinned switch once with: opam switch create 5.4.0 ocaml-base-compiler.5.4.0"
          exit 1
        fi
        eval "$(opam env --switch=5.4.0 --set-switch)"
        opam install -y dune.3.21.1
        bash scripts/check_ocaml_seed_health.sh

  - name: full-completeness-report
    image: bash
    depends_on: [ocaml-seed-health]
    failure: ignore
    commands:
      - cat /tmp/ocaml_full_completeness_verdict.txt

  - name: cache-save
    image: bash
    depends_on: [ocaml-seed-health]
    failure: ignore
    environment: *tg_s3_env
    commands:
      - |
        set -euo pipefail
        LOCK_SHA="$(shasum -a 256 bootstrap/ocaml-toolchain.lock | cut -d' ' -f1)"
        tar -czf /tmp/opam-dune-cache.tar.gz -C "$HOME" .opam/download-cache .cache/dune 2>/dev/null || true
        if [ -s /tmp/opam-dune-cache.tar.gz ]; then
          aws --endpoint-url "$TG_S3_ENDPOINT" s3 cp /tmp/opam-dune-cache.tar.gz "s3://$TG_S3_BUCKET/$CI_REPO/cache/opam-dune-$LOCK_SHA.tar.gz" --no-progress
        fi

[project]
name = "tangerine"
version = "0.1.0"
authors = ["Tangerine Contributors"]
edition = "2026"
output_dir = "build"
mode = "Production"
profile = "backend"

[sources]
files = [
  "tg_compiler/driver.tg",
  "tg_compiler/lexer.tg",
  "tg_compiler/parser.tg",
  "tg_compiler/ast.tg",
  "tg_compiler/token.tg",
  "tg_compiler/types.tg",
  "tg_compiler/trait_resolve.tg",
  "tg_compiler/borrow_check.tg",
  "tg_compiler/mir.tg",
  "tg_compiler/codegen.tg",
  "tg_compiler/asm.tg",
  "tg_compiler/object.tg",
  "tg_compiler/linker.tg",
  "tg_compiler/resolver.tg",
  "tg_compiler/lib.tg",
  "tg_compiler/agentic.tg",
  "tg_compiler/formatter.tg",
  "tg_compiler/linter.tg",
  "tg_compiler/docgen.tg",
  "tg_compiler/mode.tg",
  "tg_compiler/cqs.tg",
  "tg_compiler/coverage.tg",
  "tg_compiler/cap_baseline.tg",
  "tg_compiler/symbol_graph.tg",
  "tg_compiler/context_pack.tg",
  "tg_compiler/refactor.tg",
  "tg_compiler/util.tg"
]

[dependencies]
# No external dependencies — Tangerine self-hosts

[test]
dir = "golden"
pattern = "**/*.tg"

[quality]
require_contracts_for_pub = true
require_tests_for_pub = true
forbid_stub_patterns = true
forbid_unsafe_without_reason = true
require_budget_for_handlers = true

[cqs]
mode = "Production"

[cqs.thresholds]
public_stable_min_score = 85
public_stable_branch_cov = 0.75

[cqs.weights]
CF_1 = 8
CF_2 = 15
CF_3 = 18
CF_4 = 10
DF_1 = 4
DF_2 = 10
DF_3 = 3
DF_4 = 8
EH_1 = 12
EH_2 = 8
CV_1 = 10
CV_2 = 20
CP_1 = 10
CP_2 = 20
CP_3 = 18
FT_1 = 8
FT_2 = 10

[cws]
profile = "backend"
budget_total_cu = 160000
summaries_ratio = 0.40
K = 2000
alpha = 0.55

[cws.radius]
call = 3.0
types = 2.5
traits = 2.0
effects = 2.0
tests = 3.0
files = 1.5

[cws.limits]
max_candidate_symbols = 25000
max_expanded_edges = 250000
max_seeds = 300

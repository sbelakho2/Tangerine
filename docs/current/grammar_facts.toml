# docs/current/grammar_facts.toml — the grammar productions' enumeration
# (Gate F — the grammar-production coverage oracle).
#
# The enumeration is derived from docs/current/grammar.md's EBNF rule set
# (the syntactic non-terminals; the lexer-level token rules such as
# INT_LITERAL / STRING_LITERAL are token productions, not parser
# productions, and are excluded). Every production must carry the four
# Gate F specimens in tests/grammar_f/ (pos/<prod>_minimal.tg,
# pos/<prod>_nested.tg, neg/<prod>_before.tg, neg/<prod>_after.tg),
# generated by scripts/gen_grammar_f_specimens.py and enforced by
# scripts/check_grammar_f_gate.sh.
#
# verify = "check"  the positive specimens must pass `tg check`
#        = "parse"  the production parses and the AST keeps it, but the
#                    pipeline rejects it AFTER parsing by design
#                    (try_expr / handle_with_expr: "exceptions are not
#                    supported — no throwing path may bypass teardown") —
#                    the positives must pass `tg parse`.

schema_version = 1
source = "docs/current/grammar.md (the EBNF rule enumeration, §1-§7)"
specimen_classes = ["minimal-positive", "nested-positive", "invalid-before", "invalid-after"]

[production.access_marker]
rule = "access_marker = '&' unary | '&mut' unary"
verify = "check"

[production.arg_list]
rule = "arg_list = [ named_arg | expr ] { ',' [ named_arg | expr ] } [ ',' ]"
verify = "check"

[production.assignment]
rule = "assignment = expr ( '=' | '+=' | '-=' | '*=' | '/=' | '%=' ) expr"
verify = "check"

[production.async_block]
rule = "async_block = 'async' block 'end'"
verify = "check"

[production.attribute]
rule = "attribute = '@' IDENT [ '(' attribute_args ')' ]"
verify = "check"

[production.attribute_args]
rule = "attribute_args = { IDENT | STRING_LITERAL | any_token } // tokens collected raw"
verify = "check"

[production.bitwise_and]
rule = "bitwise_and = shift { '&' shift }"
verify = "check"

[production.bitwise_or]
rule = "bitwise_or = bitwise_xor { '|' bitwise_xor }"
verify = "check"

[production.bitwise_xor]
rule = "bitwise_xor = bitwise_and { '^' bitwise_and }"
verify = "check"

[production.block_expr]
rule = "block_expr = 'do' [ '|' closure_params '|' ] { statement } 'end'"
verify = "check"

[production.break_expr]
rule = "break_expr = 'break' [ expr ]"
verify = "check"

[production.budget_amount]
rule = "budget_amount = STRING_LITERAL"
verify = "check"

[production.capability_decl]
rule = "capability_decl = 'cap' IDENT [ 'implies' IDENT { ',' IDENT } ] 'end'"
verify = "check"

[production.closure_expr]
rule = "closure_expr = '|' [ closure_params ] '|' [ '->' type_expr ] expr | '||' [ '->' type_expr ] expr | '{' '|' [ closure_params ] '|' [ '->' type_expr ] expr '}' | 'do' '|' [ closure_params ] '|' [ '->' type_expr ] block 'end'"
verify = "check"

[production.closure_param]
rule = "closure_param = pattern [ ':' type_expr ]"
verify = "check"

[production.closure_params]
rule = "closure_params = closure_param { ',' closure_param }"
verify = "check"

[production.comparison]
rule = "comparison = bitwise_or { ( '<' | '>' | '<=' | '>=' ) bitwise_or }"
verify = "check"

[production.comptime_block]
rule = "comptime_block = 'comptime' block 'end'"
verify = "check"

[production.const_decl]
rule = "const_decl = ( 'const' | 'let' ) IDENT [ ':' type_expr ] '=' expr"
verify = "check"

[production.convention]
rule = "convention = 'inout' | 'sink' | 'set' // default 'let'; the legacy prefixes (mut/&mut/&/move/own) are E100"
verify = "check"

[production.defer_block]
rule = "defer_block = 'defer' block 'end'"
verify = "check"

[production.deinit_def]
rule = "deinit_def = 'def' 'deinit' '(' 'sink' 'self' ':' 'Self' ')' [ '->' type_expr ] block 'end'"
verify = "check"

[production.edition_decl]
rule = "edition_decl = 'edition' STRING_LITERAL"
verify = "check"

[production.effect_decl]
rule = "effect_decl = 'effect' IDENT [ type_params ] { effect_op_sig } 'end'"
verify = "check"

[production.effect_op_sig]
rule = "effect_op_sig = IDENT '(' [ IDENT { ',' IDENT } ] ')' [ '->' type_expr ]"
verify = "check"

[production.enum_def]
rule = "enum_def = 'enum' IDENT [ type_params ] { variant_def } 'end'"
verify = "check"

[production.equality]
rule = "equality = comparison { ( '==' | '!=' ) comparison }"
verify = "check"

[production.expr]
rule = "expr = logical_or"
verify = "check"

[production.expr_statement]
rule = "expr_statement = expr"
verify = "check"

[production.extern_item]
rule = "extern_item = 'extern' [ STRING_LITERAL ] 'def' IDENT [ type_params ] '(' [ param_list ] ')' [ '->' type_expr ] [ 'end' ] | 'extern' [ STRING_LITERAL ] { 'def' IDENT ... 'end' } | 'extern' [ STRING_LITERAL ] 'static' [ 'mut' ] IDENT ':' type_expr"
verify = "check"

[production.factor]
rule = "factor = unary { ( '*' | '/' | '%' | '**' ) unary }"
verify = "check"

[production.field_def]
rule = "field_def = [ vis ] IDENT ':' type_expr [ ',' ]"
verify = "check"

[production.field_init]
rule = "field_init = IDENT [ ':' expr ]"
verify = "check"

[production.field_init_list]
rule = "field_init_list = field_init { ',' field_init } [ ',' ]"
verify = "check"

[production.field_pattern]
rule = "field_pattern = IDENT [ ':' pattern ]"
verify = "check"

[production.field_pattern_list]
rule = "field_pattern_list = field_pattern { ',' field_pattern }"
verify = "check"

[production.fn_clause]
rule = "fn_clause = 'pre' expr [ ',' STRING_LITERAL ] | 'post' expr [ ',' STRING_LITERAL ] | 'ensures' expr [ ',' STRING_LITERAL ] | 'invariant' expr [ ',' STRING_LITERAL ] | 'requires' IDENT { ',' IDENT } | 'effect' IDENT { ',' IDENT } | ( 'budget' | '@budget' ) IDENT ':' budget_amount { ',' IDENT ':' budget_amount }"
verify = "check"

[production.fn_modifier]
rule = "fn_modifier = 'async' | 'unsafe' | 'pure' | 'inline'"
verify = "check"

[production.fn_type]
rule = "fn_type = 'fn' '(' [ fn_type_param { ',' fn_type_param } ] ')' [ '->' type_expr ] | '(' [ fn_type_param { ',' fn_type_param } ] ')' '->' type_expr | '(' ')' '->' type_expr // () -> R | 'Fn' '(' [ fn_type_param { ',' fn_type_param } ] ')' [ '->' type_expr ]"
verify = "check"

[production.fn_type_param]
rule = "fn_type_param = [ convention ] type_expr"
verify = "check"

[production.for_expr]
rule = "for_expr = 'for' pattern 'in' expr [ 'do' ] block 'end'"
verify = "check"

[production.function_def]
rule = "function_def = { fn_modifier } 'def' IDENT [ type_params ] '(' [ param_list ] ')' [ '->' type_expr ] [ 'where' where_pred { ',' where_pred } ] [ 'inout' ] // trailing receiver convention { fn_clause } ( '=' expr | block 'end' )"
verify = "check"

[production.function_sig]
rule = "function_sig = { fn_modifier } 'def' IDENT [ type_params ] '(' [ param_list ] ')' [ '->' type_expr ]"
verify = "check"

[production.guard_stmt]
rule = "guard_stmt = 'guard' expr 'else' ( 'return' [ expr ] | 'break' [ expr ] | 'continue' | 'panic' '(' STRING_LITERAL ')' )"
verify = "check"

[production.handle_with_expr]
rule = "handle_with_expr = 'handle' expr { 'with' IDENT { IDENT '(' [ IDENT { ',' IDENT } ] ')' '=>' expr } } 'end'"
verify = "parse"

[production.if_expr]
rule = "if_expr = 'if' expr [ 'then' ] block { 'elsif' expr [ 'then' ] block } [ 'else' block ] [ 'end' ] // end optional in short form"
verify = "check"

[production.if_let]
rule = "if_let = 'if' 'let' pattern '=' expr block { 'elsif' 'let' pattern '=' expr block } [ 'else' block ] 'end' // desugars to match"
verify = "check"

[production.impl_block]
rule = "impl_block = 'impl' [ type_params ] ( type_expr // inherent | type_expr 'for' type_expr ) // trait impl [ 'where' where_pred { ',' where_pred } ] ( 'do' { impl_item } 'end' | '{' { impl_item } '}' )"
verify = "check"

[production.impl_item]
rule = "impl_item = function_def | 'type' IDENT '=' type_expr"
verify = "check"

[production.item]
rule = "item = { attribute } item_body"
verify = "check"

[production.literal_pattern]
rule = "literal_pattern = INT_LITERAL | FLOAT_LITERAL | STRING_LITERAL | CHAR_LITERAL | 'true' | 'false' | 'nil'"
verify = "check"

[production.local_decl]
rule = "local_decl = 'let' [ 'mut' ] pattern [ ':' type_expr ] '=' expr | 'var' pattern [ ':' type_expr ] '=' expr // var = mut alias | 'mut' IDENT [ ':' type_expr ] '=' expr // LEGACY var alias"
verify = "check"

[production.logical_and]
rule = "logical_and = range { '&&' range }"
verify = "check"

[production.logical_or]
rule = "logical_or = logical_and { '||' logical_and }"
verify = "check"

[production.loop_expr]
rule = "loop_expr = 'loop' [ 'do' ] block 'end'"
verify = "check"

[production.macro_decl]
rule = "macro_decl = 'macro' IDENT '(' [ macro_param { ',' macro_param } ] ')' block 'end'"
verify = "check"

[production.macro_param]
rule = "macro_param = IDENT ':' macro_type"
verify = "check"

[production.macro_type]
rule = "macro_type = 'Expr' | 'Ident' | 'Type' | 'Block' | 'Pattern'"
verify = "check"

[production.match_arm]
rule = "match_arm = 'when' pattern [ 'if' expr ] [ 'then' ] block | pattern [ 'if' expr ] '=>' ( expr | block )"
verify = "check"

[production.match_expr]
rule = "match_expr = 'match' expr { match_arm } [ 'else' block ] // catch-all arm 'end'"
verify = "check"

[production.name_list]
rule = "name_list = IDENT { ',' IDENT }"
verify = "check"

[production.named_arg]
rule = "named_arg = IDENT ':' expr // label consumed and discarded"
verify = "check"

[production.param]
rule = "param = [ 'inout' | 'sink' | 'set' ] IDENT [ ':' type_expr ] [ '=' expr ]"
verify = "check"

[production.param_list]
rule = "param_list = param { ',' param } [ ',' ]"
verify = "check"

[production.path]
rule = "path = path_segment { '::' path_segment }"
verify = "check"

[production.path_segment]
rule = "path_segment = IDENT | 'super' | 'crate'"
verify = "check"

[production.pattern]
rule = "pattern = single_pattern { '|' single_pattern } // or-pattern"
verify = "check"

[production.postfix]
rule = "postfix = primary { postfix_op }"
verify = "check"

[production.postfix_op]
rule = "postfix_op = '?' // try / propagate | '.' ( IDENT | INT_LITERAL ) // field or tuple .0 [ '[' type_expr { ',' type_expr } ']' ] // method type args [ '(' [ arg_list ] ')' ] // method call [ trailing_block ] // { |x| body } | '(' [ arg_list ] ')' // function call | '[' expr ']' // subscript (place) | 'is' type_expr // type check | 'as' type_expr // cast | '|>' postfix // pipeline"
verify = "check"

[production.primary]
rule = "primary = INT_LITERAL | FLOAT_LITERAL | STRING_LITERAL | CHAR_LITERAL | 'true' | 'false' | 'nil' | 'self' | IDENT // identifier | path // a::b | path '(' [ arg_list ] ')' // enum variant ctor | IDENT '!' ( '[' [ expr_list ] ']' | '(' [ arg_list ] ')' ) // macro call | struct_literal | '(' ')' | '(' expr { ',' expr } ')' // unit / tuple | '[' [ expr { ',' expr } ] ']' // array literal | '{' expr '}' // expr block | '{' '|' closure_params '|' expr '}' // closure | '{' expr '=>' expr { ',' expr '=>' expr } '}' // map literal | block_expr | closure_expr | if_expr | unless_expr | match_expr | for_expr | while_expr | until_expr | loop_expr | try_expr | guard_stmt | handle_with_expr | unsafe_block | defer_block | async_block | comptime_block | return_expr | break_expr"
verify = "check"

[production.program]
rule = "program = { item }"
verify = "check"

[production.range]
rule = "range = equality [ ( '..' | '..=' ) [ equality ] ]"
verify = "check"

[production.range_pattern]
rule = "range_pattern = ( INT_LITERAL | CHAR_LITERAL ) [ ( '..' | '..=' ) ( INT_LITERAL | CHAR_LITERAL ) ]"
verify = "check"

[production.rationale_block]
rule = "rationale_block = 'rationale' { rationale_field } 'end'"
verify = "check"

[production.rationale_field]
rule = "rationale_field = IDENT ':' ( STRING_LITERAL | expr )"
verify = "check"

[production.raw_deref]
rule = "raw_deref = '*' unary | '**' unary"
verify = "check"

[production.resource_def]
rule = "resource_def = 'resource' NAME { field | method } 'end'"
verify = "check"

[production.return_expr]
rule = "return_expr = 'return' [ expr ]"
verify = "check"

[production.shift]
rule = "shift = term { ( '<<' | '>>' ) term }"
verify = "check"

[production.single_pattern]
rule = "single_pattern = '_' // wildcard | IDENT // binding | 'mut' IDENT // mutable binding | literal_pattern | IDENT '(' [ pattern { ',' pattern } ] ')' // variant | path '(' [ pattern { ',' pattern } ] ')' // qualified variant | IDENT '{' field_pattern_list '}' // struct destructure | path '{' field_pattern_list '}' // qualified struct | '(' [ pattern { ',' pattern } ] ')' // tuple | '[' [ pattern { ',' pattern } ] ']' // array | range_pattern | ( '&' | '&mut' | 'ref' ) single_pattern // REJECTED: E106 \"ref patterns are not supported\""
verify = "check"

[production.statement]
rule = "statement = local_decl | assignment | expr_statement | 'use' use_decl | 'def' function_def | 'struct' struct_def | 'resource' resource_def | 'enum' enum_def | 'impl' impl_block | '@' attribute_body | control_flow_statement"
verify = "check"

[production.static_decl]
rule = "static_decl = 'static' [ 'mut' ] IDENT ':' type_expr '=' expr"
verify = "check"

[production.struct_def]
rule = "struct_def = 'struct' IDENT [ type_params ] { field_def } 'end'"
verify = "check"

[production.struct_literal]
rule = "struct_literal = IDENT '{' field_init_list '}' // Name { f: v } | path '{' field_init_list '}' // a::B { f: v } | IDENT '[' type_args ']' '{' field_init_list '}' // Foo[T] { ... } | IDENT '[' type_args ']' '::' IDENT '(' [ arg_list ] ')' // Vec[u8]::new(...)"
verify = "check"

[production.supertrait_list]
rule = "supertrait_list = type_expr { '+' type_expr }"
verify = "check"

[production.term]
rule = "term = factor { ( '+' | '-' ) factor }"
verify = "check"

[production.trailing_block]
rule = "trailing_block = '{' [ '|' closure_params '|' ] expr '}'"
verify = "check"

[production.trait_def]
rule = "trait_def = 'trait' IDENT [ type_params ] [ ':' supertrait_list ] { trait_item } 'end'"
verify = "check"

[production.trait_item]
rule = "trait_item = function_sig [ body ] // body = default implementation | 'type' IDENT [ ':' type_bound ] [ '=' type_expr ]"
verify = "check"

[production.try_expr]
rule = "try_expr = 'try' block { 'catch' pattern block } [ 'finally' block ] 'end'"
verify = "parse"

[production.type_alias]
rule = "type_alias = ( 'type' | 'typealias' | 'alias' ) IDENT [ type_params ] '=' type_expr"
verify = "check"

[production.type_args]
rule = "type_args = '[' type_expr { ',' type_expr } ']'"
verify = "check"

[production.type_bound]
rule = "type_bound = type_expr { '+' type_expr }"
verify = "check"

[production.type_expr]
rule = "type_expr = type_primary [ '?' ] // T? desugars to Option[T]"
verify = "check"

[production.type_param]
rule = "type_param = IDENT [ ':' type_bound ] [ '=' type_expr ]"
verify = "check"

[production.type_params]
rule = "type_params = '[' type_param { ',' type_param } ']'"
verify = "check"

[production.type_primary]
rule = "type_primary = IDENT [ type_args ] // Named type / generic | path [ type_args ] // a::b::C | 'Self' [ '::' IDENT { '::' IDENT } ] // Self and associated | '(' ')' // Unit | '(' type_expr { ',' type_expr } ')' // Tuple (1 elem = group) | '[' type_expr ';' expr ']' // Fixed-size array | '[' type_expr ']' // Slice | '&' type_primary // HARD ERROR (E106); the only accepted `&` type forms are the __intrinsic_-scoped extern ABI positions (see the note above) | '&mut' type_primary // HARD ERROR (E106); same __intrinsic_-scoped extern exception | '&&' type_primary // HARD ERROR (E106) | '*' [ 'mut' ] type_primary // *T / *mut T raw pointer | 'async' type_primary // Async wrapper | 'impl' type_primary // desugars to the trait | 'dyn' type_primary // desugars to the trait | '_' // inferred type | fn_type"
verify = "check"

[production.unary]
rule = "unary = ( '-' | '!' | '~' ) unary | ( '&' | '&mut' ) unary // access marker (see 4.2) | ( '*' | '**' ) unary // raw deref (see 4.3) | 'await' unary | ( 'move' | 'copy' ) unary // legacy no-ops | postfix"
verify = "check"

[production.unless_expr]
rule = "unless_expr = 'unless' expr [ 'then' ] block [ 'else' block ] 'end'"
verify = "check"

[production.unsafe_block]
rule = "unsafe_block = 'unsafe' [ STRING_LITERAL ] ( 'do' block 'end' | '{' block '}' )"
verify = "check"

[production.until_expr]
rule = "until_expr = 'until' expr [ 'do' ] block 'end'"
verify = "check"

[production.use_decl]
rule = "use_decl = 'use' path [ '::' ( '*' | '{' name_list '}' ) ] [ 'as' IDENT ]"
verify = "check"

[production.variant_def]
rule = "variant_def = IDENT [ '(' variant_field { ',' variant_field } ')' ]"
verify = "check"

[production.variant_field]
rule = "variant_field = [ IDENT ':' ] type_expr"
verify = "check"

[production.vis]
rule = "vis = 'pub' | 'private'"
verify = "check"

[production.where_clause]
rule = "where_clause = 'where' where_pred { ',' where_pred }"
verify = "check"

[production.where_pred]
rule = "where_pred = type_expr ':' type_bound"
verify = "check"

[production.while_expr]
rule = "while_expr = 'while' expr [ 'do' ] block 'end'"
verify = "check"

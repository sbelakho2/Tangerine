# Tangerine stdlib contracts manifest — the machine-readable completeness model.
#
# The reviewer item 32 completeness model: every shipped std/*.tg module belongs
# to exactly one verification family, and every family names its MINIMUM PROOF.
# The generator (scripts/gen_stdlib_completeness.sh) renders
# docs/current/stdlib_completeness.md from this file and MECHANICALLY verifies:
#   - the enumeration: every std/*.tg file has a contract entry, and every
#     contract names a real module — an un-contracted module (a new std file)
#     FAILS the gate until it receives a contract + proof tests;
#   - every proof test path exists in the tree;
#   - the family names agree with the completeness model's vocabulary.
#
# The CI enumeration gate lives in tests/run_stdlib_completeness_gate.sh, which
# tests/run_stdlib_e106_sweep.sh (the REQUIRED stdlib-e106-sweep CI job) runs
# before any module is checked.
#
# The reviewer's table enumerated 133 modules; the current tree enumerates the
# count below (computed from std/*.tg, never typed): std/postgres.tg was merged
# into std/db.tg and std/hash_tests.tg was removed in earlier waves. The count
# is derived by the enumeration gate, so any new std file fails the gate until
# it receives a contract + proof tests.

version = 1

[family."kernel"]
minimum_proof = "the bootstrap ladder compiles the module at every stage (bootstrap/compiler_kernel.manifest + run_bootstrap.sh); the E106 sweep keeps it parse-clean"

[family."native"]
minimum_proof = "a committed native behavior suite (tests/unit/*_rigor.tg, tests/*_test.tg) exercises the module's public API via `tg test`"

[family."lane"]
minimum_proof = "a committed CI lane verifies check + object + link/import smoke and the module's own @test suites where declared"

[family."parse-clean"]
minimum_proof = "the E106 sweep only: `tg check` zero-diagnostics + the forbidden-syntax backstop (tests/run_stdlib_e106_sweep.sh)"

[family."experimental"]
minimum_proof = "parse-clean only; the module is flagged experimental (item 33 stable-subset policy) and is EXPLICITLY EXCLUDED from the shipped-std behavior claims"


constructs = "||"
associativity = "left"

[[precedence_level]]
level = 2
constructs = "&&"
associativity = "left"

[[precedence_level]]
level = 3
constructs = ".. ..="
associativity = "none"

[[precedence_level]]
level = 4
constructs = "== !="
associativity = "left"

[[precedence_level]]
level = 5
constructs = "< > <= >="
associativity = "left"

[[precedence_level]]
level = 6
constructs = "|"
associativity = "left"

[[precedence_level]]
level = 7
constructs = "^"
associativity = "left"

[[precedence_level]]
level = 8
constructs = "&"
associativity = "left"

[[precedence_level]]
level = 9
constructs = "<< >>"
associativity = "left"

[[precedence_level]]
level = 10
constructs = "+ -"
associativity = "left"

[[precedence_level]]
level = 11
constructs = "* / % **"
associativity = "left"

[[precedence_level]]
level = 12
constructs = "prefix: - ! ~ & &mut * ** await move copy"
associativity = "right"

[[precedence_level]]
level = 13
constructs = "postfix: ? . () [] is as |>"
associativity = "left"

# The access conventions (language.md §"Access Conventions", memory_model.md
# §2): every parameter and receiver carries an explicit access convention;
# the default (no prefix) is `let`.

[[access_convention]]
name = "let"
keyword = "none (the default)"
effect = "Read"
meaning = "observe — read-only access to the caller's value: no move, no consume, never finalized by the callee"

[[access_convention]]
name = "inout"
keyword = "inout"
effect = "Modify"
meaning = "exclusive mutation — the callee may read and write the caller's place"

[[access_convention]]
name = "sink"
keyword = "sink"
effect = "Consume"
meaning = "by-value move — ownership transfers into the callee; the callee finalizes it if still live"

[[access_convention]]
name = "set"
keyword = "set"
effect = "Initialize"
meaning = "initialize dead storage — the callee writes into an uninitialized place"

[[access_marker]]
name = "&place"
meaning = "selects the callee-side convention and lowers to a MIR Place argument; ONLY valid as a call argument — the type checker rejects it anywhere else"
fact = "the access marker '&' is only valid as a call argument"

[[access_marker]]
name = "&mut place"
meaning = "selects the mutable callee-side convention (Modify); ONLY valid as a call argument"

[[access_marker]]
name = "trailing inout receiver"
meaning = "mutating methods use the trailing `inout` receiver convention: `def set_name(self, name: String) -> Unit inout`"

[[access_marker]]
name = "&T / &mut T in type position"
meaning = "the E106 hard error — first-class reference types do not exist in the dialect; access is expressed with parameter conventions and access markers only"

# The syntax forms (grammar.md §2 — the item grammar).

[[syntax_form]]
name = "def"
form = "def name(params) -> ReturnType ... end"
meaning = "function item; params carry the access conventions; `-> Type` optional"

[[syntax_form]]
name = "struct"
form = "struct Name ... end"
meaning = "nominal record item; fields in declaration order (F6 — no reordering)"

[[syntax_form]]
name = "resource"
form = "resource Name ... end"
meaning = "resource item (the deinit-carrying nominal form)"

[[syntax_form]]
name = "enum"
form = "enum Name ... end"
meaning = "tagged enum item; tag at offset 0 (8 bytes), payload at offset 8 (F3)"

[[syntax_form]]
name = "trait"
form = "trait Name ... end"
meaning = "trait item (the one trait solver)"

[[syntax_form]]
name = "impl"
form = "impl Name ... end"
meaning = "implementation block for a nominal type or trait"

[[syntax_form]]
name = "module / mod"
form = "module Path ... end"
meaning = "module item (the crate module graph is keyed by ModuleId)"

[[syntax_form]]
name = "use"
form = "use std::path::{a, b}"
meaning = "import declaration"

[[syntax_form]]
name = "const / static"
form = "const NAME: T = expr"
meaning = "constant / static item (static supports @thread_local for TLS)"

[[syntax_form]]
name = "typealias / type / alias"
form = "typealias Name = T"
meaning = "type alias item"

[[syntax_form]]
name = "extern"
form = "extern \"C\" def name(...) -> T"
meaning = "foreign-function declaration / extern block"

[[syntax_form]]
name = "let / var / mut"
form = "let x = expr; var x = expr"
meaning = "binding statement; `mut`/`var` marks the binding mutable"

[[syntax_form]]
name = "if"
form = "if cond then ... elsif cond then ... else ... end"
meaning = "conditional statement/expression"

[[syntax_form]]
name = "unless"
form = "unless cond then ... end"
meaning = "negative conditional (if !cond)"

[[syntax_form]]
name = "while"
form = "while cond do ... end"
meaning = "pre-test loop"

[[syntax_form]]
name = "until"
form = "until cond do ... end"
meaning = "negative pre-test loop (while !cond)"

[[syntax_form]]
name = "for"
form = "for i in 0..n do ... end"
meaning = "iteration loop over a range/collection"

[[syntax_form]]
name = "loop"
form = "loop ... end"
meaning = "infinite loop"

[[syntax_form]]
name = "match"
form = "match expr ... when pat then ... end"
meaning = "pattern match with `when` arms"

[[syntax_form]]
name = "return / break / next"
form = "return expr; break; next"
meaning = "transfer statements"

[[syntax_form]]
name = "defer"
form = "defer expr"
meaning = "deferred action registered at the edge"

[[syntax_form]]
name = "try / catch / finally"
form = "try ... catch e ... finally ... end"
meaning = "error-handling form"

[[syntax_form]]
name = "guard"
form = "guard cond else ... end"
meaning = "early-exit guard"

[[syntax_form]]
name = "async / await"
form = "async { ... }; await expr"
meaning = "concurrency forms (the executor's virtual time in the deterministic run)"

[[syntax_form]]
name = "contracts"
form = "pre ... / post ... / invariant ... / requires ... / ensures ..."
meaning = "contract clauses attached to functions"

[[syntax_form]]
name = "attributes"
form = "@name(args)"
meaning = "item attributes (@export, @repr(C), @ffi(alloc = \"tangerine\"), @thread_local, ...)"

[[syntax_form]]
name = "doc comments"
form = "## ..."
meaning = "doc-comment lines (compiler-doctested, see docs/current/doctests.md policy in check_doctests.sh)"

[[syntax_form]]
name = "macro"
form = "macro ... end"
meaning = "macro item (the E105 expansion-fixpoint contract)"

[[syntax_form]]
name = "comptime"
form = "comptime ..."
meaning = "compile-time evaluation form"

[[syntax_form]]
name = "cap / effect / pure / unsafe / budget / rationale / edition"
form = "cap ... / effect ... / pure / unsafe ... / budget ... / rationale ... / edition ..."
meaning = "capability/effect/edition declaration forms"

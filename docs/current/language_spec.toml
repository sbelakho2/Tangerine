# Tangerine language spec — the machine-readable normative grammar facts.
#
# The reviewer's item 34: the manually maintained normative facts reduced to
# the machine-readable schema. THIS FILE is the single source for the
# keywords, the operators, the expression precedence, the access conventions
# and the syntax forms of the Tangerine dialect. The generator
# (scripts/gen_spec_docs.sh) renders docs/current/language_spec.md from it,
# and the CI evidence-gate job regenerates and runs `git diff --exit-code`
# on BOTH this schema and the rendered doc — a stale hand-edited normative
# fact cannot merge.
#
# The facts are sourced from the compiler's own authority:
#   - the keywords: tg_compiler/token.tg keyword_from_str (the keyword table
#     the lexer dispatches through — tg_compiler/lexer.tg lex_ident);
#   - the operators + precedence: the precedence-climbing chain
#     (docs/current/grammar.md §4.1, parser.tg) and the operator lexing
#     (tg_compiler/lexer.tg lex_operator_or_delimiter);
#   - the access conventions: docs/current/language.md §"Access Conventions"
#     + docs/current/memory_model.md §2 (the typed access effects);
#   - the syntax forms: docs/current/grammar.md §2 (the item grammar).
#
# Do NOT hand-edit the rendered docs/current/language_spec.md: regenerate it.

version = 1

[lexical]
identifier = "XID_Start followed by XID_Continue scalars; the identifier identity is the NFC-normalized form (the original spelling stays available through the token span)"
keywords = "pure ASCII; a keyword is recognized by exact match in the keyword table below (token.tg keyword_from_str) — keywords are never identifiers"
newline = "LF -> one Newline token; CRLF -> one Newline token (both bytes); CR alone -> one Newline token"
comments = "# to end of line; ## starts a doc comment"


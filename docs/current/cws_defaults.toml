# Tangerine CWS default parameters (v0.2 normative defaults)
# Source-aligned to needed_checklist §§104-111.

[cws.units]
cu_bytes = 4

[cws.profile.backend]
budget_total_cu = 160000
summaries_ratio = 0.40
K = 2000
alpha = 0.55
tier_s_ratio = 0.10
tier_m_ratio = 0.45
tier_l_ratio = 0.45


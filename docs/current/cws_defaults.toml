[cws.limits]
max_candidate_symbols = 25000
max_expanded_edges = 250000
max_seeds = 300

[cws.edge_costs]
call = 1.0
type_use = 1.2
trait = 1.1
test = 0.9
effect = 0.8
file = 1.4

[cws.seed_ranking]
rank_1 = "failing_test_roots"
rank_2 = "compiler_error_roots"
rank_3 = "gated_cqs_failures"
rank_4 = "user_mentioned_symbols"
rank_5 = "recently_changed_symbols"

[cws.needs]
correctness_failure = ["compile_error_root", "compile_error_deps", "failing_test_root", "failing_test_assertion", "stacktrace_symbols"]
api_semantics = ["public_api_signature", "public_api_contracts", "error_types", "match_exhaustiveness_context", "trait_resolution_context"]
security = ["capability_footprint", "capability_drift", "taint_sources_and_validators", "unsafe_blocks_and_reasons"]
performance = ["budgets", "hot_path_callers_callees"]
project_structure = ["module_boundaries", "feature_flags_and_future_blocks", "config_schema"]


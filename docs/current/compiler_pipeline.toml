# Tangerine compiler pipeline — the machine-readable stage facts.
#
# The reviewer's item 34: the manually maintained normative facts reduced to
# the machine-readable schema. THIS FILE is the single source for the stage
# order, the stopping points, the per-stage single authority, the verifier's
# schema and the completeness oracles of the self-hosted compiler (the
# compile_file_core pipeline in tg_compiler/compiler_core.tg). The generator
# (scripts/gen_spec_docs.sh) renders docs/current/pipeline_stages.md from it,
# and the CI evidence-gate job regenerates + `git diff --exit-code` on BOTH
# the schema and the rendered doc.
#
# THE CONTRADICTIONS RESOLVED HERE (the facts below ARE the resolution):
#   - where `tg check` stops: the driver's cmd_check sets
#     `check_only = true; stop_after = StopAfter::Mir` (tg_compiler/driver.tg),
#     and compile_file_core returns right after the post-lower MIR
#     verification — `tg check` stops after stage 11 (MIR lowered AND
#     verified), NOT at StopAfter::Semantic. The code comment says it
#     exactly: "`tg check` stops here: the program has been lexed, parsed,
#     dependencies resolved, macros expanded, type-checked, access-checked,
#     lowered to MIR and verified — without generating native code."
#   - the register allocation: codegen.tg performs DIRECT emission with the
#     inline per-function register state (RegAllocState — alloc_reg /
#     free_reg / alloc_reg_or_spill, codegen.tg). There is NO standalone
#     register-allocation pass in the pipeline; "register allocation" in
#     pipeline prose means this register-targeted emission inside stage 14
#     (matching invariants.md INV-OPT-006: "no register allocator exists —
#     codegen is direct stack-frame + register-targeted emission").
#   - the canonical-MIR lag: the verifier's CURRENT schema is the seven
#     invariants below (canonical_ir_spec.md's INV-MIR-001..009 list and the
#     "re-verified (Stage 5 work)" note are STALE — the verify-everything
#     policy re-proves post-opt and immediately before codegen).
#
# Do NOT hand-edit the rendered docs: regenerate them.

version = 1

# The canonical semantic pass: stages 4-9 run as ONE canonical API,
# analyze_parsed (compiler_core.tg), over the shared Program; the driver
# NEVER re-runs expansion or id assignment (pre-pass duplication corrupts
# node-id identity). analyze_source (lex + parse + the canonical pass) is the
# front door of `tg check` and lib::check; compile_file_core performs the
# same canonical pass then continues through MIR/mono/optimize/codegen.
canonical_pass = "analyze_parsed"
canonical_pass_stages = [4, 5, 6, 7, 8, 9]

[[stage]]
number = 1
name = "Lexing"
entry = "tokenize(source, file)"
source = "lexer.tg"
representation = "Vec[Token] / LexResult"
authority = "the token stream is the only authority for source-text boundaries; no stage re-lexes"
consumed_by = "parser"

[[stage]]
number = 2
name = "Parsing"
entry = "parse(lex_result)"
source = "parser.tg"
representation = "Program (Program.items)"
authority = "the parser is the only producer of the Program AST from tokens; parse diagnostics hard-stop before anything semantic"
consumed_by = "all later stages"

[[stage]]
number = 3
name = "Dependency merge"
entry = "merge_imported_deps(ast, ...)"
source = "compiler_core.tg"
representation = "Program.crate (Crate.root, Crate.modules: Map[ModuleId, Module])"
authority = "merge_imported_deps is the only builder of the Program.crate module graph; later stages read Crate.modules by ModuleId, never rebuild it"
consumed_by = "resolution, type checking, mono (crate containment for fn_owner_key_of_def)"

[[stage]]
number = 4
name = "Macro expansion"
entry = "expand_macros(program, diags)"
source = "compiler_core.tg"
representation = "Program (macro-free AST)"
authority = "expand_macros is the only authority over expansion; a non-converging fixpoint (E105) hard-stops BEFORE resolution — an incompletely expanded AST is never semantically processed"
consumed_by = "none (the result is a fresh AST)"

[[stage]]
number = 5
name = "Node-ID assignment"
entry = "assign_node_ids(program)"
source = "ast.tg"
representation = "the globally unique semantic node ids keying every downstream map"
authority = "assign_node_ids is the single authority that assigns the globally unique semantic node ids; every downstream map (expr_types, call_targets, access_effects, edge_cleanup, finalize_plan) is keyed by them; the driver never re-assigns"
consumed_by = "resolution, type checking, access, resource, MIR"

[[stage]]
number = 6
name = "Name resolution"
entry = "resolve_names(program)"
source = "resolver.tg"
representation = "ResolvedNames (call_targets, item_defs, method_defs, module_symbols, def_kinds, stable_ids)"
authority = "resolve_names is the only producer of ResolvedNames: DefIds (ModuleId + per-module symbol index), call_targets, item_defs, method_defs, module_symbols, def_kinds; strict resolution is forced on for compilation (permissive resolution is editor-recovery only, never codegenable)"
consumed_by = "type checking, access, resource, MIR, mono"

[[stage]]
number = 7
name = "Type checking"
entry = "type_check_typed(&mut env, &ast, &res)"
source = "types.tg"
representation = "TypedProgram (flat maps + typed_exprs Typed-HIR)"
authority = "type_check_typed is the only authority for types: expr_types, call_targets, call_instances (the SOLVED generic substitutions), field_targets (FieldId), the typed_exprs Typed-HIR nodes, deinit_plans, type_names/type_fields/type_variants/type_params/type_kinds; the item-8 semantic completeness oracle runs at the tail (the ICE-oracle for any accepted program with a residual placeholder)"
consumed_by = "access, resource, MIR, mono"

[[stage]]
number = 8
name = "Access checking"
entry = "access_check(&ast, &typed)"
source = "access_check.tg"
representation = "TypedProgram.access_effects"
authority = "access_check is the only authority over per-call access effects (Modify/Consume/Initialize exclusivity), recorded in TypedProgram.access_effects"
consumed_by = "resource checker, MIR"

[[stage]]
number = 9
name = "Resource checking"
entry = "resource_check(&ast, &typed)"
source = "resource_check.tg"
representation = "CfgEdge/CfgEdgeKind model; TypedProgram.finalize_plan + edge_cleanup"
authority = "resource_check is the only authority over the CFG edge model (CfgEdge/CfgEdgeKind + the per-edge action sequences), the per-function finalize_plan (fn owner key → local ids) and the per-edge edge_cleanup map; MIR consumes these instead of re-deriving ownership"
consumed_by = "MIR cleanup emission"

[[stage]]
number = 10
name = "MIR lowering"
entry = "driver_lower_to_mir(&ast, &typed)"
source = "mir.tg"
representation = "MirProgram (CFG with semantic projections)"
authority = "lower_to_mir is the only producer of the MirProgram CFG; semantic projections (Projection::Field(FieldId) / variant identity) are resolved BY ID from the typed program (typed_field_projection) — a missing FieldId is an ICE at the lowering site"
consumed_by = "mono, optimizer, codegen"

[[stage]]
number = 11
name = "MIR verification"
entry = "verify_mir(&mir)"
source = "mir.tg"
representation = "the verifier invariant set (the schema below)"
authority = "verify_mir is the single authority over the MIR invariant set and runs at EVERY boundary: post-lower, post-mono (unconditional — the generic substitution is a transformative boundary every build re-proves), after EVERY transformative optimizer pass (the verify-everything policy: debug/CI), post-opt, and IMMEDIATELY BEFORE codegen (the final firewall re-proves the exact IR instance codegen receives) — a verified MIR that passes is the only MIR that continues"
consumed_by = "a gate, not a transform"

[[stage]]
number = 12
name = "Monomorphization"
entry = "monomorphize_program(&mut mir, &mut mono_cache)"
source = "mono.tg"
representation = "MonoCache + InstanceId work queue; the item-8 MIR completeness oracle runs right after"
authority = "monomorphize_program is the only authority for instance identity (InstanceId = CallableId wrapping the DefId + the concrete substitutions), the mangled emission name (instance_key / mangle_name), and the work queue. ZERO-INFERENCE: the instance payload is the ONLY source of type arguments — a call with a generic base and no solved instance FAILS CLOSED (error, never inference)"
consumed_by = "optimizer, codegen (emission names)"

[[stage]]
number = 13
name = "MIR optimization"
entry = "optimize_mir(&mut mir, opt_level)"
source = "mir.tg"
representation = "MirProgram (transformed)"
authority = "optimize_mir is the only authority for MIR transformations, gated by opt_level; it must never change observable semantics"
consumed_by = "codegen"
note = "PGO (instrument_for_pgo / apply_pgo_profile) is an OPTIONAL, flag-gated sub-step: --pgo-gen instruments before optimization, --pgo-use loads a profile (a failed read is a hard error, never a silent fallback)"

[[stage]]
number = 14
name = "Code generation"
entry = "generate_object_file / generate_executable"
source = "codegen.tg"
representation = "layout/Repr table + IntrinsicId dispatch; preceded by the final firewall (verify_mir + run_mir_completeness_oracle)"
authority = "generate_object_file/generate_executable are the only authorities for instruction selection, the register-targeted DIRECT EMISSION (the inline per-function register state RegAllocState — alloc_reg / free_reg / alloc_reg_or_spill — NOT a standalone register-allocation pass), the layout/Repr table (layout_engine.tg), and intrinsic dispatch (IntrinsicId in codegen.tg)"
consumed_by = "linker, runtime"

# The stopping points. THE FACT: `tg check` sets stop_after = StopAfter::Mir
# (tg_compiler/driver.tg cmd_check) and stops after stage 11 — MIR lowered
# AND verified, before monomorphization/codegen. StopAfter::Semantic (after
# stage 9) is reachable only through the internal option, never through the
# `tg check` CLI.

[[stop_point]]
name = "tg check"
stop_after = "StopAfter::Mir"
after_stage = 11
description = "lexed, parsed, dependencies merged, macros expanded, node-id'd, resolved, type/access/resource-checked, lowered to MIR AND verified — without generating native code"
source = "driver.tg cmd_check: check_only = true; stop_after = StopAfter::Mir; compiler_core.tg: the stop return sits immediately after the post-lower verify_mir pass"
note = "the OLD 'tg check stops at StopAfter::Semantic' wording is WRONG (pipeline_manifest.md v2 said 'after stage 9')"

[[stop_point]]
name = "tg parse"
stop_after = "StopAfter::Parse"
after_stage = 2
description = "lex + parse only; no type-check or codegen"
source = "driver.tg cmd_parse: check_only = true; stop_after = StopAfter::Parse"

[[stop_point]]
name = "StopAfter::Semantic"
stop_after = "StopAfter::Semantic"
after_stage = 9
description = "after the semantic verification (type/access/resource checking); reachable through the internal CompilerOptions only — NOT the `tg check` CLI"
source = "compiler_core.tg (the StopAfter::Semantic return sits after the semantic-completeness oracle)"

[[stop_point]]
name = "--dump-phase tokens|ast"
stop_after = "debug dump"
after_stage = 1
description = "after stages 1/2 (debug dumps, not compilations)"
source = "compiler_core.tg dump_phase handling"

[[stop_point]]
name = "--dump-phase mir-lowered"
stop_after = "StopAfter::Mir"
after_stage = 11
description = "prints the lowered MIR (after the post-lower verification) and returns"
source = "compiler_core.tg dump_phase mir-lowered"

[[stop_point]]
name = "--emit-mir / --dump-phase mir-opt"
stop_after = "post-opt"
after_stage = 13
description = "after stage 13 (optimized AND verified)"
source = "compiler_core.tg"

[[stop_point]]
name = "EmitMode::Object + StopAfter::Object"
stop_after = "StopAfter::Object"
after_stage = 14
description = "after stage 14 object emission (the object file is materialized first)"
source = "compiler_core.tg (EmitMode::Object branch)"

# The verifier's schema — the CURRENT invariant set (the canonical-MIR lag
# resolution: canonical_ir_spec.md's INV-MIR-001..009 + the "re-verified
# (Stage 5 work)" note are stale; the seven invariants below are the live
# schema of verify_mir, mir.tg).

[verifier]
runs = ["post-lower", "post-mono (unconditional)", "after EVERY transformative optimizer pass (the verify-everything policy)", "post-opt", "immediately before codegen (the final firewall)"]
return = "Vec[String] of error messages; an empty vector means the MIR is valid; violations abort the compilation"

[[verifier.invariant]]
id = 1
name = "type concreteness"
description = "no Type::Param / Type::Var in MirTypeDef fields or variants; every Named type in a type definition keys a canonical TypeId in the deinit-plan table"

[[verifier.invariant]]
id = 2
name = "callee resolution"
description = "every MirFnItem callee names a lowered function or a known intrinsic"

[[verifier.invariant]]
id = 3
name = "structural validity"
description = "every function has ≥ 1 block, all block/local ids reference real entries (block ids are DISJOINT — the exactly-one-terminator rule), the entry block exists"

[[verifier.invariant]]
id = 4
name = "projection correctness"
description = "FieldId owner matches the projected TypeId (a missing FieldId is an ICE at the lowering site)"

[[verifier.invariant]]
id = 5
name = "cleanup soundness"
description = "deinit plans and edge actions agree with the block frames"

[[verifier.invariant]]
id = 6
name = "switch-discriminant contract"
description = "a MirSwitchInt discriminant is an integer-like scalar, its target values are pairwise distinct, and every value is a DECLARED variant discriminant when the discriminant type is an enum (an impossible enum discriminant is rejected)"

[[verifier.invariant]]
id = 7
name = "reachable placeholder rule"
description = "a reachable block ending in the MirUnreachable placeholder is rejected"

# The completeness oracles (the reviewer's item 8): USER MISTAKES get the
# stable diagnostics (the checker's E-codes, recorded before either oracle
# runs); the IMPOSSIBLE POST-TYPECHECK STATE (an accepted program with a
# residual placeholder) is the internal invariant failure, recorded as an
# ICE-class error that aborts compilation.

[[oracle]]
name = "run_semantic_completeness_oracle"
source = "types.tg"
when = "at the tail of type_check_typed — AFTER the typecheck, BEFORE the lowering"
description = "audits the accepted TypedProgram's channels: Type::Error / unresolved Type::Var / Param-in-concrete-position; UNKNOWN DefId (every call target and finalizer DefId must be a resolver-registered symbol); UNKNOWN FieldId / VariantId; MISSING ACCESS EFFECT (every typed call's receiver and arguments carry the recorded per-node effect); MISSING OBLIGATION SOLUTION (every registered trait impl is backed by its trait contract); UNKNOWN TypeId (the unknown-layout precursor)"

[[oracle]]
name = "run_mir_completeness_oracle"
source = "compiler_core.tg"
when = "right after monomorphization, again after optimization, and immediately before codegen"
description = "proves every type in the substituted IR — function signatures, locals, statics, and the registered type definitions — has a COMPUTABLE LAYOUT under the fail-closed layout_of_concrete (Var/Error/Param/unregistered named types all fail closed)"

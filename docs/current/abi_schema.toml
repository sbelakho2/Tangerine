# Tangerine ABI schema — the machine-readable FFI/layout facts.
#
# The reviewer's item 34: the manually maintained normative facts reduced to
# the machine-readable schema. THIS FILE is the single source for:
#   - the FFI mapping facts: the C type -> the Tangerine type -> size ->
#     alignment -> direction (the direction is the crossing: "in" = a
#     C-argument (C -> Tangerine), "out" = a C-return / export value
#     (Tangerine -> C), "in/out" = both directions legal);
#   - the FROZEN layout facts behind the stabilized tables (the Wave-A
#     safe-view authority: the Arc-class StrView/SharedSlice handles and the
#     StringPtr/Vec header shapes) — the generator renders
#     docs/current/abi_layout.md (the FFI tables) and
#     docs/current/stabilized_layout_tables.md (the frozen tables) from it.
#
# The facts are sourced from the layout authority — tg_compiler/layout_engine.tg
# (the Repr table, string_handle_layout_size=8, owned_string_object_size=32,
# the HeapVecHeader 32-byte stride-carrying shape, map_header_total_size=96,
# slice_view_layout, ffi_opaque_native_align), std/core.tg + std/collections.tg
# (the Wave-A shared/pinned safe views), docs/current/memory_model.md §9,
# and docs/current/ffi_cheatsheet.md (the C type mappings).
#
# Do NOT hand-edit the rendered docs: regenerate them.

version = 1


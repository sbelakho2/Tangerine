# ───────────────────────────────────────────────────────────────
# The frozen layout facts (the stabilized tables' authority — the
# Wave-A safe-view model). F-numbers match stabilized_subset.md.
# ───────────────────────────────────────────────────────────────

[layout.frozen.enum]
tag_offset = 0
tag_size = 8
payload_offset = 8
rule = "the discriminant (tag) sits at offset 0 with size 8; the payload starts at offset 8; the alignment is max(tag alignment, max payload field alignment); the total size is aligned to the max alignment"

[layout.frozen.struct]
rules = ["field order: declaration order (no reordering)", "field alignment: each field aligned to its natural alignment", "struct alignment: max of the field alignments", "struct size: aligned to the struct alignment"]

[layout.frozen.fixed_array]
form = "Type::FixedArray(elem, n) — the [T; N] annotation, distinct from the heap vector"
storage = "inline element storage, never a heap handle"
stride = "align_up(element_size, element_alignment)"
total_size = "element_stride * count (n == 0: size 0, a legal zero-length fixed array)"
bit_copyable = "exactly when the element type is (structural walk)"
note = "the named Array[T] syntax is the Adt (heap vector) form, never inline"

[layout.frozen.ffi_opaque]
names = ["PthreadT", "PthreadAttrT", "PthreadMutexT", "PthreadCondT", "PthreadBarrierT"]
rule = "the [u8; N] pthread opaques keep their byte SIZE but take the native C ALIGNMENT — the target pointer alignment (8 on both supported targets) — via ffi_opaque_native_align; a PthreadMutexT local can never land at a misaligned offset"

[[layout.frozen.primitive]]
name = "Unit"
size = 0
alignment = 1

[[layout.frozen.primitive]]
name = "Bool"
size = 1
alignment = 1

[[layout.frozen.primitive]]
name = "Char"

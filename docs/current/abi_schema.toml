# The container/value ABI (F2): one pointer-width handle (8 bytes) per
# value, pointing at the heap object listed. The sizes are the layout
# engine's (string_handle_layout_size / owned_string_object_size /
# container_header_size / map_header_total_size).
# The Wave-A safe views are the Arc-class handles to the pinned backings —
# the 8-byte handle, NOT the 16-byte fat value (the 16-byte {ptr,len} form
# is the raw view only: UnsafeSlice and the FFI FfiStr/FfiSlice).

[[layout.frozen.container]]
name = "String"
handle_repr = "StringPtr (8)"
handle_size = 8
object_size = 32
object_fields = "data@0, len@8, cap@16, stride@24"
ownership = "owned — the 8-byte handle points at the 32-byte OwnedStringObject; data points to the null-terminated UTF-8 buffer"
copy_op = "clone (never bit-copyable)"
drop = "MIR DeinitPlan::String -> _tg_string_drop (frees the object AND the buffer; real-heap allocation, never the bump arena)"
note = "the OLD 'no inline header' description is WRONG — the handle points at the 32-byte owned String object (memory_model.md §9)"

[[layout.frozen.container]]
name = "Vec[T] / Array[T]"
handle_repr = "HeapVecHeader (8)"
handle_size = 8
object_size = 32
object_fields = "data@0, len@8, cap@16, stride@24"
ownership = "owned — the heap vector (the named Array[T] syntax IS the Vec Adt form)"
copy_op = "move + clone"
drop = "the element buffer is released by the runtime"
note = "the 24-byte {ptr,len,cap} header is STALE — the current header is the stride-carrying 32-byte shape (the stride is the runtime's element-addressing authority)"

[[layout.frozen.container]]
name = "Map[K,V] / HashMap[K,V]"
handle_repr = "HeapMapHeader (8)"
handle_size = 8
object_size = 96
object_fields = "buckets@0, size@8, capacity@16, key_stride@24, key_align@32, value_stride@40, value_align@48, key_off@56, value_off@64, next_off@72, bucket_stride@80, free_list@88"
ownership = "owned"
copy_op = "move + clone"
drop = "the runtime map helpers"
note = "the 24-byte {buckets,len,cap} header is STALE — the runtime's Map header is the 96-byte raw arena + the concrete layout parameters (map_header_total_size); the canonical offsets are MAP_HEADER_FIELDS in layout_engine.tg"

[[layout.frozen.container]]
name = "Set[T] / HashSet[T]"
handle_repr = "HeapSetHeader (8)"
handle_size = 8
object_size = 96
object_fields = "the SAME 96-byte map header (Set is map-backed — the _tg_set_* helpers tail-call the map helpers)"
ownership = "owned"
copy_op = "move + clone"
drop = "the runtime set helpers"
note = "HashMap/HashSet are name-level aliases of Map/Set (same Repr, same header)"

[[layout.frozen.container]]
name = "FixedArray[T, N] ([T; N])"
handle_repr = "Inline (0 — part of the enclosing value)"
handle_size = 0
object_size = "n * stride"
object_fields = "n elements, stride = align_up(element_size, element_alignment)"
ownership = "the enclosing value"
copy_op = "structural"
drop = "element-wise"
note = "n == 0 is a legal zero-length array"

[[layout.frozen.container]]
name = "UnsafeSlice[T] (the raw view)"
handle_repr = "Inline (16-byte fat value {ptr@0, len@8})"
handle_size = 16
object_size = "none — the non-owning borrowed view"
object_fields = "ptr@0, len@8"
ownership = "none — borrowed, trivially copyable, no drop"
copy_op = "bit"
drop = "none"
note = "the compiler-scoped Slice[T] view (slice_view_layout); the unsafe/FFI-only form, NEVER a heap header"

[[layout.frozen.container]]
name = "SharedSlice[T] (the SAFE Slice)"
handle_repr = "8-byte Arc-class handle { inner: ArcStrong[SliceBacking[T]] }"
handle_size = 8
object_size = 24
object_fields = "the pinned backing SliceBacking[T] = { ptr@0, len@8, offset@16 }"
ownership = "shared — the Arc keeps the pinned backing alive; the view SURVIVES its source's drop"
copy_op = "the Arc-class clone"
drop = "the Arc drop"
note = "the Wave-A safe-view authority (std/collections.tg; memory_model.md §9) — source-spelled Slice[T] is this shared/pinned form"

[[layout.frozen.container]]
name = "StrView (the SAFE string view)"
handle_repr = "8-byte Arc-class handle { inner: ArcStrong[StrViewBacking] }"
handle_size = 8
object_size = 24
object_fields = "the pinned backing StrViewBacking = { ptr@0, len@8, offset@16 }"
ownership = "shared — the Arc keeps the pinned backing alive; the view SURVIVES its source's drop and its String's growth"
copy_op = "the Arc-class clone"
drop = "the Arc drop"
note = "the Wave-A safe-view authority (std/core.tg; memory_model.md §9) — the OLD 16-byte {ptr,len} fat-value description is STALE for the source-level StrView; the 16-byte form survives only as the internal raw view (UnsafeSlice) and the FFI FfiStr/FfiSlice"

[[layout.frozen.container]]
name = "CStringPtr"
handle_repr = "8-byte raw pointer"
handle_size = 8
object_size = "none"
object_fields = "—"
ownership = "borrowed — the raw pointer to NUL-terminated bytes"
copy_op = "bit"
drop = "none"
note = "the borrowed c-string form"


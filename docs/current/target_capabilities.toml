# Tangerine target capabilities — the machine-readable per-target capability
# matrix.
#
# The reviewer's item 14/34: per-target capability marks, HONEST — a
# capability is advertised with ✓ only when the CURRENT tree carries the
# committed evidence artifact for it. THIS FILE is the single source; the
# generator (scripts/gen_spec_docs.sh) renders docs/current/target_capabilities.md
# from it, and the CI evidence-gate job regenerates + `git diff --exit-code`
# on BOTH the schema and the rendered matrix — a stale hand-edited matrix
# cannot merge. The generator also mechanically verifies that every evidence
# artifact listed under a ✓ capability EXISTS in the tree (a ✓ without a
# committed artifact FAILS the generation).
#
# The honest-mark vocabulary (matching target_capabilities.md's rules):
#   - a ✓ requires a committed artifact that exercises the capability (the
#     evidence list below); "artifact-backed" is the strongest mark this
#     tree can claim — NO ladder/CI run has occurred on the working tree
#     (e1eb946 + the Wave-A work), so no row claims run-observed-at-this-SHA;
#   - the front-end rows (Parse/Type/MIR) are target-independent and
#     registered-triple-agnostic: a target with NO backend still gets them;
#   - Object/Static-link/Dynamic-extern/Native-run are strictly increasing in
#     difficulty — a row cannot advertise Native-run without Static-link, or
#     Static-link without Object (the generator enforces the chain).

version = 1

target_order = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-windows", "wasm32"]
capability_order = ["Parse", "Type", "MIR", "Object", "Static-link", "Dynamic-extern", "Native-run", "TLS", "Threads", "DB", "Debug"]

# The evidence artifacts shared by the target-independent front-end rows.
front_end_evidence = ["tests/canary", "tests/canary_neg", "tests/resource_cfg", "tests/differential"]

[capability."Parse"]
meaning = "the front end lexes/parses a Tangerine program for the target (target-independent — the front end runs on the host)"

[capability."Type"]
meaning = "the full semantic pipeline (type/access/resource checking) accepts programs for the target (target-independent front end)"

[capability."MIR"]
meaning = "lowering + verification + monomorphization + optimization complete for the target (the front-end boundary `--target <triple>` with `tg check` accepts any registered triple)"

[capability."Object"]
meaning = "the backend emits a relocatable object file for the target's format (Mach-O/ELF)"

[capability."Static-link"]
meaning = "the in-tree linker links a static executable (entry, sections, relocations) without an external linker"

[capability."Dynamic-extern"]
meaning = "extern declarations resolve against the platform's dynamic libraries (libSystem / glibc)"

[capability."Native-run"]
meaning = "an emitted executable runs natively on a host of that target"

[capability."TLS"]
meaning = "thread-local storage is implemented and test-covered"

[capability."Threads"]
meaning = "std::thread / pthread ABI surface works (the pthread opaques + the FFI-opaque alignment table)"

[capability."DB"]
meaning = "std/db connectivity is implemented and test-covered (mysql/postgres drivers)"

[capability."Debug"]
meaning = "debug info emission (`-g`) or a debugger surface exists"

[target."aarch64-apple-darwin"]
Parse = true
Type = true
MIR = true
Object = true
Static-link = true
Dynamic-extern = true
Native-run = true
TLS = true
Threads = true
DB = true
Debug = false
evidence = ["tests/run_target_lane_canaries.sh", "tests/thread_local_drop_test.tg", "tests/pthread_abi_test.tg", "tests/db_mysql_integration_test.tg", "tests/db_postgres_integration_test.tg", "tests/db_async_pool_test.tg"]
notes = "the bootstrap host: the ARM64 backend (asm.tg AArch64 encoder), the Mach-O object writer and the in-tree Mach-O linker (linker.tg — dyld import stubs, bind opcodes, LC_LOAD_DYLIB libSystem.B.dylib) are the committed artifacts. TLS: @thread_local statics + thread_local_drop_test.tg. Threads: std/thread.tg pthread opaques + the FFI-opaque alignment override (ffi_opaque_native_align) + pthread_abi_test.tg. DB: std/db.tg mysql/postgres dispatch + the integration suites. The ✓ row is artifact-backed — NO ladder/CI run has occurred on THIS tree (the host IS the target of the tree's bootstrap ladder, but no run-observed mark is claimed)."

[target."x86_64-unknown-linux-gnu"]
Parse = true
Type = true
MIR = true
Object = true
Static-link = true
Dynamic-extern = true
Native-run = false
TLS = false
Threads = false
DB = false
Debug = false
evidence = ["tests/run_target_lane_canaries.sh"]
notes = "the x86-64 ELF backend (asm.tg x64 encoder + ELF64 object writer + ELF linker: EM_X86_64, the PLT/GOT stub machinery, R_X86_64_* relocations) is committed; parse_target_triple resolves the triple. Dynamic-extern: the ELF extern-stub surface (the linker's extern_stub_map/PLT path). Native-run/TLS/Threads/DB are ✗: no executed evidence on this tree — the x86_64 host lane is the committed artifact, not an observed run."

[target."x86_64-apple-darwin"]
Parse = true
Type = true
MIR = true
Object = true
Static-link = false
Dynamic-extern = false
Native-run = false
TLS = false
Threads = false
DB = false
Debug = false
evidence = ["tests/run_target_lane_canaries.sh"]
notes = "the x86-64 backend + Mach-O object writer are target-generic (the same Mach-O builder serves both Apple targets); the cross lane (x86_64-apple-darwin under Rosetta) is the committed artifact. Static-link/dynamic-extern are ✗: the Mach-O linker's x86-64 executable path (import stubs for x86-64 Mach-O, the X86_64_RELOC_* pair handling) is not exercised by a committed run on this tree. The honest mark: an object-capable target with no executed link/run evidence."

[target."x86_64-windows"]
Parse = true
Type = true
MIR = true
Object = false
Static-link = false
Dynamic-extern = false
Native-run = false
TLS = false
Threads = false
DB = false
Debug = false
evidence = []
notes = "no PE/COFF object writer, no Windows linker, no Windows ABI table. The triple parses, so Parse/Type/MIR ✓ — and nothing after that."

[target."wasm32"]
Parse = true
Type = true
MIR = true
Object = false
Static-link = false
Dynamic-extern = false
Native-run = false
TLS = false
Threads = false
DB = false
Debug = false
evidence = []
notes = "wasm_target.tg builds WASM sections but nothing calls it: no `--target wasm32*` route in driver.tg/codegen.tg (feature_matrix.md §III.4 agrees). Parse/Type/MIR ✓ (the front end is target-independent), Object ✗ (the WASM builder is not wired into the object pipeline), everything below ✗."

[target."Debug-notes"]
text = "Debug — every target ✗. `-g` sets `debug_info` but no committed artifact executes a debugger surface (`tg debug`/debugger.tg is not wired); the honest mark is ✗ everywhere."

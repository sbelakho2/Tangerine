# Tangerine feature registry — the machine-readable source of truth.
#
# This file is the INPUT to scripts/gen_feature_registry.sh, which renders
# docs/current/feature_registry.md. The markdown registry is GENERATED
# EVIDENCE: the CI evidence-gate job regenerates it and runs
# `git diff --exit-code`, so a hand-edited or drifted registry cannot merge.
#
# Status derivation is MECHANICAL (never hand-asserted in the markdown):
#   - status = "implemented": the derived status is
#     "implemented + test-covered" when every `tests` path exists and
#     every named `suites` manifest contains the file; the generator
#     FAILS on a missing test path or a missing suite entry (a listed
#     artifact that does not exist is a broken registry).
#     "implemented + unverified" when `tests` is empty.
#   - status = "partial" | "api-only" | "design" | "unsupported":
#     passed through verbatim.
#   - `ci_job`: when present, the generator greps .github/workflows/ci.yml
#     for the job id and FAILS when it is absent — a required gate named
#     in the registry must exist in the workflow.
#   - "implemented + run-verified at SHA" is NEVER derivable from source:
#     it requires the CI status-snapshot artifact (STATUS.txt generated
#     by scripts/gen_status.sh from the tested SHA + the artifact
#     hashes). This file records source-state facts only.

[feature."access-conventions"]
summary = "Access conventions (let / inout / sink / set; let is the default observe convention — read-only access, no move; the by-value move is sink)"
status = "implemented"
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
enforcing = "tg_compiler/parser.tg parse_param (the ONLY parameter spellings); tg_compiler/types.tg access check"
tests = [
  "tests/canary/canary_access_read.tg",
  "tests/canary/canary_access_inout.tg",
  "tests/canary/canary_access_set.tg",
  "tests/canary/canary_access_sink.tg",
  "tests/canary_neg/canary_neg_access_sink_twice.tg",
  "tests/canary_neg/canary_neg_access_sink_use_after.tg",
]

[feature."algebraic-effects"]
summary = "Algebraic effects — the typed row: the effect declarations' operations register as the semantic EffectIds' typed op tables (parse_effect_decl op signatures; the checker's TypedEffectDecl records); the std::effects::perform(EFFECT.op, ...) operation-call surface types against the declared ops; the MIR lowers perform to MirEffectPerform (effect id + op index + payload/result frame pointers) and the handler blocks to MirEffectFrameEnter/Exit + the synthesized dispatcher functions; the runtime is the DIRECT-STYLE handler stack (the task's linked handler frames written into the installing function's frame slot) — perform dispatches to the innermost matching handler, a handler that does not handle an op re-performs it to the outer handler (the frame bitmap skip), and an unhandled op is the defined error (stderr message + abort). Retained experimental: the bounded row is Copy-payload only (no resource ownership across the perform boundary) and a handler cannot span an async task boundary."
status = "implemented"
experimental = true
modules = ["effects"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
enforcing = "tg_compiler/types.tg TypedEffectDecl/typed_effects + the perform/handle typing; tg_compiler/mir.tg MirEffectPerform + MirEffectFrameEnter/Exit + lower_pending_dispatchers; tg_compiler/codegen.tg the __tg_effect_perform / __tg_effect_frame_push / __tg_effect_frame_pop arms + the effect frame slot; tg_compiler/runtime.tg the handler-stack emitters; std/effects.tg perform"
tests = [
  "tests/effects/effect_state_test.tg",
  "tests/effects/effect_reperform_test.tg",
  "tests/effects/effect_unhandled_test.tg",
  "tests/effects/effect_async_test.tg",

# Tangerine feature registry — the machine-readable source of truth.
#
# This file is the INPUT to scripts/gen_feature_registry.sh, which renders
# docs/current/feature_registry.md. The markdown registry is GENERATED
# EVIDENCE: the CI evidence-gate job regenerates it and runs
# `git diff --exit-code`, so a hand-edited or drifted registry cannot merge.
#
# The typed `status` is the DECLARED input — the reviewer's item 5
# elimination leaves exactly TWO statuses on the release surface:
#   implemented            the feature is fully implemented in the tree
#                          (with the enforcing code + the test artifacts)
#   excluded-from-release  the feature is EXPLICITLY REMOVED from the
#                          release surface (the row's status: the
#                          partial / api-only / design / unsupported
#                          vocabulary is GONE — a row that is not
#                          implemented must carry the explicit removal;
#                          the feature's surface is gated — the
#                          `experimental` flag + `modules` list gate the
#                          platform-only std surfaces out of the
#                          shipped-std behavior claims, and the tool/
#                          doc-only rows carry no release claims)
# The generator then CALCULATES the item-36 STATUS LADDER position —
# never typed here:
#
#   DECLARED -> IMPLEMENTED -> SEMANTICALLY_CHECKED -> NATIVE_TESTED ->
#   ADVERSARIAL_TESTED -> TARGET_COMPLETE -> EXACT_SHA_VERIFIED ->
#   RELEASE_GATED
#
#   - DECLARED: the row exists in this file.
#   - IMPLEMENTED: the declared status is implemented/partial AND every
#     enforcing-file reference exists in the tree (the `enforcing` text's
#     leading path tokens name real files).
#   - SEMANTICALLY_CHECKED: every listed `tests` path exists (the
#     artifact is committed; std modules are additionally covered by the
#     E106 sweep).
#   - NATIVE_TESTED: at least one listed artifact is a native behavior
#     artifact (a tests/**/*.tg file — canary or @test — or a
#     tests/run_*.sh gate that executes tests).
#   - ADVERSARIAL_TESTED: at least one listed artifact is adversarial
#     (tests/canary_neg, tests/fuzz, tests/differential,
#     tests/slice_safety, or a *neg*/*fuzz* gate).
#   - TARGET_COMPLETE: every declared target is a SERVED target (the
#     honest capability matrix: aarch64-apple-darwin,
#     x86_64-unknown-linux-gnu, x86_64-apple-darwin — windows/wasm32 are
#     not served, so a row declaring them cannot reach this position) AND
#     the feature holds NATIVE_TESTED.
#   - EXACT_SHA_VERIFIED: TARGET_COMPLETE AND the release-evidence file
#     (build/release_evidence.json, written ONLY by
#     scripts/gen_status.sh --release-evidence from the tested-SHA run
#     artifacts) exists with a tested sha + artifact hashes.
#   - RELEASE_GATED: the feature is listed in the release-evidence file's
#     `release_gated_features`. NEVER derivable from source: it requires
#     the release-run evidence (the API-manifest release check + the
#     completeness enumeration + the run artifacts). The generator reads
#     the file; it never invents the position.
#
#   "implemented + run-verified at SHA" is NEVER derivable from source:
#   it requires the CI status-snapshot artifact (STATUS.txt generated by
#   scripts/gen_status.sh from the tested SHA + the artifact hashes).
#   This file records source-state facts only.
#
# The EXPERIMENTAL GATE (the reviewer's item 33 stable-subset policy):
# a row with `experimental = true` flags a platform-only surface whose
# targets are unsupported/API-only. The `modules = [...]` list names the
# std modules the row gates (the completeness model's experimental
# family); the generator CROSS-CHECKS that the contracts manifest and
# this file agree on every experimental module. Experimental rows are
# excluded from the shipped-std behavior claims.

